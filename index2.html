// ============================================================
// 游戏：切水果（继承TimedGame）
// ============================================================
class FruitNinjaGame extends TimedGame {
  onStart() {
    const cfg = GAME_CONFIGS.fruitninja.difficulties[this.difficulty];
    this.cfg = cfg;
    this.durationSec = cfg.duration;
    this.elapsedSec = 0;
    this.fruits = [];
    this.particles = [];
    this.spawnTimer = 0;
    this.lastPointer = null;
    this.lastPointer2 = null;
    this._bindMove();
    this.setupBg('diagonal', ['#FF4444', '#4488FF'], 45, 25);
    this.fruitEmojis = ['🍎','🍌','🍇','🍓','🍑','🍉','🍊','🥝','🍍'];
  }

  _bindMove() {
    const canvas = document.getElementById('game-canvas');
    this._moveHandler = (e) => {
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      this.lastPointer2 = this.lastPointer;
      this.lastPointer = { x, y };
    };
    canvas.addEventListener('pointermove', this._moveHandler);
  }

  _spawnFruit() {
    const r = this.cfg.radius;
    const x = Utils.rand(r * 2, this.W - r * 2);
    const isBomb = Math.random() < this.cfg.bombProb;
    this.fruits.push({
      x, y: this.H + r,
      vx: Utils.rand(-50, 50),
      vy: -Utils.rand(400, 600),
      r,
      emoji: isBomb ? '💣' : this.fruitEmojis[Utils.randInt(0, this.fruitEmojis.length-1)],
      isBomb,
      sliced: false,
      rotation: 0,
      rotSpeed: Utils.rand(-3, 3)
    });
  }

  onUpdate(dt) {
    if (this.finished) return;
    this.elapsedSec += dt;
    if (this.elapsedSec >= this.durationSec) { this.finish(); }
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.cfg.spawnInterval) {
      this.spawnTimer = 0;
      this._spawnFruit();
    }
    // 更新水果
    for (let i = this.fruits.length - 1; i >= 0; i--) {
      const f = this.fruits[i];
      f.x += f.vx * dt;
      f.y += f.vy * dt;
      f.vy += this.cfg.gravity * dt;
      f.rotation += f.rotSpeed * dt;
      if (f.y > this.H + f.r * 2) this.fruits.splice(i, 1);
      // 检测切割（pointer线段与水果相交）
      if (!f.sliced && this.lastPointer && this.lastPointer2) {
        const d = GameUtils.pointToLineDist(f.x, f.y, this.lastPointer2.x, this.lastPointer2.y, this.lastPointer.x, this.lastPointer.y);
        if (d < f.r * 0.9) {
          f.sliced = true;
          if (f.isBomb) {
            // 切到炸弹，扣分但不结束游戏
            for (let k = 0; k < 30; k++) {
              const ang = (k / 30) * Math.PI * 2;
              this.particles.push({
                x: f.x, y: f.y,
                vx: Math.cos(ang) * (200 + Math.random() * 300),
                vy: Math.sin(ang) * (200 + Math.random() * 300),
                life: 0.6 + Math.random() * 0.4, color: k % 3 === 0 ? '#FF0000' : (k % 3 === 1 ? '#FF6600' : '#FFCC00'), size: 6 + Math.random() * 6
              });
            }
            this.recordResult(false, 0);
            Audio.alarm();
            return;
          } else {
            this.recordResult(true, 0);
            Audio.pop();
            // 果汁粒子
            for (let k = 0; k < 10; k++) {
              const ang = (k / 10) * Math.PI * 2;
              this.particles.push({
                x: f.x, y: f.y,
                vx: Math.cos(ang) * 200, vy: Math.sin(ang) * 200,
                life: 0.5, color: '#FF6B6B', size: 3
              });
            }
          }
        }
      }
    }
    // 粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 500 * dt;
      p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    // 衰减pointer轨迹
    if (this.lastPointer2) {
      const d = Utils.dist(this.lastPointer.x, this.lastPointer.y, this.lastPointer2.x, this.lastPointer2.y);
      if (d > 80) this.lastPointer2 = null;
    }
    this.callbacks.onProgress(this.getProgress());
  }

  onInput(e) {
    if (this.finished) return;
    this.lastPointer2 = this.lastPointer;
    this.lastPointer = { x: e.x, y: e.y };
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 水果
    this.fruits.forEach(f => {
      if (f.sliced) return;
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      GameUtils.drawEmoji(ctx, f.emoji, 0, 0, f.r * 2);
      ctx.restore();
    });
    // 粒子
    this.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life);
      ctx.fillStyle = p.color;
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI*2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    // 切割轨迹
    if (this.lastPointer && this.lastPointer2) {
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 4;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(this.lastPointer2.x, this.lastPointer2.y);
      ctx.lineTo(this.lastPointer.x, this.lastPointer.y);
      ctx.stroke();
    }
  }
}
registerGame('fruitninja', FruitNinjaGame);

// ============================================================
// 游戏：接金币（继承TimedGame）
// ============================================================
class CatchCoinGame extends TimedGame {
  onStart() {
    const cfg = GAME_CONFIGS.catchcoin.difficulties[this.difficulty];
    this.cfg = cfg;
    this.durationSec = cfg.duration;
    this.elapsedSec = 0;
    this.items = [];
    this.spawnTimer = 0;
    this.basketX = this.W / 2;
    this.basketY = this.H - 60;
    this._bindMove();
    this.setupBg('checker', ['#FF4444', '#4488FF'], 50, 20);
  }

  _bindMove() {
    const canvas = document.getElementById('game-canvas');
    this._moveHandler = (e) => {
      const rect = canvas.getBoundingClientRect();
      this.basketX = Utils.clamp(e.clientX - rect.left, this.cfg.basketW/2, this.W - this.cfg.basketW/2);
    };
    canvas.addEventListener('pointermove', this._moveHandler);
  }

  _spawnItem() {
    const isBomb = Math.random() < this.cfg.bombProb;
    this.items.push({
      x: Utils.rand(20, this.W - 20),
      y: -20,
      vy: this.cfg.speed * Utils.rand(0.85, 1.15),
      emoji: isBomb ? '💣' : '🪙',
      isBomb,
      r: 20,
      caught: false
    });
  }

  onUpdate(dt) {
    if (this.finished) return;
    this.elapsedSec += dt;
    if (this.elapsedSec >= this.durationSec) { this.finish(); }
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.cfg.spawnInterval) {
      this.spawnTimer = 0;
      this._spawnItem();
    }
    for (let i = this.items.length - 1; i >= 0; i--) {
      const it = this.items[i];
      it.y += it.vy * dt;
      if (it.y > this.H + 30) {
        if (!it.isBomb && !it.caught) {
          // 漏掉金币不算对
          this.totalTrials++;
          this.callbacks.onProgress(this.getProgress());
        }
        this.items.splice(i, 1);
        continue;
      }
      // 检测接住
      if (!it.caught && it.y > this.basketY - 20 && it.y < this.basketY + 20) {
        if (Math.abs(it.x - this.basketX) < this.cfg.basketW / 2) {
          it.caught = true;
          if (it.isBomb) {
            // 接到炸弹，爆炸！游戏结束
            this.recordResult(false, 0);
            Audio.mistake();
            this.finish();
            return;
          } else {
            this.recordResult(true, 0);
            Audio.success();
          }
          this.items.splice(i, 1);
        }
      }
    }
    this.callbacks.onProgress(this.getProgress());
  }

  onInput(e) {
    if (this.finished) return;
    this.basketX = Utils.clamp(e.x, this.cfg.basketW/2, this.W - this.cfg.basketW/2);
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 地面
    ctx.fillStyle = 'rgba(139,111,71,0.8)';
    ctx.fillRect(0, this.H - 30, this.W, 30);
    // 物品
    this.items.forEach(it => {
      if (!it.caught) GameUtils.drawEmoji(ctx, it.emoji, it.x, it.y, it.r * 2);
    });
    // 篮子
    ctx.fillStyle = '#8B4513';
    ctx.beginPath();
    ctx.moveTo(this.basketX - this.cfg.basketW/2, this.basketY - 20);
    ctx.lineTo(this.basketX + this.cfg.basketW/2, this.basketY - 20);
    ctx.lineTo(this.basketX + this.cfg.basketW/2 - 8, this.basketY + 10);
    ctx.lineTo(this.basketX - this.cfg.basketW/2 + 8, this.basketY + 10);
    ctx.closePath();
    ctx.fill();
    ctx.strokeStyle = '#5C2E08';
    ctx.lineWidth = 3;
    ctx.stroke();
    // 篮子边
    ctx.strokeStyle = '#5C2E08';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(this.basketX - this.cfg.basketW/2 - 5, this.basketY - 20);
    ctx.lineTo(this.basketX + this.cfg.basketW/2 + 5, this.basketY - 20);
    ctx.stroke();
  }
}
registerGame('catchcoin', CatchCoinGame);

// ============================================================
// 游戏：星星保持
// ============================================================
class StarHoldGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.starhold.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.starX = this.W / 2;
    this.starY = this.H / 2;
    this.alpha = 1;
    this.holdTime = 0;
    this.trialStartTime = performance.now();
    this.lastClickTime = 0;
    this.setupBg('diagonal', ['#222222', '#FFFFFF'], 40, 25);
    this._genTrial();
  }

  _genTrial() {
    this.alpha = 1;
    this.holdTime = 0;
    this.trialStartTime = performance.now();
    this.lastClickTime = 0;
  }

  onUpdate(dt) {
    if (this.finished) return;
    // alpha衰减
    this.alpha -= this.cfg.decay * dt;
    this.alpha = Math.max(0, this.alpha);
    // 点击间隔限制
    if (this.lastClickTime > 0) {
      const since = performance.now() - this.lastClickTime;
      if (since < this.cfg.clickInterval * 1000) {
        // 不能恢复
      } else {
        // 等待点击
      }
    }
    // 持有时间累积（alpha>0时）
    if (this.alpha > 0.05) {
      this.holdTime += dt;
    } else {
      // 失败
      this.recordResult(false, performance.now() - this.trialStartTime);
      Audio.mistake();
      this.currentTrial++;
      if (this.currentTrial >= this.cfg.trials) {
        setTimeout(() => this.finish(), 500);
      } else {
        setTimeout(() => this._genTrial(), 800);
      }
      return;
    }
    // 达到holdTime则成功
    if (this.holdTime >= this.cfg.holdTime) {
      const rt = performance.now() - this.trialStartTime;
      this.recordResult(true, rt);
      Audio.success();
      this.currentTrial++;
      if (this.currentTrial >= this.cfg.trials) {
        setTimeout(() => this.finish(), 500);
      } else {
        setTimeout(() => this._genTrial(), 800);
      }
    }
  }

  onInput(e) {
    if (this.finished) return;
    if (Utils.dist(e.x, e.y, this.starX, this.starY) <= this.cfg.radius * 1.5) {
      // 检查点击间隔
      if (this.lastClickTime > 0) {
        const since = performance.now() - this.lastClickTime;
        if (since < this.cfg.clickInterval * 1000) return;
      }
      this.alpha = Math.min(1, this.alpha + 0.4);
      this.lastClickTime = performance.now();
      Audio.click();
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#FFF';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`保持星星 · ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W/2, 30);
    ctx.fillText(`已保持 ${this.holdTime.toFixed(1)} / ${this.cfg.holdTime}s`, this.W/2, 55);
    // 进度条
    ctx.fillStyle = '#333';
    ctx.fillRect(this.W/2 - 100, 70, 200, 8);
    ctx.fillStyle = '#4ADE80';
    ctx.fillRect(this.W/2 - 100, 70, 200 * (this.holdTime / this.cfg.holdTime), 8);
    // 星星
    ctx.globalAlpha = this.alpha;
    this._drawStar(ctx, this.starX, this.starY, this.cfg.radius, '#FFD700');
    ctx.globalAlpha = 1;
    // 提示
    if (this.alpha < 0.3) {
      ctx.fillStyle = `rgba(255,255,255,${0.5 + Math.sin(performance.now()/100)*0.3})`;
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('快点击星星！', this.W/2, this.starY + this.cfg.radius + 40);
    }
  }

  _drawStar(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}
registerGame('starhold', StarHoldGame);

// ============================================================
// 游戏：消失目标
// ============================================================
class FadeOutGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.fadeout.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.setupBg('wavy', ['#222222', '#FFFFFF'], 40, 20);
    this._genTrial();
  }

  _genTrial() {
    const pad = this.cfg.radius + 40;
    this.targetX = Utils.rand(pad, this.W - pad);
    this.targetY = Utils.rand(pad + 60, this.H - pad);
    this.spawnTime = performance.now();
    this.alpha = 1;
    this.answered = false;
    this.feedback = 0;
  }

  onUpdate(dt) {
    if (this.finished) return;
    if (this.answered) {
      this.feedback -= dt;
      if (this.feedback <= 0) {
        this.currentTrial++;
        if (this.currentTrial >= this.cfg.trials) { this.finish(); return; }
        this._genTrial();
      }
      return;
    }
    const elapsed = (performance.now() - this.spawnTime) / 1000;
    if (elapsed < this.cfg.fadeTime) {
      this.alpha = 1 - elapsed / this.cfg.fadeTime;
    } else if (elapsed < this.cfg.fadeTime + this.cfg.timeWindow) {
      this.alpha = 0;
      // 在时间窗内
    } else {
      // 超时miss
      this.recordResult(false, elapsed * 1000);
      Audio.mistake();
      this.answered = true;
      this.feedback = 0.4;
    }
  }

  onInput(e) {
    if (this.finished || this.answered) return;
    const elapsed = (performance.now() - this.spawnTime) / 1000;
    if (Utils.dist(e.x, e.y, this.targetX, this.targetY) <= this.cfg.radius * 1.5) {
      const rt = elapsed * 1000;
      // 必须在消失瞬间的时间窗内点击
      if (elapsed >= this.cfg.fadeTime && elapsed < this.cfg.fadeTime + this.cfg.timeWindow) {
        this.recordResult(true, rt);
        Audio.success();
      } else if (elapsed < this.cfg.fadeTime) {
        // 太早
        this.recordResult(false, rt);
        Audio.mistake();
      } else {
        this.recordResult(false, rt);
        Audio.mistake();
      }
      this.answered = true;
      this.feedback = 0.4;
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#FFF';
    ctx.font = '14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`消失目标 · ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W/2, 30);
    ctx.fillText('目标消失时立即点击！', this.W/2, 55);
    // 目标
    ctx.globalAlpha = Math.max(0, this.alpha);
    ctx.fillStyle = '#FFD700';
    ctx.beginPath();
    ctx.arc(this.targetX, this.targetY, this.cfg.radius, 0, Math.PI*2);
    ctx.fill();
    ctx.globalAlpha = 1;
    // 提示圈
    if (!this.answered) {
      ctx.strokeStyle = `rgba(255,255,255,${0.2 + Math.sin(performance.now()/200)*0.1})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(this.targetX, this.targetY, this.cfg.radius + 8, 0, Math.PI*2);
      ctx.stroke();
    }
  }
}
registerGame('fadeout', FadeOutGame);

// ============================================================
// 游戏：顺序记忆
// ============================================================
class SeqMemoryGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.seqmemory.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.pads = [];
    this.sequence = [];
    this.userIdx = 0;
    this.phase = 'showing'; // showing | input | feedback
    this.showIdx = 0;
    this.showTimer = 0;
    this.setupBg('zigzag', ['#1B5E3B', '#E8F5E9'], 35, 25);
    this._initPads();
    this._genSequence();
    this._startShow();
  }

  _initPads() {
    const n = this.cfg.pads;
    const cols = n <= 4 ? 2 : n <= 6 ? 3 : 4;
    const rows = Math.ceil(n / cols);
    const size = Math.min((this.W - 60) / cols, (this.H - 120) / rows) * 0.85;
    const totalW = cols * size + (cols - 1) * 16;
    const totalH = rows * size + (rows - 1) * 16;
    const startX = (this.W - totalW) / 2;
    const startY = 80 + ((this.H - 120) - totalH) / 2;
    const colors = ['#FF6B6B','#4A9EFF','#FFB84D','#4ADE80','#9B6BFF','#FF6B35','#06B6D4','#EC4899','#10B981'];
    this.pads = [];
    for (let i = 0; i < n; i++) {
      const c = i % cols;
      const r = Math.floor(i / cols);
      this.pads.push({
        x: startX + c * (size + 16),
        y: startY + r * (size + 16),
        w: size, h: size,
        color: colors[i % colors.length],
        lit: false,
        idx: i
      });
    }
  }

  _genSequence() {
    this.sequence = [];
    for (let i = 0; i < this.cfg.seqLen; i++) {
      this.sequence.push(Utils.randInt(0, this.cfg.pads - 1));
    }
  }

  _startShow() {
    this.phase = 'showing';
    this.showIdx = 0;
    this.showTimer = 0;
    this.pads.forEach(p => p.lit = false);
  }

  onUpdate(dt) {
    if (this.finished) return;
    if (this.phase === 'showing') {
      this.showTimer += dt;
      const stepDur = this.cfg.flashInterval;
      const step = Math.floor(this.showTimer / stepDur);
      // 关闭所有
      this.pads.forEach(p => p.lit = false);
      if (step < this.sequence.length * 2) {
        // 偶数step亮，奇数step灭
        if (step % 2 === 0) {
          const seqIdx = step / 2;
          if (seqIdx < this.sequence.length) {
            const pad = this.pads[this.sequence[seqIdx]];
            if (pad) pad.lit = true;
          }
        }
      } else {
        // 进入输入阶段
        this.phase = 'input';
        this.userIdx = 0;
      }
    }
  }

  onInput(e) {
    if (this.finished || this.phase !== 'input') return;
    for (const pad of this.pads) {
      if (e.x >= pad.x && e.x <= pad.x + pad.w && e.y >= pad.y && e.y <= pad.y + pad.h) {
        pad.lit = true;
        setTimeout(() => { pad.lit = false; }, 200);
        const expected = this.sequence[this.userIdx];
        if (pad.idx === expected) {
          this.userIdx++;
          Audio.click();
          if (this.userIdx >= this.sequence.length) {
            // 完成本关
            const rt = performance.now() - this.startTime;
            this.recordResult(true, rt);
            Audio.success();
            this.currentTrial++;
            if (this.currentTrial >= this.cfg.trials) {
              setTimeout(() => this.finish(), 500);
            } else {
              this._genSequence();
              setTimeout(() => this._startShow(), 800);
            }
          }
        } else {
          // 错误
          this.recordResult(false, performance.now() - this.startTime);
          Audio.mistake();
          this.currentTrial++;
          if (this.currentTrial >= this.cfg.trials) {
            setTimeout(() => this.finish(), 500);
          } else {
            this._genSequence();
            setTimeout(() => this._startShow(), 1000);
          }
        }
        return;
      }
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`顺序记忆 · ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W/2, 30);
    ctx.font = '14px sans-serif';
    if (this.phase === 'showing') {
      ctx.fillText('记住顺序...', this.W/2, 55);
    } else if (this.phase === 'input') {
      ctx.fillText(`按顺序点击 ${this.userIdx} / ${this.sequence.length}`, this.W/2, 55);
    }
    this.pads.forEach(pad => {
      ctx.fillStyle = pad.lit ? pad.color : pad.color + '40';
      GameUtils.drawRoundRect(ctx, pad.x, pad.y, pad.w, pad.h, 12);
      ctx.fill();
      if (pad.lit) {
        ctx.strokeStyle = '#FFF';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    });
  }
}
registerGame('seqmemory', SeqMemoryGame);

// ============================================================
// 游戏：连线
// ============================================================
class ConnectLineGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.connectline.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.levels;
    this.currentLevel = 0;
    this.setupBg('dots', ['#F0FDF4', '#BBF7D0'], 40, 15, 'hstripes', ['#FF4444', '#44CC44'], 45, 12);
    this._genLevel();
  }

  _genLevel() {
    const cfg = this.cfg;
    // 动物-食物配对
    const allPairs = [
      { animal: '🐰', food: '🥕' }, { animal: '🐱', food: '🐟' }, { animal: '🐶', food: '🦴' },
      { animal: '🐒', food: '🍌' }, { animal: '🐭', food: '🧀' }, { animal: '🐼', food: '🎋' },
      { animal: '🐻', food: '🍯' }, { animal: '🦁', food: '🥩' }
    ];
    const selected = Utils.shuffle(allPairs).slice(0, cfg.pairs);
    this.pairs = selected;
    // 左侧动物
    this.leftItems = selected.map((p, i) => ({
      x: 50, y: 80 + i * ((this.H - 120) / cfg.pairs),
      emoji: p.animal, idx: i, side: 'left', matched: false
    }));
    // 右侧食物（打乱）
    const rightShuffled = Utils.shuffle(selected.map((p, i) => ({...p, origIdx: i})));
    this.rightItems = rightShuffled.map((p, i) => ({
      x: this.W - 50, y: 80 + i * ((this.H - 120) / cfg.pairs),
      emoji: p.food, idx: p.origIdx, side: 'right', matched: false
    }));
    // 干扰项
    this.distractors = [];
    for (let i = 0; i < cfg.distractors; i++) {
      const isLeft = Math.random() < 0.5;
      const distractors = ['🦊','🐻','🦝','🌮','🍔','🍕'];
      const e = distractors[Utils.randInt(0, distractors.length-1)];
      if (isLeft) {
        this.leftItems.push({
          x: 50, y: 80 + this.leftItems.length * ((this.H - 120) / (cfg.pairs + cfg.distractors)),
          emoji: e, idx: -1, side: 'left', matched: false, isDistractor: true
        });
      } else {
        this.rightItems.push({
          x: this.W - 50, y: 80 + this.rightItems.length * ((this.H - 120) / (cfg.pairs + cfg.distractors)),
          emoji: e, idx: -2, side: 'right', matched: false, isDistractor: true
        });
      }
    }
    this.connections = [];
    this.draggingFrom = null;
    this.dragX = 0; this.dragY = 0;
    this.matchedCount = 0;
    this.levelStartTime = performance.now();
    this._bindDrag();
  }

  _bindDrag() {
    const canvas = document.getElementById('game-canvas');
    this._moveHandler = (e) => {
      const rect = canvas.getBoundingClientRect();
      this.dragX = e.clientX - rect.left;
      this.dragY = e.clientY - rect.top;
    };
    this._upHandler = (e) => {
      if (!this.draggingFrom) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      // 找到目标
      let target = null;
      const targetList = this.draggingFrom.side === 'left' ? this.rightItems : this.leftItems;
      for (const it of targetList) {
        if (GameUtils.hitEmoji(x, y, it.x, it.y, 40)) { target = it; break; }
      }
      if (target && !target.matched && !target.isDistractor) {
        if (target.idx === this.draggingFrom.idx && this.draggingFrom.idx >= 0) {
          // 匹配成功
          this.draggingFrom.matched = true;
          target.matched = true;
          this.connections.push({ from: this.draggingFrom, to: target });
          this.matchedCount++;
          Audio.success();
          if (this.matchedCount >= this.cfg.pairs) {
            const rt = performance.now() - this.levelStartTime;
            this.recordResult(true, rt);
            this.currentLevel++;
            if (this.currentLevel >= this.cfg.levels) {
              setTimeout(() => this.finish(), 500);
            } else {
              setTimeout(() => this._genLevel(), 800);
            }
          }
        } else {
          this.recordResult(false, performance.now() - this.levelStartTime);
          Audio.mistake();
        }
      }
      this.draggingFrom = null;
    };
    canvas.addEventListener('pointermove', this._moveHandler);
    canvas.addEventListener('pointerup', this._upHandler);
  }

  onInput(e) {
    if (this.finished) return;
    // 找起点
    for (const it of [...this.leftItems, ...this.rightItems]) {
      if (it.matched || it.isDistractor) continue;
      if (GameUtils.hitEmoji(e.x, e.y, it.x, it.y, 40)) {
        this.draggingFrom = it;
        this.dragX = e.x;
        this.dragY = e.y;
        Audio.click();
        return;
      }
    }
  }

  onUpdate(dt) {}

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`动物找食物 · ${this.currentLevel + 1} / ${this.cfg.levels}`, this.W/2, 30);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#888';
    ctx.fillText('动物', 50, 60);
    ctx.fillText('食物', this.W - 50, 60);
    // 已连接的线
    this.connections.forEach(c => {
      ctx.strokeStyle = '#4ADE80';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(c.from.x, c.from.y);
      ctx.lineTo(c.to.x, c.to.y);
      ctx.stroke();
    });
    // 拖拽中的线
    if (this.draggingFrom) {
      ctx.strokeStyle = '#4A9EFF';
      ctx.lineWidth = 3;
      ctx.setLineDash([6, 4]);
      ctx.beginPath();
      ctx.moveTo(this.draggingFrom.x, this.draggingFrom.y);
      ctx.lineTo(this.dragX, this.dragY);
      ctx.stroke();
      ctx.setLineDash([]);
    }
    // 物品
    [...this.leftItems, ...this.rightItems].forEach(it => {
      if (it.matched) {
        ctx.strokeStyle = '#4ADE80';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(it.x, it.y, 25, 0, Math.PI*2);
        ctx.stroke();
      }
      GameUtils.drawEmoji(ctx, it.emoji, it.x, it.y, 40);
    });
  }
}
registerGame('connectline', ConnectLineGame);

// ============================================================
// 游戏：阴影匹配
// ============================================================
class ShadowMatchGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.shadowmatch.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.emojis = ['🍎','🍌','🍇','🍓','🐱','🐶','🐰','🦊','🐻','🐼','🚗','⚽','🌸','⭐','🌈'];
    this.setupBg('radial', ['#666666', '#FFFFFF'], 30, 15);
    this._genTrial();
  }

  _genTrial() {
    const selected = Utils.shuffle(this.emojis).slice(0, this.cfg.candidates);
    this.target = selected[Utils.randInt(0, selected.length-1)];
    // 上方显示目标
    this.targetX = this.W / 2;
    this.targetY = 80 + this.cfg.fontSize / 2;
    // 下方显示所有候选阴影（打乱）
    this.shadows = Utils.shuffle(selected).map((em, i) => {
      const cols = Math.min(this.cfg.candidates, 4);
      const rows = Math.ceil(this.cfg.candidates / cols);
      const cellW = this.W / cols;
      const cellH = (this.H - this.targetY - this.cfg.fontSize - 40) / rows;
      const col = i % cols;
      const row = Math.floor(i / cols);
      return {
        x: (col + 0.5) * cellW,
        y: this.targetY + this.cfg.fontSize + 40 + (row + 0.5) * cellH,
        emoji: em,
        isTarget: em === this.target
      };
    });
    this.trialStartTime = performance.now();
    this.answered = false;
    this.feedback = 0;
  }

  onUpdate(dt) {
    if (this.finished) return;
    if (this.answered) {
      this.feedback -= dt;
      if (this.feedback <= 0) {
        this.currentTrial++;
        if (this.currentTrial >= this.cfg.trials) { this.finish(); return; }
        this._genTrial();
      }
    }
  }

  onInput(e) {
    if (this.finished || this.answered) return;
    for (const s of this.shadows) {
      if (GameUtils.hitEmoji(e.x, e.y, s.x, s.y, this.cfg.fontSize)) {
        const rt = performance.now() - this.trialStartTime;
        if (s.isTarget) {
          this.recordResult(true, rt);
          Audio.success();
        } else {
          this.recordResult(false, rt);
          Audio.mistake();
        }
        this.answered = true;
        this.feedback = 0.6;
        return;
      }
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`找到对应影子 · ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W/2, 30);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#888';
    ctx.fillText('彩色图', this.W/2, 55);
    // 目标
    GameUtils.drawEmoji(ctx, this.target, this.targetX, this.targetY, this.cfg.fontSize);
    // 分隔线
    ctx.strokeStyle = '#E0E0E0';
    ctx.setLineDash([4,4]);
    ctx.beginPath();
    ctx.moveTo(20, this.targetY + this.cfg.fontSize / 2 + 20);
    ctx.lineTo(this.W - 20, this.targetY + this.cfg.fontSize / 2 + 20);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.fillStyle = '#888';
    ctx.fillText('影子', this.W/2, this.targetY + this.cfg.fontSize / 2 + 35);
    // 阴影
    ctx.save();
    ctx.filter = 'brightness(0)';
    this.shadows.forEach(s => {
      GameUtils.drawEmoji(ctx, s.emoji, s.x, s.y, this.cfg.fontSize);
    });
    ctx.restore();
    ctx.filter = 'none';
    // 答错标记
    if (this.answered) {
      this.shadows.forEach(s => {
        if (s.isTarget) {
          ctx.strokeStyle = '#4ADE80';
          ctx.lineWidth = 4;
          ctx.beginPath();
          ctx.arc(s.x, s.y, this.cfg.fontSize * 0.6, 0, Math.PI*2);
          ctx.stroke();
        }
      });
    }
  }
}
registerGame('shadowmatch', ShadowMatchGame);

// ============================================================
// 游戏：拼完整图形
// ============================================================
class FillPieceGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.fillpiece.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.emojis = ['🍎','🐱','🚗','⭐','🌈','🌸','🐻','⚽'];
    this._genTrial();
  }

  _genTrial() {
    const emoji = this.emojis[Utils.randInt(0, this.emojis.length-1)];
    this.targetEmoji = emoji;
    const size = this.cfg.imgSize;
    this.imgX = this.W / 2 - size / 2;
    this.imgY = 80;
    this.imgW = size;
    this.imgH = size;
    // 缺口位置（中心区域随机）
    const gapSize = size * this.cfg.gapPct;
    this.gapW = gapSize;
    this.gapH = gapSize;
    this.gapX = Utils.rand(this.imgX + size * 0.3, this.imgX + size * 0.7 - gapSize);
    this.gapY = Utils.rand(this.imgY + size * 0.3, this.imgY + size * 0.7 - gapSize);
    // 候选碎片
    this.candidates = [];
    const wrongEmojis = Utils.shuffle(this.emojis.filter(e => e !== emoji));
    const correctIdx = Utils.randInt(0, this.cfg.candidates - 1);
    const correctEmoji = emoji;
    for (let i = 0; i < this.cfg.candidates; i++) {
      const cols = this.cfg.candidates;
      const cellW = this.W / cols;
      const y = this.imgY + this.imgH + 60;
      const x = (i + 0.5) * cellW;
      this.candidates.push({
        x, y,
        size: gapSize,
        emoji: i === correctIdx ? correctEmoji : wrongEmojis[i % wrongEmojis.length],
        isCorrect: i === correctIdx,
        placed: false,
        dragX: x, dragY: y
      });
    }
    this.dragging = null;
    this.trialStartTime = performance.now();
    this._bindDrag();
  }

  _bindDrag() {
    const canvas = document.getElementById('game-canvas');
    this._moveHandler = (e) => {
      if (!this.dragging) return;
      const rect = canvas.getBoundingClientRect();
      this.dragging.dragX = e.clientX - rect.left;
      this.dragging.dragY = e.clientY - rect.top;
    };
    this._upHandler = (e) => {
      if (!this.dragging) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left;
      const y = e.clientY - rect.top;
      // 检查是否拖到缺口
      if (x >= this.gapX - 10 && x <= this.gapX + this.gapW + 10 &&
          y >= this.gapY - 10 && y <= this.gapY + this.gapH + 10) {
        if (this.dragging.isCorrect) {
          this.dragging.placed = true;
          this.dragging.dragX = this.gapX + this.gapW/2;
          this.dragging.dragY = this.gapY + this.gapH/2;
          const rt = performance.now() - this.trialStartTime;
          this.recordResult(true, rt);
          Audio.success();
          this.currentTrial++;
          if (this.currentTrial >= this.cfg.trials) {
            setTimeout(() => this.finish(), 600);
          } else {
            setTimeout(() => this._genTrial(), 1000);
          }
        } else {
          this.recordResult(false, performance.now() - this.trialStartTime);
          Audio.mistake();
          // 回到原位
          this.dragging.dragX = this.dragging.x;
          this.dragging.dragY = this.dragging.y;
        }
      } else {
        // 回到原位
        this.dragging.dragX = this.dragging.x;
        this.dragging.dragY = this.dragging.y;
      }
      this.dragging = null;
    };
    canvas.addEventListener('pointermove', this._moveHandler);
    canvas.addEventListener('pointerup', this._upHandler);
  }

  onInput(e) {
    if (this.finished) return;
    for (const c of this.candidates) {
      if (c.placed) continue;
      if (GameUtils.hitEmoji(e.x, e.y, c.dragX, c.dragY, c.size)) {
        this.dragging = c;
        Audio.click();
        return;
      }
    }
  }

  onUpdate(dt) {}

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`拼完整图形 · ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W/2, 30);
    ctx.font = '12px sans-serif';
    ctx.fillStyle = '#888';
    ctx.fillText('把正确的碎片拖到缺口', this.W/2, 55);
    // 主图（带缺口）
    ctx.save();
    ctx.beginPath();
    ctx.rect(this.imgX, this.imgY, this.imgW, this.imgH);
    ctx.rect(this.gapX + this.gapW, this.gapY, -this.gapW, this.gapH);
    ctx.clip('evenodd');
    GameUtils.drawEmoji(ctx, this.targetEmoji, this.imgX + this.imgW/2, this.imgY + this.imgH/2, this.imgW);
    ctx.restore();
    // 缺口边框
    ctx.strokeStyle = '#FF6B6B';
    ctx.lineWidth = 2;
    ctx.setLineDash([4,4]);
    ctx.strokeRect(this.gapX, this.gapY, this.gapW, this.gapH);
    ctx.setLineDash([]);
    // 候选碎片
    this.candidates.forEach(c => {
      if (c.placed) {
        // 在缺口位置绘制
        ctx.save();
        ctx.beginPath();
        ctx.rect(this.gapX, this.gapY, this.gapW, this.gapH);
        ctx.clip();
        GameUtils.drawEmoji(ctx, c.emoji, c.dragX, c.dragY, c.size);
        ctx.restore();
      } else {
        // 候选背景
        ctx.fillStyle = '#F0F0F0';
        GameUtils.drawRoundRect(ctx, c.x - c.size/2 - 5, c.y - c.size/2 - 5, c.size + 10, c.size + 10, 6);
        ctx.fill();
        ctx.strokeStyle = c === this.dragging ? '#4A9EFF' : '#DDD';
        ctx.lineWidth = c === this.dragging ? 3 : 1;
        ctx.stroke();
        GameUtils.drawEmoji(ctx, c.emoji, c.dragX, c.dragY, c.size);
      }
    });
  }
}
registerGame('fillpiece', FillPieceGame);

// ============================================================
// 游戏：哪个更快
// ============================================================
class WhichFasterGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.whichfaster.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.setupBg('checker', ['#FF4444', '#44CC44'], 60, 20);
    this._genTrial();
  }

  _genTrial() {
    // 2个球，速度不同
    const [minSpd, maxSpd] = this.cfg.speedRange;
    const slower = Utils.rand(minSpd, maxSpd);
    const faster = slower * this.cfg.ratio;
    this.lanes = [
      { y: this.H / 2 - this.cfg.laneGap / 2, speed: slower, x: this.cfg.radius, isFaster: false, finished: false, flash: 0 },
      { y: this.H / 2 + this.cfg.laneGap / 2, speed: faster, x: this.cfg.radius, isFaster: true, finished: false, flash: 0 }
    ];
    this.lanes = Utils.shuffle(this.lanes);
    this.lanes[0].y = this.H / 2 - this.cfg.laneGap / 2;
    this.lanes[1].y = this.H / 2 + this.cfg.laneGap / 2;
    this.startLine = this.cfg.radius + 10;
    this.finishLine = this.W - 30;
    this.raceStarted = false;
    this.countdown = 1.5;
    this.trialStartTime = performance.now();
    this.answered = false;
    this.feedback = 0;
  }

  onUpdate(dt) {
    if (this.finished) return;
    if (this.answered) {
      this.feedback -= dt;
      if (this.feedback <= 0) {
        this.currentTrial++;
        if (this.currentTrial >= this.cfg.trials) { this.finish(); return; }
        this._genTrial();
      }
      return;
    }
    if (this.countdown > 0) {
      this.countdown -= dt;
      if (this.countdown <= 0) this.raceStarted = true;
      return;
    }
    if (!this.raceStarted) return;
    let finishedCount = 0;
    for (const lane of this.lanes) {
      if (!lane.finished) {
        lane.x += lane.speed * dt;
        if (lane.x >= this.finishLine) {
          lane.x = this.finishLine;
          lane.finished = true;
          lane.flash = 1;
        }
      } else {
        lane.flash = Math.max(0, lane.flash - dt * 2);
      }
      if (lane.finished) finishedCount++;
    }
    // 全部完成且未回答 -> miss
    if (finishedCount >= this.lanes.length && !this.answered) {
      this.recordResult(false, performance.now() - this.trialStartTime);
      Audio.mistake();
      this.answered = true;
      this.feedback = 0.8;
    }
  }

  onInput(e) {
    if (this.finished || this.answered || !this.raceStarted) return;
    // 点击哪条轨道
    for (const lane of this.lanes) {
      if (Math.abs(e.y - lane.y) < this.cfg.radius * 2) {
        const rt = performance.now() - this.trialStartTime;
        if (lane.isFaster) {
          this.recordResult(true, rt);
          Audio.success();
        } else {
          this.recordResult(false, rt);
          Audio.mistake();
        }
        this.answered = true;
        this.feedback = 0.8;
        return;
      }
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 16px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`哪个更快？· ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W/2, 30);
    if (this.countdown > 0) {
      ctx.font = 'bold 48px sans-serif';
      ctx.fillStyle = '#FF6B6B';
      ctx.fillText(Math.ceil(this.countdown).toString(), this.W/2, this.H/2);
      return;
    }
    // 轨道
    this.lanes.forEach((lane, i) => {
      // 轨道线
      ctx.strokeStyle = '#E0E0E0';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(this.startLine, lane.y);
      ctx.lineTo(this.finishLine, lane.y);
      ctx.stroke();
      // 终点
      ctx.strokeStyle = '#FF6B6B';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(this.finishLine, lane.y - 20);
      ctx.lineTo(this.finishLine, lane.y + 20);
      ctx.stroke();
      // 起点线
      ctx.strokeStyle = '#4A9EFF';
      ctx.beginPath();
      ctx.moveTo(this.startLine, lane.y - 20);
      ctx.lineTo(this.startLine, lane.y + 20);
      ctx.stroke();
      // 球
      ctx.fillStyle = lane.flash > 0 ? '#FFD700' : '#4A9EFF';
      ctx.beginPath();
      ctx.arc(lane.x, lane.y, this.cfg.radius, 0, Math.PI*2);
      ctx.fill();
      // 闪光
      if (lane.flash > 0) {
        ctx.globalAlpha = lane.flash;
        ctx.fillStyle = '#FFD700';
        ctx.beginPath();
        ctx.arc(lane.x, lane.y, this.cfg.radius * 1.8, 0, Math.PI*2);
        ctx.fill();
        ctx.globalAlpha = 1;
      }
      // 标签
      ctx.fillStyle = '#888';
      ctx.font = '12px sans-serif';
      ctx.fillText(`轨道 ${i + 1}`, this.startLine - 20, lane.y);
    });
    if (this.raceStarted && !this.answered) {
      ctx.fillStyle = '#666';
      ctx.font = '12px sans-serif';
      ctx.fillText('点击更快的轨道', this.W/2, this.H - 30);
    }
  }
}
registerGame('whichfaster', WhichFasterGame);

// ============================================================
// 游戏：连连看
// ============================================================
class LinkMatchGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.linkmatch.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentLevel = 0;
    this.selected = null;
    this.emojis = ['🍎','🍌','🍇','🍓','🍑','🍉','🍊','🐱','🐶','🐰','🦊','🐻','🐼','⭐','🌈','🚗','⚽','🌸','🎈','🍕'];
    this.setupBg('checker', ['#FF4444', '#4488FF'], 45, 20, 'circles', ['#FEF3C7', '#FDE68A'], 40, 15);
    this._genLevel();
  }
  getProgress() {
    return { trials: this.currentLevel, targetTrials: this.cfg.trials, pct: this.cfg.trials ? this.currentLevel / this.cfg.trials : 0 };
  }
  _genLevel() {
    const { cols, rows, pairs } = this.cfg;
    this.cols = cols; this.rows = rows;
    const emojis = Utils.shuffle(this.emojis).slice(0, pairs);
    const cards = [];
    emojis.forEach((em, i) => {
      cards.push({ id: i * 2, emoji: em, matched: false });
      cards.push({ id: i * 2 + 1, emoji: em, matched: false });
    });
    this.cards = Utils.shuffle(cards);
    this.cellW = Math.min((this.W - 20) / cols, (this.H - 100) / rows);
    this.gridW = this.cellW * cols; this.gridH = this.cellW * rows;
    this.gridX = (this.W - this.gridW) / 2; this.gridY = 60;
    this.matchedInLevel = 0;
    this.selected = null;
    this.feedbackTimer = 0;
    this.levelStartTime = performance.now();
  }
  _cardAt(px, py) {
    for (let i = 0; i < this.cards.length; i++) {
      const c = this.cards[i];
      if (c.matched) continue;
      const cx = this.gridX + (i % this.cols) * this.cellW + this.cellW / 2;
      const cy = this.gridY + Math.floor(i / this.cols) * this.cellW + this.cellW / 2;
      if (Utils.dist(px, py, cx, cy) < this.cellW * 0.4) return i;
    }
    return -1;
  }
  onUpdate(dt) {
    if (this.finished) return;
    if (this.cfg.timeout > 0 && performance.now() - this.levelStartTime > this.cfg.timeout * 1000) {
      this.currentLevel++;
      if (this.currentLevel >= this.targetTrials) { this.currentLevel = 0; this.targetTrials += this.cfg.levels || this.cfg.trials; return; }
      this._genLevel(); return;
    }
    if (this.feedbackTimer > 0) {
      this.feedbackTimer -= dt;
      if (this.feedbackTimer <= 0 && this.matchedInLevel >= this.cfg.pairs) {
        this.currentLevel++;
        if (this.currentLevel >= this.targetTrials) { this.currentLevel = 0; this.targetTrials += this.cfg.levels || this.cfg.trials; return; }
        this._genLevel();
      }
    }
  }
  onInput(e) {
    if (this.finished || this.feedbackTimer > 0) return;
    const idx = this._cardAt(e.x, e.y);
    if (idx < 0) return;
    if (this.selected === null) {
      this.selected = idx;
      this.cards[idx]._highlight = true;
    } else if (this.selected === idx) {
      this.cards[idx]._highlight = false;
      this.selected = null;
    } else {
      const a = this.cards[this.selected], b = this.cards[idx];
      if (a.emoji === b.emoji && !a.matched && !b.matched) {
        a.matched = true; b.matched = true; this.matchedInLevel++;
        this.recordResult(true, performance.now() - this.levelStartTime);
        Audio.success();
        this.feedbackTimer = 0.3;
      } else {
        this.recordResult(false, 0);
        Audio.mistake();
        a._highlight = false;
      }
      this.selected = null;
    }
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`连连看 · ${this.currentLevel + 1} / ${this.cfg.trials}`, this.W / 2, 30);
    this.cards.forEach((c, i) => {
      if (c.matched) return;
      const cx = this.gridX + (i % this.cols) * this.cellW + this.cellW / 2;
      const cy = this.gridY + Math.floor(i / this.cols) * this.cellW + this.cellW / 2;
      const r = this.cellW * 0.38;
      ctx.fillStyle = c._highlight ? '#FEF3C7' : '#FFFFFF';
      ctx.strokeStyle = c._highlight ? '#F59E0B' : '#DDD';
      ctx.lineWidth = c._highlight ? 3 : 1;
      ctx.beginPath();
      GameUtils.drawRoundRect(ctx, cx - r, cy - r, r * 2, r * 2, 6);
      ctx.fill(); ctx.stroke();
      GameUtils.drawEmoji(ctx, c.emoji, cx, cy, r * 1.2);
    });
  }
}
registerGame('linkmatch', LinkMatchGame);

// ============================================================
// 游戏：套牛
// ============================================================
class RopingGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.roping.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.cows = [];
    this.lasso = null;
    this.setupBg('hstripes', ['#222222', '#FFFFFF'], 45, 25, 'dots', ['#ECFDF5', '#A7F3D0'], 40, 20);
    this._spawnCows();
  }
  _spawnCows() {
    this.cows = [];
    for (let i = 0; i < this.cfg.cows; i++) {
      this.cows.push({
        x: -Utils.rand(30, 200),
        y: 80 + (i / this.cfg.cows) * (this.H - 160),
        speed: this.cfg.speed * Utils.rand(0.8, 1.2),
        emoji: ['🐮','🐄','🐂'][Utils.randInt(0, 2)],
        caught: false, size: 40
      });
    }
    this.lasso = null;
  }
  onUpdate(dt) {
    if (this.finished) return;
    let allDone = true;
    this.cows.forEach(c => {
      if (!c.caught) {
        c.x += c.speed * dt;
        if (c.x > this.W + 100 && !c.caught) allDone = allDone && true;
        else allDone = false;
      }
    });
    if (this.lasso && this.lasso.life > 0) {
      this.lasso.life -= dt;
      if (this.lasso.life <= 0) {
        this.currentTrial++;
        if (this.currentTrial >= this.targetTrials) { this.currentTrial = 0; this.targetTrials += this.cfg.trials; return; }
        this._spawnCows();
      }
    }
    if (allDone && !this.lasso) {
      this.currentTrial++;
      if (this.currentTrial >= this.targetTrials) { this.currentTrial = 0; this.targetTrials += this.cfg.trials; return; }
      this._spawnCows();
    }
  }
  onInput(e) {
    if (this.finished || this.lasso) return;
    this.lasso = { x: e.x, y: e.y, life: this.cfg.ropeTime, r: 35 };
    let hit = false;
    this.cows.forEach(c => {
      if (!c.caught && Utils.dist(e.x, e.y, c.x, c.y) < 50) {
        c.caught = true; hit = true;
      }
    });
    if (hit) { this.recordResult(true, 0); Audio.success(); }
    else { this.recordResult(false, 0); Audio.mistake(); }
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    ctx.fillStyle = '#333';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`套牛 · ${this.currentTrial + 1} / ${this.cfg.trials}`, this.W / 2, 30);
    this.cows.forEach(c => {
      if (c.caught) return;
      GameUtils.drawEmoji(ctx, c.emoji, c.x, c.y, c.size);
    });
    if (this.lasso && this.lasso.life > 0) {
      ctx.strokeStyle = '#EF4444';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(this.lasso.x, this.lasso.y, this.lasso.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = this.lasso.life / this.cfg.ropeTime;
      this.lasso.r = 35 + (this.cfg.ropeTime - this.lasso.life) * 40;
      ctx.strokeStyle = '#F59E0B';
      ctx.beginPath();
      ctx.arc(this.lasso.x, this.lasso.y, this.lasso.r, 0, Math.PI * 2);
      ctx.stroke();
      ctx.globalAlpha = 1;
    }
  }
}
registerGame('roping', RopingGame);

// ============================================================
// 游戏：赛车（方向按钮控制）
// ============================================================
class RacingGame extends TimedGame {
  onStart() {
    const cfg = GAME_CONFIGS.racing.difficulties[this.difficulty];
    this.cfg = cfg;
    this.durationSec = cfg.duration;
    this.elapsedSec = 0;
    this.carW = 40; this.carH = 70;
    this.carX = this.W / 2; this.carY = this.H - 120;
    this.obstacles = [];
    this.spawnTimer = 0;
    this.keys = {};
    this.setupBg('vstripes', ['#222222', '#FFFFFF'], 50, 60, 'checker', ['#222222', '#FFFFFF'], 55, 70);
    // 渲染方向按钮
    const controls = document.getElementById('game-controls');
    if (controls) {
      controls.innerHTML = `<div class="grid grid-cols-3 gap-2 p-3 max-w-[200px] mx-auto">
        <div></div><button data-rdir="up" class="bg-gray-700 text-white rounded-xl py-4 text-2xl active:scale-90 transition-transform">⬆️</button><div></div>
        <button data-rdir="left" class="bg-gray-700 text-white rounded-xl py-4 text-2xl active:scale-90 transition-transform">⬅️</button>
        <div></div>
        <button data-rdir="right" class="bg-gray-700 text-white rounded-xl py-4 text-2xl active:scale-90 transition-transform">➡️</button>
        <div></div><button data-rdir="down" class="bg-gray-700 text-white rounded-xl py-4 text-2xl active:scale-90 transition-transform">⬇️</button><div></div>
      </div>`;
      controls.querySelectorAll('[data-rdir]').forEach(btn => {
        const dir = btn.dataset.rdir;
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); this.keys[dir] = true; });
        btn.addEventListener('pointerup', (e) => { e.preventDefault(); this.keys[dir] = false; });
        btn.addEventListener('pointerleave', () => { this.keys[dir] = false; });
      });
    }
  }
  onUpdate(dt) {
    if (this.finished) return;
    this.elapsedSec += dt;
    if (this.elapsedSec >= this.durationSec) { this.finish(); }
    const spd = this.cfg.speed;
    if (this.keys.left) this.carX -= spd * dt;
    if (this.keys.right) this.carX += spd * dt;
    if (this.keys.up) this.carY -= spd * 0.7 * dt;
    if (this.keys.down) this.carY += spd * 0.7 * dt;
    this.carX = Utils.clamp(this.carX, this.carW, this.W - this.carW);
    this.carY = Utils.clamp(this.carY, 60, this.H - this.carH - 20);
    this.spawnTimer += dt;
    if (this.spawnTimer >= this.cfg.spawnInterval && this.obstacles.length < this.cfg.obstacles) {
      this.spawnTimer = 0;
      this.obstacles.push({
        x: Utils.rand(this.carW, this.W - this.carW),
        y: -60, w: 35, h: 60, speed: this.cfg.speed * Utils.rand(0.7, 1.3)
      });
    }
    for (let i = this.obstacles.length - 1; i >= 0; i--) {
      const o = this.obstacles[i];
      o.y += o.speed * dt;
      if (o.y > this.H + 100) { this.obstacles.splice(i, 1); this.recordResult(true, 0); continue; }
      if (Math.abs(o.x - this.carX) < (this.carW + o.w) / 2 &&
          Math.abs(o.y - this.carY) < (this.carH + o.h) / 2) {
        // 撞车！扣分但不结束游戏
        this.recordResult(false, 0);
        Audio.alarm();
        this.crashed = true;
        // 短暂闪烁后恢复
        setTimeout(() => { this.crashed = false; }, 800);
        return;
      }
    }
    this.callbacks.onProgress(this.getProgress());
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 车道线
    ctx.setLineDash([20, 20]);
    ctx.strokeStyle = 'rgba(255,255,255,0.3)';
    ctx.lineWidth = 3;
    for (let lx = this.W / 3; lx < this.W; lx += this.W / 3) {
      ctx.beginPath(); ctx.moveTo(lx, 0); ctx.lineTo(lx, this.H); ctx.stroke();
    }
    ctx.setLineDash([]);
    // 障碍车
    this.obstacles.forEach(o => { this._drawCar(ctx, o.x, o.y, o.w, o.h, '#EF4444', '#DC2626'); });
    // 玩家车
    this._drawCar(ctx, this.carX, this.carY, this.carW, this.carH, '#4A9EFF', '#2563EB');
    // HUD
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`🏎️ 赛车 · ${Math.round(this.elapsedSec)}s`, this.W / 2, 24);
  }
  _drawCar(ctx, cx, cy, w, h, bodyColor, roofColor) {
    ctx.save();
    // 车身底部
    ctx.fillStyle = bodyColor;
    GameUtils.drawRoundRect(ctx, cx - w/2, cy - h/4, w, h * 0.7, 6);
    ctx.fill();
    // 车身上部（驾驶舱）
    ctx.fillStyle = roofColor;
    GameUtils.drawRoundRect(ctx, cx - w/3, cy - h/2 + 4, w * 0.66, h * 0.45, 5);
    ctx.fill();
    // 车窗
    ctx.fillStyle = '#BBDEFB';
    GameUtils.drawRoundRect(ctx, cx - w/4, cy - h/2 + 8, w * 0.22, h * 0.22, 3);
    ctx.fill();
    GameUtils.drawRoundRect(ctx, cx + w/12, cy - h/2 + 8, w * 0.22, h * 0.22, 3);
    ctx.fill();
    // 车轮
    ctx.fillStyle = '#222';
    ctx.beginPath(); ctx.arc(cx - w/3, cy + h/2 - 8, 8, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + w/3, cy + h/2 - 8, 8, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#888';
    ctx.beginPath(); ctx.arc(cx - w/3, cy + h/2 - 8, 4, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + w/3, cy + h/2 - 8, 4, 0, Math.PI*2); ctx.fill();
    // 车灯
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(cx + w/2 - 3, cy - 4, 5, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.arc(cx - w/2 + 3, cy + 2, 4, 0, Math.PI*2); ctx.fill();
    ctx.restore();
  }
}
registerGame('racing', RacingGame);

// ============================================================
// 游戏：坦克射击（方向按钮 + 射击按钮）
// ============================================================
class TankShooterGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.tankshooter.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.maxEnemies = cfg.enemies;
    this.tankX = this.W / 2; this.tankW = 40; this.tankH = 50;
    this.enemies = []; this.bullets = []; this.particles = [];
    this.keys = {}; this.shootCooldown = 0;
    this.setupBg('checker', ['#222222', '#FFFFFF'], 50, 20, 'diagonal', ['#222222', '#FFFFFF'], 45, 12);
    // 渲染方向+射击按钮
    const controls = document.getElementById('game-controls');
    if (controls) {
      controls.innerHTML = `<div class="flex items-end justify-center gap-3 p-3 max-w-[300px] mx-auto">
        <div class="grid grid-cols-3 gap-1">
          <div></div><button data-tdir="up" class="bg-gray-700 text-white rounded-xl w-14 h-14 text-xl active:scale-90 transition-transform">⬆️</button><div></div>
          <button data-tdir="left" class="bg-gray-700 text-white rounded-xl w-14 h-14 text-xl active:scale-90 transition-transform">⬅️</button>
          <div></div>
          <button data-tdir="right" class="bg-gray-700 text-white rounded-xl w-14 h-14 text-xl active:scale-90 transition-transform">➡️</button>
          <div></div><button data-tdir="down" class="bg-gray-700 text-white rounded-xl w-14 h-14 text-xl active:scale-90 transition-transform">⬇️</button><div></div>
        </div>
        <button data-tdir="fire" class="bg-red-500 text-white rounded-full w-20 h-20 text-3xl font-bold active:scale-90 transition-transform">🔥</button>
      </div>`;
      controls.querySelectorAll('[data-tdir]').forEach(btn => {
        const dir = btn.dataset.tdir;
        btn.addEventListener('pointerdown', (e) => { e.preventDefault(); if (dir === 'fire') this._shoot(); else this.keys[dir] = true; });
        btn.addEventListener('pointerup', (e) => { e.preventDefault(); this.keys[dir] = false; });
        btn.addEventListener('pointerleave', () => { this.keys[dir] = false; });
      });
    }
    this._spawnEnemy();
  }
  _shoot() {
    if (this.finished) return;
    this.bullets.push({ x: this.tankX, y: this.H - 120, speed: 400 });
    Audio.click();
  }
  _spawnEnemy() {
    this.enemies.push({
      x: Utils.rand(30, this.W - 30), y: -30,
      speed: this.cfg.enemySpeed * Utils.rand(0.7, 1.3),
      emoji: ['👾','🛸','💀','👽'][Utils.randInt(0, 3)], size: 30
    });
  }
  onUpdate(dt) {
    if (this.finished) return;
    const spd = 150;
    if (this.keys.left) this.tankX -= spd * dt;
    if (this.keys.right) this.tankX += spd * dt;
    if (this.keys.up) this.enemies.forEach(e => e.y += 20 * dt);
    if (this.keys.down) this.enemies.forEach(e => e.y -= 20 * dt);
    this.tankX = Utils.clamp(this.tankX, this.tankW, this.W - this.tankW);
    this.shootCooldown -= dt;
    // 敌人移动
    const tankY = this.H - 150;
    this.enemies.forEach(e => { e.y += e.speed * dt; });
    // 敌人撞到坦克 → 游戏结束
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      const e = this.enemies[i];
      if (Utils.dist(e.x, e.y, this.tankX, tankY) < e.size + this.tankW) {
        for (let k = 0; k < 15; k++) {
          this.particles.push({ x: this.tankX, y: tankY, vx: (Math.random()-0.5)*300, vy: (Math.random()-0.5)*300, life: 0.6, color: '#FF4444' });
        }
        this.enemies.splice(i, 1);
        Audio.alarm();
        this.recordResult(false, 0);
        return;
      }
    }
    // 子弹
    for (let i = this.bullets.length - 1; i >= 0; i--) {
      const b = this.bullets[i];
      b.y -= b.speed * dt;
      if (b.y < -20) { this.bullets.splice(i, 1); continue; }
      for (let j = this.enemies.length - 1; j >= 0; j--) {
        const e = this.enemies[j];
        if (Utils.dist(b.x, b.y, e.x, e.y) < e.size + 6) {
          this.recordResult(true, 0);
          Audio.success();
          for (let k = 0; k < 8; k++) {
            this.particles.push({ x: e.x, y: e.y, vx: Math.cos(k/8*Math.PI*2)*150, vy: Math.sin(k/8*Math.PI*2)*150, life: 0.4, color: '#FFD700' });
          }
          this.enemies.splice(j, 1); this.bullets.splice(i, 1);
          break;
        }
      }
    }
    // 敌人逃出
    for (let i = this.enemies.length - 1; i >= 0; i--) {
      if (this.enemies[i].y > this.H + 50) {
        this.recordResult(false, 0);
        Audio.mistake();
        this.enemies.splice(i, 1);
      }
    }
    // 粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    // 生成敌人
    if (this.enemies.length < this.maxEnemies && Math.random() < this.cfg.spawnInterval * dt / 2) {
      this._spawnEnemy();
    }
    if (this.totalTrials >= this.targetTrials && this.enemies.length === 0 && this.bullets.length === 0) {
      this.finish();
    }
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // HUD
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`🔫 坦克射击 · ${this.correctTrials} / ${this.targetTrials}`, this.W / 2, 24);
    // 敌人
    this.enemies.forEach(e => { GameUtils.drawEmoji(ctx, e.emoji, e.x, e.y, e.size); });
    // 子弹
    this.bullets.forEach(b => {
      ctx.fillStyle = '#FFD700';
      ctx.beginPath(); ctx.arc(b.x, b.y, 5, 0, Math.PI * 2); ctx.fill();
    });
    // 粒子
    this.particles.forEach(p => {
      ctx.globalAlpha = p.life * 2;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, 4, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    // 坦克
    this._drawTank(ctx, this.tankX, this.H - 150, this.tankW, this.tankH);
  }
  _drawTank(ctx, tx, ty, tw, th) {
    ctx.save();
    // 履带
    ctx.fillStyle = '#374151';
    GameUtils.drawRoundRect(ctx, tx - tw/2, ty - th/4, tw, th * 0.65, 4);
    ctx.fill();
    ctx.fillStyle = '#1F2937';
    for (let i = 0; i < 5; i++) {
      ctx.fillRect(tx - tw/2 + 3 + i * tw/5, ty - th/4 + 2, tw/6, th * 0.55);
    }
    // 车轮
    ctx.fillStyle = '#111';
    for (let i = 0; i < 4; i++) {
      const wx = tx - tw/3 + i * tw/4.5;
      ctx.beginPath(); ctx.arc(wx, ty + th/2 - 10, 7, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#555';
      ctx.beginPath(); ctx.arc(wx, ty + th/2 - 10, 3, 0, Math.PI*2); ctx.fill();
      ctx.fillStyle = '#111';
    }
    // 车身
    ctx.fillStyle = '#4B7B4B';
    GameUtils.drawRoundRect(ctx, tx - tw/2 + 4, ty - th/2 + 8, tw - 8, th * 0.5, 4);
    ctx.fill();
    // 炮塔（圆顶）
    ctx.fillStyle = '#3D6B3D';
    ctx.beginPath();
    ctx.arc(tx, ty - th/2 + 14, tw * 0.3, 0, Math.PI*2);
    ctx.fill();
    // 炮管
    ctx.fillStyle = '#2D4A2D';
    ctx.fillRect(tx - 3, ty - th, 6, th * 0.55);
    ctx.strokeStyle = '#1A3A1A';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(tx - 3, ty - th);
    ctx.lineTo(tx + 3, ty - th);
    ctx.stroke();
    // 五角星标志
    ctx.fillStyle = '#FFD700';
    ctx.font = `${tw * 0.35}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('★', tx, ty - th/2 + 14);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
}
registerGame('tankshooter', TankShooterGame);

// ============================================================
// 游戏：弹球打砖（眼球追踪+运动预测）
// ============================================================
class BrickBreakGame extends TimedGame {
  onStart() {
    const cfg = GAME_CONFIGS.brickbreak.difficulties[this.difficulty];
    this.cfg = cfg;
    this.durationSec = cfg.duration;
    this.elapsedSec = 0;
    this.paddleW = cfg.paddleW; this.paddleH = 14;
    this.paddleX = this.W / 2; this.paddleY = this.H - 50;
    this.ballR = 8;
    this.ballX = this.W / 2; this.ballY = this.H - 80;
    this.ballVX = cfg.ballSpeed * (Math.random() > 0.5 ? 1 : -1);
    this.ballVY = -cfg.ballSpeed;
    this.bricks = [];
    this.particles = [];
    const brickW = (this.W - 20) / cfg.cols - 4;
    const brickH = 22;
    const colors = ['#EF4444','#F97316','#F59E0B','#10B981','#3B82F6','#8B5CF6'];
    for (let r = 0; r < cfg.rows; r++) {
      for (let c = 0; c < cfg.cols; c++) {
        this.bricks.push({
          x: 12 + c * (brickW + 4), y: 60 + r * (brickH + 4),
          w: brickW, h: brickH,
          color: colors[(r + c) % colors.length],
          alive: true
        });
      }
    }
    this.totalTrials = cfg.rows * cfg.cols;
    this.correctTrials = 0;
    this._bindPaddle();
    this.setupBg('radial', ['#1E1B4B', '#6366F1'], 50, 10, 'dots', ['#312E81', '#818CF8'], 45, 15);
  }
  _bindPaddle() {
    const canvas = document.getElementById('game-canvas');
    this._moveH = (e) => {
      const rect = canvas.getBoundingClientRect();
      this.paddleX = Utils.clamp(e.clientX - rect.left, this.paddleW / 2, this.W - this.paddleW / 2);
    };
    canvas.addEventListener('pointermove', this._moveH);
  }
  onUpdate(dt) {
    if (this.finished) return;
    this.elapsedSec += dt;
    if (this.elapsedSec >= this.durationSec) { this.finish(); }
    // 球移动
    this.ballX += this.ballVX * dt;
    this.ballY += this.ballVY * dt;
    // 碰墙
    if (this.ballX - this.ballR <= 0) { this.ballX = this.ballR; this.ballVX *= -1; }
    if (this.ballX + this.ballR >= this.W) { this.ballX = this.W - this.ballR; this.ballVX *= -1; }
    if (this.ballY - this.ballR <= 0) { this.ballY = this.ballR; this.ballVY *= -1; }
    // 碰挡板
    if (this.ballY + this.ballR >= this.paddleY - this.paddleH / 2 &&
        this.ballY - this.ballR <= this.paddleY + this.paddleH / 2 &&
        Math.abs(this.ballX - this.paddleX) < this.paddleW / 2 + this.ballR) {
      this.ballY = this.paddleY - this.paddleH / 2 - this.ballR;
      const hitPos = (this.ballX - this.paddleX) / (this.paddleW / 2);
      this.ballVX = hitPos * 200;
      this.ballVY = -Math.abs(this.ballVY);
      Audio.pop();
    }
    // 球掉出底部
    if (this.ballY > this.H + 30) {
      this.ballX = this.W / 2; this.ballY = this.H - 80;
      this.ballVX = this.cfg.ballSpeed * (Math.random() > 0.5 ? 1 : -1);
      this.ballVY = -this.cfg.ballSpeed;
      this.recordResult(false, 0);
    }
    // 碰砖块
    for (let i = this.bricks.length - 1; i >= 0; i--) {
      const bk = this.bricks[i];
      if (!bk.alive) continue;
      if (this.ballX + this.ballR > bk.x && this.ballX - this.ballR < bk.x + bk.w &&
          this.ballY + this.ballR > bk.y && this.ballY - this.ballR < bk.y + bk.h) {
        bk.alive = false;
        this.recordResult(true, 0);
        Audio.success();
        // 粒子
        for (let k = 0; k < 6; k++) {
          this.particles.push({
            x: bk.x + bk.w / 2, y: bk.y + bk.h / 2,
            vx: (Math.random() - 0.5) * 200, vy: (Math.random() - 0.5) * 200,
            life: 0.5, color: bk.color, size: 4
          });
        }
        // 反弹
        const overlapX = Math.min(this.ballX + this.ballR - bk.x, bk.x + bk.w - (this.ballX - this.ballR));
        const overlapY = Math.min(this.ballY + this.ballR - bk.y, bk.y + bk.h - (this.ballY - this.ballR));
        if (overlapX < overlapY) this.ballVX *= -1;
        else this.ballVY *= -1;
        // 加速
        const spd = Math.sqrt(this.ballVX * this.ballVX + this.ballVY * this.ballVY);
        const maxSpd = this.cfg.ballSpeed * 1.8;
        if (spd < maxSpd) {
          this.ballVX *= 1.02; this.ballVY *= 1.02;
        }
        this.bricks.splice(i, 1);
      }
    }
    // 粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vy += 300 * dt; p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    // 全部砖块打完
    if (this.bricks.length === 0) this.finish();
    this.callbacks.onProgress(this.getProgress());
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 砖块
    this.bricks.forEach(bk => {
      ctx.fillStyle = bk.color;
      GameUtils.drawRoundRect(ctx, bk.x, bk.y, bk.w, bk.h, 4);
      ctx.fill();
    });
    // 粒子
    this.particles.forEach(p => {
      ctx.globalAlpha = Math.max(0, p.life * 2);
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    // 球
    ctx.fillStyle = '#FFFFFF';
    ctx.beginPath(); ctx.arc(this.ballX, this.ballY, this.ballR, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFD700';
    ctx.beginPath(); ctx.arc(this.ballX, this.ballY, this.ballR * 0.6, 0, Math.PI * 2); ctx.fill();
    // 挡板
    const grad = ctx.createLinearGradient(this.paddleX, this.paddleY - this.paddleH / 2, this.paddleX, this.paddleY + this.paddleH / 2);
    grad.addColorStop(0, '#FF6B6B'); grad.addColorStop(1, '#EF4444');
    ctx.fillStyle = grad;
    GameUtils.drawRoundRect(ctx, this.paddleX - this.paddleW / 2, this.paddleY - this.paddleH / 2, this.paddleW, this.paddleH, 7);
    ctx.fill();
    // HUD
    ctx.fillStyle = '#FFF';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`🧱 ${this.bricks.length}块 · ${Math.round(this.elapsedSec)}s`, this.W / 2, 24);
  }
}
registerGame('brickbreak', BrickBreakGame);

// ============================================================
// 游戏：钓鱼（视觉搜索+图形辨别）
// ============================================================
class FishingGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.fishing.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.targets;
    this.totalTrials = 0;
    this.correctTrials = 0;
    this.fish = [];
    this.targetEmoji = '';
    this.feedback = 0;
    this.caughtInRound = 0;
    this.targetsNeeded = 0;
    this.fishEmojis = ['🐟','🐠','🐡','🦈','🐋','🐬','🦀','🦞','🐙','🦑','🐢','🐸'];
    this.setupBg('wavy', ['#FF4444', '#4488FF'], 40, 15, 'hstripes', ['#FF4444', '#44CC44'], 45, 18);
    this._newRound();
  }
  _newRound() {
    const cfg = this.cfg;
    this.fish = [];
    const distractorEmojis = this.fishEmojis.filter(e => e !== this.targetEmoji || !this.targetEmoji);
    const dSet = Utils.shuffle(distractorEmojis).slice(0, cfg.distractors);
    if (!this.targetEmoji) this.targetEmoji = dSet[0];
    this.targetsNeeded = Math.ceil(cfg.targets / cfg.trials);
    this.caughtInRound = 0;
    for (let i = 0; i < cfg.fishCount; i++) {
      const isTarget = i < this.targetsNeeded;
      this.fish.push({
        x: Utils.rand(40, this.W - 40),
        y: Utils.rand(70, this.H - 60),
        vx: cfg.speed * Utils.rand(0.5, 1.5) * (Math.random() > 0.5 ? 1 : -1),
        vy: cfg.speed * Utils.rand(0.3, 0.8) * (Math.random() > 0.5 ? 1 : -1),
        emoji: isTarget ? this.targetEmoji : dSet[Utils.randInt(0, dSet.length - 1)],
        isTarget, caught: false, size: 35
      });
    }
    this.feedback = 0;
  }
  onUpdate(dt) {
    if (this.finished) return;
    if (this.feedback > 0) { this.feedback -= dt; return; }
    this.fish.forEach(f => {
      if (f.caught) return;
      f.x += f.vx * dt; f.y += f.vy * dt;
      if (f.x < 20 || f.x > this.W - 20) f.vx *= -1;
      if (f.y < 70 || f.y > this.H - 30) f.vy *= -1;
    });
    if (this.caughtInRound >= this.targetsNeeded) {
      if (this.correctTrials >= this.targetTrials) { this.finish(); return; }
      this._newRound();
    }
  }
  onInput(e) {
    if (this.finished || this.feedback > 0) return;
    for (let i = this.fish.length - 1; i >= 0; i--) {
      const f = this.fish[i];
      if (f.caught) continue;
      if (Utils.dist(e.x, e.y, f.x, f.y) < f.size) {
        f.caught = true;
        if (f.isTarget) {
          this.recordResult(true, 0);
          this.caughtInRound++;
          Audio.success();
        } else {
          this.recordResult(false, 0);
          Audio.mistake();
        }
        this.feedback = 0.4;
        break;
      }
    }
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 目标提示
    ctx.fillStyle = '#333';
    ctx.font = 'bold 15px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`请钓${this.targetEmoji}  ${this.correctTrials} / ${this.targetTrials}`, this.W / 2, 28);
    // 鱼
    this.fish.forEach(f => {
      if (f.caught) return;
      const bob = Math.sin(performance.now() / 300 + f.x) * 3;
      GameUtils.drawEmoji(ctx, f.emoji, f.x, f.y + bob, f.size);
      // 目标鱼加光环
      if (f.isTarget) {
        ctx.strokeStyle = 'rgba(255,215,0,0.6)';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.arc(f.x, f.y + bob, f.size * 0.7, 0, Math.PI * 2);
        ctx.stroke();
      }
    });
    if (this.feedback > 0) {
      ctx.fillStyle = '#333';
      ctx.font = 'bold 20px sans-serif';
      ctx.fillText('🎣', this.W / 2, this.H / 2);
    }
  }
}
registerGame('fishing', FishingGame);

// ============================================================
// 游戏：颜色分类（颜色辨别）
// ============================================================
class ColorSortGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.colorsort.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.items;
    this.items = [];
    this.bins = [];
    this.spawnTimer = 0;
    this.colors = ['#EF4444','#3B82F6','#10B981','#F59E0B','#8B5CF6','#EC4899'];
    this.colorNames = ['红','蓝','绿','黄','紫','粉'];
    this.usedColors = this.colors.slice(0, cfg.bins);
    // 创建桶
    const binW = Math.min(70, (this.W - 20) / cfg.bins - 10);
    const totalW = cfg.bins * binW + (cfg.bins - 1) * 10;
    const startX = (this.W - totalW) / 2;
    for (let i = 0; i < cfg.bins; i++) {
      this.bins.push({
        x: startX + i * (binW + 10) + binW / 2,
        y: this.H - 60, w: binW, h: 50,
        color: this.usedColors[i],
        label: this.colorNames[i]
      });
    }
    this.items = [];
    this.particles = [];
    this.spawnTimer = 0;
    this._elapsedSec = 0;
    this.dragItem = null;
    this.setupBg('vstripes', ['#222222', '#FFFFFF'], 40, 25, 'dots', ['#F0F9FF', '#BAE6FD'], 35, 20);
    this._bindDrag();
  }
  _bindDrag() {
    const canvas = document.getElementById('game-canvas');
    canvas.addEventListener('pointerdown', (e) => {
      if (this.finished) return;
      const rect = canvas.getBoundingClientRect();
      const x = e.clientX - rect.left, y = e.clientY - rect.top;
      for (let i = this.items.length - 1; i >= 0; i--) {
        const it = this.items[i];
        if (it.dragging) continue;
        if (Utils.dist(x, y, it.x, it.y) < it.r) {
          it.dragging = true; this.dragItem = it; break;
        }
      }
    });
    canvas.addEventListener('pointermove', (e) => {
      if (!this.dragItem) return;
      const rect = canvas.getBoundingClientRect();
      this.dragItem.x = e.clientX - rect.left;
      this.dragItem.y = e.clientY - rect.top;
    });
    canvas.addEventListener('pointerup', () => {
      if (!this.dragItem || this.finished) { this.dragItem = null; return; }
      const it = this.dragItem; this.dragItem = null;
      it.dragging = false;
      let matched = false;
      for (const bin of this.bins) {
        if (Utils.dist(it.x, it.y, bin.x, bin.y) < bin.w) {
          if (it.color === bin.color) {
            matched = true;
            this.recordResult(true, 0);
            Audio.success();
            for (let k = 0; k < 8; k++) {
              this.particles.push({
                x: it.x, y: it.y,
                vx: Math.cos(k / 8 * Math.PI * 2) * 120,
                vy: Math.sin(k / 8 * Math.PI * 2) * 120,
                life: 0.4, color: bin.color, size: 4
              });
            }
          } else {
            this.recordResult(false, 0);
            Audio.mistake();
          }
          it.matched = true;
          break;
        }
      }
      if (!it.matched) { it.x = it._origX; it.y = it._origY; }
    });
  }
  onUpdate(dt) {
    if (this.finished) return;
    this._elapsedSec = (this._elapsedSec || 0) + dt;
    if (this._elapsedSec >= this.cfg.duration) { this.finish(); }
    const spawnRate = Math.max(0.4, 1.5 - this.cfg.speed / 100);
    this.spawnTimer += dt;
    if (this.spawnTimer >= spawnRate && this.items.filter(it => !it.matched).length < 4 && this.items.length < this.targetTrials) {
      this.spawnTimer = 0;
      const color = this.usedColors[Utils.randInt(0, this.usedColors.length - 1)];
      const shapes = ['●','■','▲','★','♦','⬟'];
      this.items.push({
        x: Utils.rand(60, this.W - 60), y: Utils.rand(90, this.H * 0.4),
        _origX: 0, _origY: 0, r: 22, color, shape: shapes[Utils.randInt(0, 5)],
        dragging: false, matched: false
      });
      this.items[this.items.length - 1]._origX = this.items[this.items.length - 1].x;
      this.items[this.items.length - 1]._origY = this.items[this.items.length - 1].y;
    }
    // 粒子
    for (let i = this.particles.length - 1; i >= 0; i--) {
      const p = this.particles[i];
      p.x += p.vx * dt; p.y += p.vy * dt; p.vy += 200 * dt; p.life -= dt;
      if (p.life <= 0) this.particles.splice(i, 1);
    }
    const done = this.items.filter(it => it.matched).length;
    if (done >= this.targetTrials && this.items.every(it => it.matched)) this.finish();
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 桶
    this.bins.forEach(bin => {
      ctx.fillStyle = bin.color + '40';
      GameUtils.drawRoundRect(ctx, bin.x - bin.w / 2, bin.y - bin.h / 2, bin.w, bin.h, 10);
      ctx.fill();
      ctx.strokeStyle = bin.color;
      ctx.lineWidth = 4;
      ctx.stroke();
      ctx.fillStyle = bin.color;
      ctx.font = 'bold 13px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(bin.label, bin.x, bin.y + 4);
    });
    // 物品
    this.items.forEach(it => {
      if (it.matched) return;
      ctx.fillStyle = it.color;
      ctx.font = `${it.r * 1.5}px sans-serif`;
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.fillText(it.shape, it.x, it.y);
      ctx.textBaseline = 'alphabetic';
      if (it.dragging) {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.arc(it.x, it.y, it.r + 4, 0, Math.PI * 2); ctx.stroke();
      }
    });
    // 粒子
    this.particles.forEach(p => {
      ctx.globalAlpha = p.life * 2;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    });
    ctx.globalAlpha = 1;
    const done = this.items.filter(it => it.matched).length;
    ctx.fillStyle = '#333';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    const remain = Math.max(0, Math.round(this.cfg.duration - (this._elapsedSec || 0)));
    ctx.fillText(`🎨 ${done} / ${this.targetTrials} · ${remain}s`, this.W / 2, 24);
  }
}
