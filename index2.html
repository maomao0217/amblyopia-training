// ============================================================
// 游戏：旋转拼图（心理旋转+空间知觉）
// ============================================================
class RotatePuzGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.rotatepuz.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentTrial = 0;
    this.shapes = ['▲','■','◆','▶','⬟','✚','⬠','⬢','✶','⬖','⏏','⚙'];
    this.setupBg('circles', ['#F5F3FF', '#C4B5FD'], 50, 12, 'radial', ['#F5F3FF', '#A78BFA'], 40, 8);
    this._genTrial();
  }
  _genTrial() {
    const shapes = Utils.shuffle(this.shapes).slice(0, this.cfg.shapes);
    const targetIdx = Utils.randInt(0, shapes.length - 1);
    this.targetShape = shapes[targetIdx];
    this.targetRotation = this.cfg.rotations[Utils.randInt(0, this.cfg.rotations.length - 1)];
    // 生成候选（目标+干扰）
    this.candidates = [];
    const correctRot = this.cfg.rotations[Utils.randInt(0, this.cfg.rotations.length - 1)];
    // 正确答案：同一个形状，不同旋转角度
    this.correctRot = correctRot;
    // 干扰：其他形状，随机旋转
    const others = shapes.filter((_, i) => i !== targetIdx);
    this.candidates.push({
      shape: this.targetShape, rot: correctRot, isCorrect: true
    });
    for (let i = 0; i < 3; i++) {
      if (i >= others.length) break;
      this.candidates.push({
        shape: others[i],
        rot: this.cfg.rotations[Utils.randInt(0, this.cfg.rotations.length - 1)],
        isCorrect: false
      });
    }
    this.candidates = Utils.shuffle(this.candidates);
    const cols = 2, rows = 2;
    this.btnPositions = [];
    const cellW = this.W / cols, cellH = (this.H - 120) / rows;
    for (let i = 0; i < this.candidates.length; i++) {
      const c = i % cols, r = Math.floor(i / cols);
      this.btnPositions.push({
        x: cellW * c + cellW / 2,
        y: cellH * r + cellH / 2 + 100
      });
    }
    this.feedback = 0;
    this.feedbackCorrect = false;
  }
  onUpdate(dt) {
    if (this.finished) return;
    if (this.feedback > 0) {
      this.feedback -= dt;
      if (this.feedback <= 0) {
        this.currentTrial++;
        if (this.currentTrial >= this.targetTrials) { this.currentTrial = 0; this.targetTrials += this.cfg.trials; return; }
        this._genTrial();
      }
    }
  }
  onInput(e) {
    if (this.finished || this.feedback > 0) return;
    for (let i = 0; i < this.btnPositions.length; i++) {
      const p = this.btnPositions[i];
      if (Math.abs(e.x - p.x) < 80 && Math.abs(e.y - p.y) < 80) {
        if (this.candidates[i] && this.candidates[i].isCorrect) {
          this.recordResult(true, 0);
          Audio.success();
          this.feedbackCorrect = true;
        } else {
          this.recordResult(false, 0);
          Audio.mistake();
          this.feedbackCorrect = false;
        }
        this.feedback = 0.8;
        break;
      }
    }
  }
  _drawRotatedShape(ctx, shape, x, y, rotDeg, size, color) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotDeg * Math.PI / 180);
    ctx.fillStyle = color || '#333';
    ctx.font = `${size}px sans-serif`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(shape, 0, 0);
    ctx.textBaseline = 'alphabetic';
    ctx.restore();
  }
  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);
    // 目标显示（原始方向）
    ctx.fillStyle = '#333';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(`旋转拼图 · ${this.currentTrial + 1} / ${this.targetTrials}`, this.W / 2, 22);
    ctx.fillText('找出旋转后的同一图形', this.W / 2, 44);
    // 原始参考
    this._drawRotatedShape(ctx, this.targetShape, this.W / 2, 72, this.targetRotation, '#EF4444');
    ctx.fillStyle = '#EF4444';
    ctx.font = 'bold 13px sans-serif';
    ctx.fillText('▲ 目标', this.W / 2, 98);
    // 候选
    this.candidates.forEach((cand, i) => {
      const p = this.btnPositions[i];
      const bgColor = (this.feedback > 0 && cand.isCorrect) ? '#DCFCE7' : '#FFFFFF';
      ctx.fillStyle = bgColor;
      ctx.strokeStyle = (this.feedback > 0 && cand.isCorrect) ? '#10B981' : '#DDD';
      ctx.lineWidth = (this.feedback > 0 && cand.isCorrect) ? 3 : 1;
      GameUtils.drawRoundRect(ctx, p.x - 70, p.y - 55, 140, 110, 12);
      ctx.fill(); ctx.stroke();
      this._drawRotatedShape(ctx, cand.shape, p.x, p.y - 5, cand.rot, 50, '#333');
      ctx.fillStyle = '#666';
      ctx.font = '12px sans-serif';
      ctx.fillText(`${cand.rot}°`, p.x, p.y + 38);
    });
    if (this.feedback > 0) {
      ctx.fillStyle = this.feedbackCorrect ? '#10B981' : '#EF4444';
      ctx.font = 'bold 24px sans-serif';
      ctx.fillText(this.feedbackCorrect ? '✓ 正确!' : '✗ 再想想', this.W / 2, this.H / 2);
    }
  }
}

function lightenColor(hex, amount) {
  const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
  const lr=Math.min(255,Math.round(r+(255-r)*amount)),lg=Math.min(255,Math.round(g+(255-g)*amount)),lb=Math.min(255,Math.round(b+(255-b)*amount));
  return '#'+[lr,lg,lb].map(v=>v.toString(16).padStart(2,'0')).join('');
}
function drawShapeElements(ctx, elements, cx, cy, size, mode) {
  if (mode === 'outline') {
    // Draw all elements as solid silhouette first (no internal strokes)
    for (const el of elements) {
      ctx.beginPath();
      const ex = cx + (el.x - 0.5) * size * 2;
      const ey = cy + (el.y - 0.5) * size * 2;
      const ew = (el.w || 0) * size * 2;
      const eh = (el.h || 0) * size * 2;
      const er = (el.r || 0.05) * size;
      switch (el.t) {
        case 'rect': ctx.rect(ex - ew/2, ey - eh/2, ew, eh); break;
        case 'circle': ctx.arc(ex, ey, er, 0, Math.PI * 2); break;
        case 'ellipse': ctx.ellipse(ex, ey, ew/2, eh/2, 0, 0, Math.PI * 2); break;
        case 'triangle':
          ctx.moveTo(cx + (el.points[0] - 0.5) * size * 2, cy + (el.points[1] - 0.5) * size * 2);
          ctx.lineTo(cx + (el.points[2] - 0.5) * size * 2, cy + (el.points[3] - 0.5) * size * 2);
          ctx.lineTo(cx + (el.points[4] - 0.5) * size * 2, cy + (el.points[5] - 0.5) * size * 2);
          ctx.closePath(); break;
        case 'polygon':
          ctx.moveTo(cx + (el.points[0] - 0.5) * size * 2, cy + (el.points[1] - 0.5) * size * 2);
          for (let i = 2; i < el.points.length; i += 2)
            ctx.lineTo(cx + (el.points[i] - 0.5) * size * 2, cy + (el.points[i+1] - 0.5) * size * 2);
          ctx.closePath(); break;
      }
      ctx.fillStyle='#F8F8F8';ctx.fill();
    }
    // Then draw strokes on top for visibility of key features
    ctx.strokeStyle = '#888';ctx.lineWidth = 2;
    for (const el of elements) {
      ctx.beginPath();
      const ex = cx + (el.x - 0.5) * size * 2;
      const ey = cy + (el.y - 0.5) * size * 2;
      const ew = (el.w || 0) * size * 2;
      const eh = (el.h || 0) * size * 2;
      const er = (el.r || 0.05) * size;
      switch (el.t) {
        case 'rect': ctx.rect(ex - ew/2, ey - eh/2, ew, eh); break;
        case 'circle': ctx.arc(ex, ey, er, 0, Math.PI * 2); break;
        case 'ellipse': ctx.ellipse(ex, ey, ew/2, eh/2, 0, 0, Math.PI * 2); break;
        case 'triangle':
          ctx.moveTo(cx + (el.points[0] - 0.5) * size * 2, cy + (el.points[1] - 0.5) * size * 2);
          ctx.lineTo(cx + (el.points[2] - 0.5) * size * 2, cy + (el.points[3] - 0.5) * size * 2);
          ctx.lineTo(cx + (el.points[4] - 0.5) * size * 2, cy + (el.points[5] - 0.5) * size * 2);
          ctx.closePath(); break;
        case 'polygon':
          ctx.moveTo(cx + (el.points[0] - 0.5) * size * 2, cy + (el.points[1] - 0.5) * size * 2);
          for (let i = 2; i < el.points.length; i += 2)
            ctx.lineTo(cx + (el.points[i] - 0.5) * size * 2, cy + (el.points[i+1] - 0.5) * size * 2);
          ctx.closePath(); break;
      }
      ctx.stroke();
    }
  } else {
    for (const el of elements) {
      ctx.beginPath();
      const ex = cx + (el.x - 0.5) * size * 2;
      const ey = cy + (el.y - 0.5) * size * 2;
      const ew = (el.w || 0) * size * 2;
      const eh = (el.h || 0) * size * 2;
      const er = (el.r || 0.05) * size;
      switch (el.t) {
        case 'rect': ctx.rect(ex - ew/2, ey - eh/2, ew, eh); break;
        case 'circle': ctx.arc(ex, ey, er, 0, Math.PI * 2); break;
        case 'ellipse': ctx.ellipse(ex, ey, ew/2, eh/2, 0, 0, Math.PI * 2); break;
        case 'triangle':
          ctx.moveTo(cx + (el.points[0] - 0.5) * size * 2, cy + (el.points[1] - 0.5) * size * 2);
          ctx.lineTo(cx + (el.points[2] - 0.5) * size * 2, cy + (el.points[3] - 0.5) * size * 2);
          ctx.lineTo(cx + (el.points[4] - 0.5) * size * 2, cy + (el.points[5] - 0.5) * size * 2);
          ctx.closePath(); break;
        case 'polygon':
          ctx.moveTo(cx + (el.points[0] - 0.5) * size * 2, cy + (el.points[1] - 0.5) * size * 2);
          for (let i = 2; i < el.points.length; i += 2)
            ctx.lineTo(cx + (el.points[i] - 0.5) * size * 2, cy + (el.points[i+1] - 0.5) * size * 2);
          ctx.closePath(); break;
      }
      ctx.fillStyle = el.c;ctx.fill();ctx.strokeStyle = '#333';ctx.lineWidth = 1;ctx.stroke();
    }
  }
}



function getShapeOutline(shapeName,cx,cy,size){
  const pts=SHAPES[shapeName];if(!pts)return[];
  return pts.map(p=>({x:cx+(p.x-0.5)*size*2,y:cy+(p.y-0.5)*size*2}));
}

// 生成虚线点（在轮廓线上均匀采样）
function generateDottedOutline(outline,n){
  if(outline.length<2)return[];
  // 计算总长度
  let totalLen=0;const segs=[];
  for(let i=0;i<outline.length;i++){const a=outline[i],b=outline[(i+1)%outline.length];const len=Utils.dist(a.x,a.y,b.x,b.y);segs.push({a,b,len});totalLen+=len}
  // 均匀采样
  const dots=[],step=totalLen/n;
  let cur=0,segIdx=0,segPos=0;
  for(let i=0;i<n;i++){
    const target=i*step;
    while(cur+segs[segIdx].len<target&&segIdx<segs.length-1){cur+=segs[segIdx].len;segIdx++}
    const t=Math.min(1,Math.max(0,(target-cur)/segs[segIdx].len));
    const a=segs[segIdx].a,b=segs[segIdx].b;
    dots.push({x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t});
  }
  return dots;
}

      }
    }

    if(this.completion>=0.995&&!this.feedback){
      const rt=performance.now()-this.levelStartTime;this.recordResult(true,rt);Audio.success();this.feedback='done';this.feedbackTime=performance.now();
    }
  }
  _skipLevel(){
    if(this.finished||this.feedback)return;
    const rt=performance.now()-this.levelStartTime;this.recordResult(false,rt);
    this.feedback='done';this.feedbackTime=performance.now();
  }
  onUpdate(dt){
    if(this.finished)return;
    if(this.feedback&&performance.now()-this.feedbackTime>600){this.currentLevel++;if(this.currentLevel>=this.cfg.levels){this.finish();return}this._genLevel()}
  }
  onRender(ctx){
    ctx.clearRect(0,0,this.W,this.H);this.drawScrollingBg(ctx);
    const r=parseInt(this.activeColor.slice(1,3),16),g=parseInt(this.activeColor.slice(3,5),16),b=parseInt(this.activeColor.slice(5,7),16);
    const imgData=this.octx.getImageData(0,0,Math.floor(this.W),Math.floor(this.H));
    for(let i=0;i<this.filled.length;i++){if(this.filled[i]){const idx=i*4;imgData.data[idx]=r;imgData.data[idx+1]=g;imgData.data[idx+2]=b}}
    const tmp=document.createElement('canvas');tmp.width=imgData.width;tmp.height=imgData.height;tmp.getContext('2d').putImageData(imgData,0,0);
    ctx.drawImage(tmp,0,0);
    ctx.fillStyle='#FFF';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    const label=SHAPE_NAMES[this.shapeName]||this.shapeName;
    ctx.strokeText('涂色·'+label+'·'+Math.floor(this.completion*100)+'%·'+(this.currentLevel+1)+'/'+this.cfg.levels,this.W/2,20);
    ctx.fillText('涂色·'+label+'·'+Math.floor(this.completion*100)+'%·'+(this.currentLevel+1)+'/'+this.cfg.levels,this.W/2,20);
  }
}

// 游戏2：描线画图 TraceLineGame
// ============================================================
class TraceLineGame extends BaseGame {
  onStart(){
    const cfg=GAME_CONFIGS.traceline.difficulties[this.difficulty];
    this.cfg=cfg;this.targetTrials=cfg.levels;this.currentLevel=0;
    this.bgEnabled=false;this.userPath=[];this.isDrawing=false;this._genLevel();
  }
  _genLevel(){
    const cfg=this.cfg;const availShapes=Object.keys(SHAPES).filter(k=>(SHAPE_DIFFICULTY[k]||3)<=this.difficulty+2);
    this.shapeName=availShapes[Utils.randInt(0,availShapes.length-1)];
    const cx=this.W/2,cy=this.H/2,r=Math.min(this.W,this.H)*0.32;
    this.outline=getShapeOutline(this.shapeName,cx,cy,r);
    this.dots=generateDottedOutline(this.outline,Math.max(25,Math.floor(45-this.difficulty*3)));
    this.startDot=this.outline[0];this.endDot=this.outline[this.outline.length-1];
    this.userPath=[];this.isDrawing=false;this.hasStarted=false;
    this.feedback=null;this.feedbackTime=0;this.levelStartTime=performance.now();
  }
  onInput(e){
    if(this.finished||this.feedback)return;
    if(e.type==='pointerdown'){this.isDrawing=true;this.userPath=[];this.hasStarted=false}
    if(e.type==='move'&&this.isDrawing){this.userPath.push({x:e.x,y:e.y});if(!this.hasStarted&&this.userPath.length>=2)this.hasStarted=true}
    if(e.type==='up'&&this.isDrawing){this.isDrawing=false;if(this.userPath.length>=5)this._check()}
  }
  _check(){
    let score=0;const n=Math.min(this.dots.length,40);
    const sampledDots=[];for(let i=0;i<n;i++)sampledDots.push(this.dots[Math.floor(i/n*this.dots.length)]);
    for(const dot of sampledDots){let md=Infinity;for(const p of this.userPath){const d=Utils.dist(dot.x,dot.y,p.x,p.y);if(d<md)md=d}if(md<=this.cfg.tolerance*2)score++}
    const acc=score/sampledDots.length;
    if(acc>=0.6){const rt=performance.now()-this.levelStartTime;this.recordResult(true,rt);Audio.success();this.feedback='correct'}
    else{this.recordResult(false,performance.now()-this.levelStartTime);Audio.mistake();this.feedback='wrong'}
    this.feedbackTime=performance.now();
  }
  onUpdate(dt){
    if(this.finished)return;
    if(this.feedback&&performance.now()-this.feedbackTime>800){this.currentLevel++;if(this.currentLevel>=this.cfg.levels){this.finish();return}this._genLevel()}
  }
  onRender(ctx){
    ctx.clearRect(0,0,this.W,this.H);this.drawScrollingBg(ctx);
    ctx.fillStyle='#FFF';ctx.strokeStyle='#000';ctx.lineWidth=2;ctx.font='bold 14px sans-serif';ctx.textAlign='center';
    ctx.strokeText('描线画图·'+(SHAPE_NAMES[this.shapeName]||this.shapeName)+'·'+(this.currentLevel+1)+'/'+this.cfg.levels,this.W/2,20);
    ctx.fillText('描线画图·'+(SHAPE_NAMES[this.shapeName]||this.shapeName)+'·'+(this.currentLevel+1)+'/'+this.cfg.levels,this.W/2,20);
    // 虚线轮廓（虚线+圆点）
    ctx.strokeStyle='#999';ctx.lineWidth=3;ctx.setLineDash([5,9]);
    ctx.beginPath();ctx.moveTo(this.outline[0].x,this.outline[0].y);
    for(let i=1;i<this.outline.length;i++)ctx.lineTo(this.outline[i].x,this.outline[i].y);
    ctx.closePath();ctx.stroke();ctx.setLineDash([]);
    this.dots.forEach(d=>{ctx.fillStyle='#777';ctx.beginPath();ctx.arc(d.x,d.y,4,0,Math.PI*2);ctx.fill()});
    // 起点
    ctx.fillStyle='#4ADE80';ctx.beginPath();ctx.arc(this.startDot.x,this.startDot.y,9,0,Math.PI*2);ctx.fill();
    ctx.strokeStyle='#333';ctx.lineWidth=2;ctx.stroke();ctx.fillStyle='#FFF';ctx.font='bold 10px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText('起',this.startDot.x,this.startDot.y);
    // 终点
    ctx.fillStyle='#FF6B6B';ctx.beginPath();ctx.arc(this.endDot.x,this.endDot.y,9,0,Math.PI*2);ctx.fill();ctx.strokeStyle='#333';ctx.stroke();
    ctx.fillStyle='#FFF';ctx.fillText('终',this.endDot.x,this.endDot.y);
    // 用户描线
    if(this.userPath.length>1){ctx.strokeStyle='#4A9EFF';ctx.lineWidth=5;ctx.lineCap='round';ctx.lineJoin='round';ctx.shadowColor='rgba(74,158,255,0.5)';ctx.shadowBlur=6;ctx.beginPath();ctx.moveTo(this.userPath[0].x,this.userPath[0].y);for(let i=1;i<this.userPath.length;i++)ctx.lineTo(this.userPath[i].x,this.userPath[i].y);ctx.stroke();ctx.shadowBlur=0}
    if(this.feedback){ctx.fillStyle=this.feedback==='correct'?'#4ADE80':'#FF6B6B';ctx.font='bold 30px sans-serif';ctx.textAlign='center';ctx.fillText(this.feedback==='correct'?'✓':'✗',this.W/2,this.H-40)}
    ctx.fillStyle='#666';ctx.font='12px sans-serif';ctx.textAlign='center';ctx.fillText('从绿点"起"开始，沿虚线描到红点"终"',this.W/2,this.H-12);
  }
}
registerGame('traceline', TraceLineGame);

function drawSceneElements(ctx, elements, ox, oy, sw, sh, mode) {
  for (const el of elements) {
    ctx.beginPath();
    const ex = ox + el.x * sw, ey = oy + el.y * sh;
    const ew = (el.w || 0) * sw, eh = (el.h || 0) * sh;
    const er = (el.r || 0.05) * Math.min(sw, sh);
    switch (el.t) {
      case 'rect':
        ctx.rect(ex, ey, ew, eh);
        break;
      case 'circle':
        ctx.arc(ex, ey, er, 0, Math.PI * 2);
        break;
      case 'ellipse':
        ctx.ellipse(ex, ey, ew / 2, eh / 2, 0, 0, Math.PI * 2);
        break;
      case 'triangle':
        ctx.moveTo(ox + el.points[0] * sw, oy + el.points[1] * sh);
        ctx.lineTo(ox + el.points[2] * sw, oy + el.points[3] * sh);
        ctx.lineTo(ox + el.points[4] * sw, oy + el.points[5] * sh);
        ctx.closePath();
        break;
      case 'star5':
        const cx2 = ex, cy2 = ey, outerR = er, innerR = er * 0.4;
        for (let i = 0; i < 5; i++) {
          const angle = -Math.PI / 2 + (i * Math.PI * 2) / 5;
          const ox2 = cx2 + Math.cos(angle) * outerR;
          const oy2 = cy2 + Math.sin(angle) * outerR;
          const ix = cx2 + Math.cos(angle + Math.PI / 5) * innerR;
          const iy = cy2 + Math.sin(angle + Math.PI / 5) * innerR;
          if (i === 0) ctx.moveTo(ox2, oy2);
          else ctx.lineTo(ox2, oy2);
          ctx.lineTo(ix, iy);
        }
        ctx.closePath();
        break;
    }
    if (mode === 'filled') {
      ctx.fillStyle = el.c;
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1;
      ctx.stroke();
    } else {
      ctx.fillStyle = '#F0F0F0';
      ctx.fill();
      ctx.strokeStyle = '#555';
      ctx.lineWidth = 2;
      ctx.stroke();
    }
  }
}

function getSceneColors(scene) {
  const colors = [];
  const seen = new Set();
  for (const el of scene.elements) {
    if (!seen.has(el.c)) {
      seen.add(el.c);
      colors.push(el.c);
    }
  }
  return colors.slice(0, 8);
}

  '公园':1,'小猪佩奇':1,'彩虹':1,'农场':2,'游乐场':2,'一家人吃饭':2,'雪人':2,'海底世界':3,'爸爸妈妈和宝宝':3,'恐龙':3,'花园':3,'生日派对':4,'海滩':4,'太空':4,'动物园':4,'糖果屋':4,'冰淇淋车':4,'一家人在做饭':5,'城堡':5,'教室':5

class ComplexColorGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.complexcolor.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.scenes;
    this.currentLevel = 0;
    this.activeColor = PALETTE_COLORS[0];
    this.isErasing = false;
    this.brushMult = 0.65;
    this.currentBrushR = Math.round(cfg.brushR * this.brushMult);
    this.bgEnabled = false;
    this._initOffscreen();
    const eligibleScenes = COMPLEX_SCENES.map((s,i)=>i).filter(i=>(SCENE_DIFFICULTY[COMPLEX_SCENES[i].name]||3)<=this.difficulty+2);
    this._sceneIndices = Utils.shuffle(eligibleScenes.length>=cfg.scenes?eligibleScenes:[...Array(COMPLEX_SCENES.length).keys()]).slice(0, cfg.scenes);
    this._sceneIdx = 0;
    this._genLevel();
    this._renderPalette();
  }

  _initOffscreen() {
    const w = Math.floor(this.W), h = Math.floor(this.H);
    this.offscreen = document.createElement('canvas');
    this.offscreen.width = w;
    this.offscreen.height = h;
    this.octx = this.offscreen.getContext('2d');
    this.filledColor = new Uint8Array(w * h);
    this.filledColor.fill(255);
  }

  _renderPalette() {
    const ctrl = document.getElementById('game-controls');
    if (!ctrl) return;
    const sceneColors = getSceneColors(this.scene);
    this._allColors = [...new Set([...sceneColors, ...PALETTE_COLORS])];
    const sizes = [{l:'S',m:0.4},{l:'M',m:0.65},{l:'L',m:1.0}];
    ctrl.innerHTML = '<div class="flex justify-center gap-1 p-2 flex-wrap max-w-md mx-auto items-center">' +
      this._allColors.map((c, i) =>
        '<button data-ccolor="' + c + '" class="color-btn w-9 h-9 rounded-full border-2 ' +
        (c === this.activeColor && !this.isErasing ? 'border-gray-800 scale-110' : 'border-gray-300') +
        '" style="background:' + c + '"></button>'
      ).join('') +
      '<span class="text-xs text-gray-400 mx-1">笔刷</span>' +
      sizes.map(s => '<button data-brush="' + s.m + '" class="w-7 h-7 rounded-full text-xs font-bold border-2 ' + (this.brushMult === s.m ? 'bg-primary text-white border-primary' : 'bg-white text-gray-500 border-gray-300') + '">' + s.l + '</button>').join('') +
      '<button id="eraser-btn" class="color-btn w-9 h-9 rounded-full border-2 flex items-center justify-center text-sm ' + (this.isErasing ? 'border-gray-800 scale-110 bg-gray-100' : 'border-gray-300 bg-white') + '">🧹</button>' +
      '<button id="skip-btn" class="px-2 py-2 rounded-xl bg-warm text-white text-xs font-bold active:scale-95 transition-transform">下一关 →</button>' +
      '</div>';
    ctrl.querySelectorAll('[data-ccolor]').forEach(b => {
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        this.activeColor = b.dataset.ccolor;
        this.isErasing = false;
        this._renderPalette();
        Audio.click();
      });
    });
    ctrl.querySelectorAll('[data-brush]').forEach(b => {
      b.addEventListener('pointerdown', e => {
        e.preventDefault();
        this.brushMult = parseFloat(b.dataset.brush);
        this.currentBrushR = Math.round(this.cfg.brushR * this.brushMult);
        this._renderPalette();
        Audio.click();
      });
    });
    const eraserBtn = ctrl.querySelector('#eraser-btn');
    if (eraserBtn) eraserBtn.addEventListener('pointerdown', e => {
      e.preventDefault(); this.isErasing = !this.isErasing; this._renderPalette(); Audio.click();
    });
    const skipBtn = ctrl.querySelector('#skip-btn');
    if (skipBtn) skipBtn.addEventListener('pointerdown', e => {
      e.preventDefault(); this._skipLevel();
    });
  }

  _genLevel() {
    const cfg = this.cfg;
    this.scene = COMPLEX_SCENES[this._sceneIndices[this._sceneIdx]];
    this.filledColor.fill(255);
    this.filledPixels = 0;
    const w = Math.floor(this.W), h = Math.floor(this.H);
    const ctx = this.octx;
    ctx.clearRect(0, 0, w, h);
    ctx.fillStyle = '#FFFFFF';
    ctx.fillRect(0, 0, w, h);

    // Draw outline on the RIGHT side (where user fills)
    const midX = this.W * 0.47;
    const rsw = (this.W - midX) * 0.82;
    const rsh = this.H - 90;
    const rox = midX + (this.W - midX - rsw) / 2;
    const roy = 45;
    drawSceneElements(ctx, this.scene.elements, rox + rsw * 0.05, roy, rsw * 0.9, rsh, 'outline');

    const img = ctx.getImageData(0, 0, w, h).data;
    this.totalPixels = 0;
    for (let y = 0; y < h; y++) {
      for (let x = 0; x < w; x++) {
        const i = (y * w + x) * 4;
        if (img[i] < 250 || img[i + 1] < 250 || img[i + 2] < 250) this.totalPixels++;
      }
    }
    this.completion = 0;
    this.isDrawing = false;
    this.feedback = null;
    this.feedbackTime = 0;
    this.levelStartTime = performance.now();
  }

  onInput(e) {
    if (this.finished || this.feedback) return;
    if (e.type === 'pointerdown') this.isDrawing = true;
    if (e.type === 'up') this.isDrawing = false;
    if (!this.isDrawing && e.type !== 'move') return;
    if (e.x < 0 || e.y < 0 || e.x >= this.W || e.y >= this.H) return;
    const ctx = this.octx, x = Math.floor(e.x), y = Math.floor(e.y);
    const br = this.currentBrushR, w = Math.floor(this.W), h = Math.floor(this.H);
    const colorIdx = this._allColors.indexOf(this.activeColor);
    if (this.isErasing) {
      for (let dy = -br; dy <= br; dy++) {
        for (let dx = -br; dx <= br; dx++) {
          if (dx * dx + dy * dy > br * br) continue;
          const px = x + dx, py = y + dy;
          if (px < 0 || py < 0 || px >= w || py >= h) continue;
          const idx = py * w + px;
          if (this.filledColor[idx] !== 255) { this.filledColor[idx] = 255; this.filledPixels--; }
        }
      }
    } else {
      for (let dy = -br; dy <= br; dy++) {
        for (let dx = -br; dx <= br; dx++) {
          if (dx * dx + dy * dy > br * br) continue;
          const px = x + dx, py = y + dy;
          if (px < 0 || py < 0 || px >= w || py >= h) continue;
          const idx = py * w + px;
          if (this.filledColor[idx] !== 255) continue;
          const pd = ctx.getImageData(px, py, 1, 1).data;
          if (pd[0] < 250 || pd[1] < 250 || pd[2] < 250) {
            this.filledColor[idx] = colorIdx;
            this.filledPixels++;
          }
        }
      }
    }
    this.completion = this.totalPixels ? this.filledPixels / this.totalPixels : 0;
    if (this.completion >= 0.995 && !this.feedback) {
      const rt = performance.now() - this.levelStartTime;
      this.recordResult(true, rt);
      Audio.success();
      this.feedback = 'done';
      this.feedbackTime = performance.now();
    }
  }
  _skipLevel() {
    if (this.finished || this.feedback) return;
    const rt = performance.now() - this.levelStartTime;
    this.recordResult(false, rt);
    this.feedback = 'done';
    this.feedbackTime = performance.now();
  }

  onUpdate(dt) {
    if (this.finished) return;
    if (this.feedback && performance.now() - this.feedbackTime > 800) {
      this.currentLevel++;
      if (this.currentLevel >= this.cfg.scenes) {
        this.finish();
        return;
      }
      this._sceneIdx++;
      this._genLevel();
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    ctx.fillStyle = '#FFF8F0';
    ctx.fillRect(0, 0, this.W, this.H);

    const midX = this.W * 0.47;
    const rsw = midX - 10, rsh = this.H - 70;
    const rox = 5, roy = 35;

    // Left side: reference (filled)
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, midX, this.H);
    ctx.clip();
    ctx.fillStyle = '#FFF';
    ctx.fillRect(0, 0, midX, this.H);
    drawSceneElements(ctx, this.scene.elements, rox + rsw * 0.05, roy, rsw * 0.9, rsh, 'filled');
    ctx.restore();

    // Divider line
    ctx.strokeStyle = '#CCC';
    ctx.lineWidth = 2;
    ctx.setLineDash([4, 4]);
    ctx.beginPath();
    ctx.moveTo(midX, 30);
    ctx.lineTo(midX, this.H - 50);
    ctx.stroke();
    ctx.setLineDash([]);

    // Right side: fill area
    ctx.save();
    ctx.beginPath();
    ctx.rect(midX, 0, this.W - midX, this.H);
    ctx.clip();

    // Draw filled pixels with their stored colors
    const w = Math.floor(this.W), h = Math.floor(this.H);
    const imgData = this.octx.getImageData(0, 0, w, h);
    for (let i = 0; i < this.filledColor.length; i++) {
      const ci = this.filledColor[i];
      if (ci !== 255) {
        const c = this._allColors[ci] || PALETTE_COLORS[0];
        const idx = i * 4;
        imgData.data[idx] = parseInt(c.slice(1, 3), 16);
        imgData.data[idx + 1] = parseInt(c.slice(3, 5), 16);
        imgData.data[idx + 2] = parseInt(c.slice(5, 7), 16);
        imgData.data[idx + 3] = 255;
      }
    }
    const tmp = document.createElement('canvas');
    tmp.width = w;
    tmp.height = h;
    tmp.getContext('2d').putImageData(imgData, 0, 0);
    ctx.drawImage(tmp, 0, 0);

    // Feedback checkmark
    if (this.feedback) {
      ctx.fillStyle = '#4ADE80';
      ctx.font = 'bold 40px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('✓', this.W * 0.73, this.H / 2);
    }
    ctx.restore();

    // Labels
    ctx.fillStyle = '#333';
    ctx.font = 'bold 13px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('参考图', this.W * 0.12, 22);
    ctx.fillText('填色 · ' + Math.round(this.completion * 100) + '%', this.W * 0.73, 22);

    // Hint colors - larger display with background
    const sceneColors = getSceneColors(this.scene);
    const hintY = this.H - 52;
    ctx.fillStyle = 'rgba(0,0,0,0.08)';
    ctx.beginPath();
    const hintW = Math.max(120, sceneColors.length * 26 + 40);
    ctx.roundRect(this.W * 0.73 - hintW/2, hintY - 8, hintW, 30, 12);
    ctx.fill();
    ctx.fillStyle = '#444';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('参考色', this.W * 0.73, hintY - 12);
    sceneColors.forEach((c, i) => {
      const sx = this.W * 0.73 - (sceneColors.length - 1) * 13 + i * 26;
      ctx.fillStyle = c;
      ctx.beginPath();
      ctx.arc(sx, hintY + 10, 9, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = '#333';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });

    ctx.fillStyle = '#666';
    ctx.fillText(this.scene.name + ' · ' + (this._sceneIdx + 1) + '/' + this.cfg.scenes, this.W * 0.73, this.H - 15);

    // No time limit indicator
    ctx.fillStyle = '#999';
    ctx.font = '11px sans-serif';
    ctx.fillText('不限时间', this.W * 0.9, this.H - 5);
  }

  finish() {
    if (this.finished) return true;
    console.log('[DEBUG-d4f2] finish() called, stats:', this.getStats());
    this.finished = true;
    this.callbacks.onEnd(this.getStats());
return true;
  }
}
registerGame('complexcolor', ComplexColorGame);

return { init, Store, Router, Renderer, Audio, GameEngine, AI, EventBus, PatchingTimer, Modal };



})();
</script>
