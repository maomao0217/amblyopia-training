  }
};

// ============================================================
// 游戏注册机制 + 工具
// ============================================================
const GAME_REGISTRY = {};
function registerGame(id, cls) { GAME_REGISTRY[id] = cls; }

const GameUtils = {
  drawEmoji(ctx, emoji, x, y, size) {
    ctx.font = size + 'px sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(emoji, x, y);
  },
  hitEmoji(x, y, ex, ey, size) {
    return Utils.dist(x, y, ex, ey) < size * 0.55;
  },
  drawRoundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  },
  lerp(a, b, t) { return a + (b - a) * t; },
  pointToLineDist(px, py, x1, y1, x2, y2) {
    const dx = x2 - x1, dy = y2 - y1;
    const len2 = dx*dx + dy*dy;
    if (len2 === 0) return Utils.dist(px, py, x1, y1);
    let t = ((px-x1)*dx + (py-y1)*dy) / len2;
    t = Utils.clamp(t, 0, 1);
    return Utils.dist(px, py, x1 + t*dx, y1 + t*dy);
  }
};

// ============================================================
// 背景系统 - Canvas绘制滚动条纹/图案刺激视觉
// ============================================================
const BgPatterns = {
  // 颜色切换画布颜色
  colorSwitchColors: ['#FFFFFF', '#000000', '#FF4444', '#FFD700', '#4488FF'],

  // 绘制颜色切换背景
  drawColorSwitch(ctx, w, h, elapsedSec) {
    const idx = Math.floor(elapsedSec / 2.0) % this.colorSwitchColors.length;
    ctx.fillStyle = this.colorSwitchColors[idx];
    ctx.fillRect(0, 0, w, h);
  },

  // 滚动棋盘格
  drawChecker(ctx, w, h, offset, size, c1, c2) {
    const cols = Math.ceil(w / size) + 2;
    const rows = Math.ceil(h / size) + 2;
    for (let r = -1; r < rows; r++) {
      for (let c = -1; c < cols; c++) {
        ctx.fillStyle = ((r + c) % 2 === 0) ? c1 : c2;
        ctx.fillRect(c * size - offset, r * size - offset, size, size);
      }
    }
  },

  // 水平条纹（上下滚动）
  drawHStripes(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = c2;
    for (let y = -size; y < h + size; y += size) {
      ctx.fillRect(0, y - offset, w, size / 2);
    }
  },

  // 竖条纹（左右滚动）
  drawVStripes(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = c2;
    for (let x = -size; x < w + size; x += size) {
      ctx.fillRect(x - offset, 0, size / 2, h);
    }
  },

  // 斜条纹（45度滚动）
  drawDiagonal(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = c2;
    const step = size;
    const diag = Math.sqrt(2) * step;
    for (let i = -diag * 2; i < w + h + diag * 2; i += step) {
      ctx.beginPath();
      ctx.moveTo(i - offset, 0);
      ctx.lineTo(i + step / 2 - offset, 0);
      ctx.lineTo(i + step / 2 + h - offset, h);
      ctx.lineTo(i + h - offset, h);
      ctx.closePath();
      ctx.fill();
    }
  },

  // 波浪条纹
  drawWavy(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = c2;
    const amp = size * 0.4;
    for (let i = 0; i < 5; i++) {
      ctx.beginPath();
      const baseY = i * size * 2 + offset % (size * 2);
      ctx.moveTo(0, baseY);
      for (let x = 0; x <= w; x += 5) {
        ctx.lineTo(x, baseY + Math.sin(x / 40 + i) * amp);
      }
      ctx.lineTo(w, baseY + size);
      for (let x = w; x >= 0; x -= 5) {
        ctx.lineTo(x, baseY + size + Math.sin(x / 40 + i) * amp);
      }
      ctx.closePath();
      ctx.fill();
    }
  },

  // 锯齿条纹
  drawZigzag(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    ctx.strokeStyle = c2;
    ctx.lineWidth = size / 3;
    for (let i = 0; i < 8; i++) {
      ctx.beginPath();
      const baseY = i * size * 2 + offset % (size * 2);
      ctx.moveTo(0, baseY);
      for (let x = 0; x <= w; x += size) {
        ctx.lineTo(x, baseY + (Math.floor(x / size) % 2 === 0 ? 0 : size));
      }
      ctx.stroke();
    }
  },

  // 同心圆扩散
  drawCircles(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const maxR = Math.sqrt(cx * cx + cy * cy) + size;
    for (let r = offset % size; r < maxR; r += size) {
      ctx.strokeStyle = c2;
      ctx.lineWidth = size / 3;
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.stroke();
    }
  },

  // 渐变条纹（多个渐变色带滚动）
  drawGradientBars(ctx, w, h, offset, size, colors) {
    const barH = h / (colors.length + 1);
    for (let i = 0; i < colors.length; i++) {
      const y = (i * barH - offset) % (h + barH * 2) - barH;
      // 绘制两条（循环）
      for (let j = -1; j < Math.ceil(h / (barH * colors.length)) + 2; j++) {
        const yy = y + j * barH * colors.length;
        const grad = ctx.createLinearGradient(0, yy, 0, yy + barH);
        grad.addColorStop(0, colors[i]);
        grad.addColorStop(1, colors[(i + 1) % colors.length]);
        ctx.fillStyle = grad;
        ctx.fillRect(0, yy, w, barH + 2);
      }
    }
  },

  // 旋转放射线
  drawRadial(ctx, w, h, angle, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    const cx = w / 2, cy = h / 2;
    const maxR = Math.sqrt(cx * cx + cy * cy);
    const slices = 12;
    ctx.fillStyle = c2;
    for (let i = 0; i < slices; i++) {
      const a = angle + (i * Math.PI * 2) / slices;
      ctx.beginPath();
      ctx.moveTo(cx, cy);
      ctx.arc(cx, cy, maxR, a, a + Math.PI / slices);
      ctx.closePath();
      if (i % 2 === 0) ctx.fill();
    }
  },

  // 点阵滚动
  drawDots(ctx, w, h, offset, size, c1, c2) {
    ctx.fillStyle = c1;
    ctx.fillRect(0, 0, w, h);
    const cols = Math.ceil(w / size) + 2;
    const rows = Math.ceil(h / size) + 2;
    for (let r = -1; r < rows; r++) {
      for (let c = -1; c < cols; c++) {
        ctx.fillStyle = ((r + c) % 2 === 0) ? c2 : c1;
        ctx.beginPath();
        ctx.arc(c * size - offset, r * size - offset, size / 3, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  }
};

// ============================================================
// 游戏基类
// ============================================================
class BaseGame {
  constructor(ctx, w, h, difficulty, callbacks) {
    this.ctx = ctx;
    this.W = w;
    this.H = h;
    this.difficulty = difficulty;
    this.callbacks = callbacks;
    this.startTime = performance.now();
    this.totalTrials = 0;
    this.correctTrials = 0;
    this.reactionTimes = [];
    this.finished = false;
    this.targetTrials = 0;
    // 滚动背景
    this._lastDt = 0;
    this.bgOffset = 0;
    this.bgAngle = 0;
    this._bgElapsed = 0;
    // 双背景切换
    this._bgConfigs = [];
    this._bgActiveIdx = 0;
    this._bgSwitchInterval = 10 + Math.random() * 5; // 10-15秒切换
    // 当前背景参数
    this.bgType = 'checker';
    this.bgColors = ['#222222', '#FFFFFF'];
    this.bgSize = 50;
    this.bgSpeed = 25;
    this.bgEnabled = true;
  }

  onStart() {}
  onUpdate(dt) { this._lastDt = dt; }
  onRender(ctx) {}
  onInput(e) {}

  _applyBgConfig(idx) {
    const cfg = this._bgConfigs[idx];
    if (!cfg) return;
    this.bgType = cfg.type;
    this.bgColors = cfg.colors;
    this.bgSize = cfg.size;
    this.bgSpeed = cfg.speed;
  }

  // 设置背景（支持1组或2组配置，自动切换）
  setupBg(type, colors, size, speed, type2, colors2, size2, speed2) {
    this._bgConfigs = [
      { type, colors: colors || ['#222222', '#FFFFFF'], size: size || 50, speed: speed || 25 }
    ];
    if (type2) {
      this._bgConfigs.push({ type: type2, colors: colors2 || colors, size: size2 || size, speed: speed2 || speed });
    } else {
      // 自动生成互补的第二个背景
      this._bgConfigs.push(this._genComplementaryBg(type, colors, size, speed));
    }
    this._bgElapsed = 0;
    this._bgActiveIdx = 0;
    this._bgSwitchInterval = 10 + Math.random() * 5;
    this._applyBgConfig(0);
  }

  // 自动生成互补背景
  _genComplementaryBg(type, colors, size, speed) {
    const altTypes = ['checker','hstripes','vstripes','diagonal','wavy','zigzag','circles','dots','radial'];
    const altType = altTypes[Math.floor(Math.random() * altTypes.length)];
    // 颜色互补：交换或调整
    const altColors = [colors[1] || '#FFFFFF', colors[0] || '#222222'];
    return { type: altType, colors: altColors, size: size * (0.8 + Math.random() * 0.4), speed: speed * (0.8 + Math.random() * 0.4) };
  }

  // 设置为颜色切换背景（五色循环：黑白红黄蓝，每2秒切换）
  setupColorSwitchBg() {
    this.bgType = 'colorSwitch';
    this._bgConfigs = [];
  }

  // 滚动背景绘制 - 刺激弱视眼，刺激视觉运动
  drawScrollingBg(ctx) {
    if (!this.bgEnabled) {
      ctx.fillStyle = '#FFF8F0';
      ctx.fillRect(0, 0, this.W, this.H);
      return;
    }

    // 双背景切换计时（放在这里确保每帧都检查）
    if (this._bgConfigs.length >= 2) {
      this._bgElapsed += (this._lastDt || 0.016);
      if (this._bgElapsed >= this._bgSwitchInterval) {
        this._bgElapsed = 0;
        this._bgActiveIdx = (this._bgActiveIdx + 1) % this._bgConfigs.length;
        this._bgSwitchInterval = 10 + Math.random() * 5;
        this._applyBgConfig(this._bgActiveIdx);
      }
    }

    const speed = this.bgSpeed;
    const size = this.bgSize;
    const c1 = this.bgColors[0];
    const c2 = this.bgColors[1] || '#FFFFFF';

    // 颜色切换背景
    if (this.bgType === 'colorSwitch') {
      const elapsed = (performance.now() - this.startTime) / 1000;
      BgPatterns.drawColorSwitch(ctx, this.W, this.H, elapsed);
      return;
    }

    // 计算滚动偏移
    this.bgOffset = (this.bgOffset + (this._lastDt || 0.016) * speed) % (size * 2);

    switch (this.bgType) {
      case 'checker':
        BgPatterns.drawChecker(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'hstripes':
        BgPatterns.drawHStripes(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'vstripes':
        BgPatterns.drawVStripes(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'diagonal':
        BgPatterns.drawDiagonal(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'wavy':
        BgPatterns.drawWavy(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'zigzag':
        BgPatterns.drawZigzag(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'circles':
        BgPatterns.drawCircles(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'dots':
        BgPatterns.drawDots(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
        break;
      case 'gradient':
        this.bgAngle = (this.bgAngle + (this._lastDt || 0.016) * speed * 0.02) % (Math.PI * 2);
        BgPatterns.drawGradientBars(ctx, this.W, this.H, this.bgOffset, size, this.bgColors);
        break;
      case 'radial':
        this.bgAngle = (this.bgAngle + (this._lastDt || 0.016) * speed * 0.05) % (Math.PI * 2);
        BgPatterns.drawRadial(ctx, this.W, this.H, this.bgAngle, c1, c2);
        break;
      default:
        BgPatterns.drawChecker(ctx, this.W, this.H, this.bgOffset, size, c1, c2);
    }
  }

  recordResult(correct, rtMs) {
    this.totalTrials++;
    if (correct) this.correctTrials++;
    if (rtMs > 0) this.reactionTimes.push(rtMs);
    this.callbacks.onProgress(this.getProgress());
  }

  getProgress() {
    return { trials: this.totalTrials, targetTrials: this.targetTrials, pct: this.targetTrials ? this.totalTrials / this.targetTrials : 0 };
  }

  getStats() {
    const avgRT = this.reactionTimes.length
      ? Math.round(this.reactionTimes.reduce((a,b)=>a+b,0) / this.reactionTimes.length)
      : 0;
    return {
      accuracy: this.totalTrials ? this.correctTrials / this.totalTrials : 0,
      avgReactionMs: avgRT,
      durationSec: Math.round((performance.now() - this.startTime) / 1000),
      totalTrials: this.totalTrials,
      correctTrials: this.correctTrials,
      difficulty: this.difficulty
    };
  }

  isFinished() { return this.finished; }

  finish() {
    if (this.finished) return true;
    console.log('[DEBUG-d4f2] finish() called, stats:', this.getStats());
    this.finished = true;
    this.callbacks.onEnd(this.getStats());
return true;
  }

  // 当finish被延迟时调用，子类可重写来继续生成游戏内容
  onContinuePlaying() {}
}

// ============================================================
// 时长制游戏基类（气球/打地鼠/切水果/接金币等）
// ============================================================
class TimedGame extends BaseGame {
  constructor(ctx, w, h, difficulty, callbacks) {
    super(ctx, w, h, difficulty, callbacks);
    this.elapsedSec = 0;
    this.durationSec = 0;
  }
  getProgress() {
    return { trials: Math.round(this.elapsedSec), targetTrials: this.durationSec, pct: this.durationSec ? this.elapsedSec / this.durationSec : 0 };
  }
  getStats() {
    const avgRT = this.reactionTimes.length
      ? Math.round(this.reactionTimes.reduce((a,b)=>a+b,0) / this.reactionTimes.length) : 0;
    return {
      accuracy: this.totalTrials ? this.correctTrials / this.totalTrials : 0,
      avgReactionMs: avgRT,
      durationSec: Math.round(this.elapsedSec),
      totalTrials: this.totalTrials,
      correctTrials: this.correctTrials,
      difficulty: this.difficulty
    };
  }
}

// ============================================================
// 游戏1：视标辨认（E字）EVideoGame
// ============================================================
class EVideoGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.evideo.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.trials;
    this.currentDir = null;
    this.showTime = 0;
    this.feedback = null; // 'correct' | 'wrong' | null
    this.feedbackTime = 0;
    // E字用水平条纹背景滚动刺激视觉
    this.setupBg('hstripes', ['#FF4444', '#4488FF'], 40, 35);
    this._nextTrial();

    // 渲染方向按钮
    const controls = document.getElementById('game-controls');
    if (controls) {
      controls.innerHTML = `
        <div class="grid grid-cols-2 gap-3 p-4 max-w-sm mx-auto">
          <button data-direction="up" class="bg-white shadow-lg rounded-2xl py-6 text-4xl active:scale-95 transition-transform">⬆️</button>
          <button data-direction="down" class="bg-white shadow-lg rounded-2xl py-6 text-4xl active:scale-95 transition-transform">⬇️</button>
          <button data-direction="left" class="bg-white shadow-lg rounded-2xl py-6 text-4xl active:scale-95 transition-transform">⬅️</button>
          <button data-direction="right" class="bg-white shadow-lg rounded-2xl py-6 text-4xl active:scale-95 transition-transform">➡️</button>
        </div>
      `;
    }
  }

  _nextTrial() {
    const dirs = ['up','down','left','right'];
    this.currentDir = dirs[Math.floor(Math.random() * 4)];
    this.showTime = performance.now();
    this.feedback = null;
  }

  onDirection(dir) {
    if (this.finished || this.feedback) return;
    const rt = performance.now() - this.showTime;
    if (dir === this.currentDir) {
      this.recordResult(true, rt);
      this.feedback = 'correct';
      this.feedbackTime = performance.now();
      Audio.success();
    } else {
      this.recordResult(false, rt);
      this.feedback = 'wrong';
      this.feedbackTime = performance.now();
      Audio.mistake();
    }
  }

  onUpdate(dt) {
    if (this.finished) return;
    const now = performance.now();
    // 反馈后 500ms 进入下一题
    if (this.feedback && now - this.feedbackTime > 500) {
      if (this.totalTrials >= this.targetTrials) {
        { this.totalTrials = 0; this.finish(); return; }
        return;
      }
      this._nextTrial();
    }
    // 超时处理
    if (this.cfg.timeout > 0 && !this.feedback) {
      if (now - this.showTime > this.cfg.timeout) {
        if (this.difficulty >= 3) {
          this.recordResult(false, this.cfg.timeout);
          this.feedback = 'wrong';
          this.feedbackTime = now;
          Audio.mistake();
        }
      }
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    // 背景
    this.drawScrollingBg(ctx);

    // 背景干扰元素
    if (this.cfg.bg === 'grid') {
      ctx.strokeStyle = '#EEE';
      ctx.lineWidth = 1;
      for (let x = 0; x < this.W; x += 30) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.H); ctx.stroke();
      }
      for (let y = 0; y < this.H; y += 30) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.W, y); ctx.stroke();
      }
    } else if (this.cfg.bg === 'dots') {
      ctx.fillStyle = 'rgba(200,200,200,0.3)';
      for (let x = 15; x < this.W; x += 40) {
        for (let y = 15; y < this.H; y += 40) {
          ctx.beginPath(); ctx.arc(x, y, 3, 0, Math.PI*2); ctx.fill();
        }
      }
    } else if (this.cfg.bg === 'noise') {
      for (let i = 0; i < 50; i++) {
        ctx.fillStyle = `rgba(${Math.random()*100+100},${Math.random()*100+100},${Math.random()*100+100},0.15)`;
        ctx.beginPath();
        ctx.arc(Math.random()*this.W, Math.random()*this.H, Math.random()*20+5, 0, Math.PI*2);
        ctx.fill();
      }
    }

    if (!this.currentDir) return;

    const cx = this.W / 2;
    const cy = this.H / 2;
    // E字随进度逐渐变小
    const progress = Math.min(1, this.totalTrials / Math.max(1, this.targetTrials));
    const minSize = Math.max(15, this.cfg.size * 0.35);
    const size = this.cfg.size - (this.cfg.size - minSize) * progress;
    let color = this.cfg.color;

    if (this.feedback === 'correct') color = '#4ADE80';
    if (this.feedback === 'wrong') color = '#FF6B6B';

    // 绘制 E 字
    ctx.save();
    ctx.translate(cx, cy);
    const rotations = { right: 0, down: Math.PI/2, left: Math.PI, up: -Math.PI/2 };
    ctx.rotate(rotations[this.currentDir]);

    const w = size;
    const h = size * 0.8;
    const barH = h / 5;
    const gap = barH;

    ctx.fillStyle = color;
    // 竖线
    ctx.fillRect(-w/2, -h/2, barH, h);
    // 三条横线
    ctx.fillRect(-w/2, -h/2, w, barH);
    ctx.fillRect(-w/2, -h/2 + gap + barH, w * 0.7, barH);
    ctx.fillRect(-w/2, h/2 - barH, w, barH);

    ctx.restore();
  }
}

// ============================================================
// 游戏2：精细注视追踪 PursuitGame
// ============================================================
class PursuitGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.pursuit.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.totalPauses;
    this.x = this.W / 2;
    this.y = this.H / 2;
    this.t = 0;
    this.isPaused = false;
    this.pauseStartTime = 0;
    this.nextPauseTime = Utils.rand(cfg.pauseInterval[0], cfg.pauseInterval[1]);
    this.pauseElapsed = 0;
    this.successCount = 0;
    this.missCount = 0;
    this.flashPhase = 0;
    this.trail = cfg.trail;
    this.setupColorSwitchBg();
    this._genPath();
  }

  _genPath() {
    this.pathSeed = Math.random() * 1000;
  }

  _getPathPos(t) {
    const cx = this.W / 2;
    const cy = this.H / 2;
    const rx = this.W * 0.3;
    const ry = this.H * 0.25;
    switch (this.trail) {
      case 'circle':
        return { x: cx + Math.cos(t * 0.5) * rx, y: cy + Math.sin(t * 0.5) * ry };
      case 'sine':
        return { x: cx + Math.sin(t * 0.4) * rx, y: cy + Math.cos(t * 0.6) * ry * 0.6 };
      case 'lissajous':
        return { x: cx + Math.sin(t * 0.5 + this.pathSeed) * rx, y: cy + Math.sin(t * 0.7) * ry };
      case 'random':
        return { x: cx + Math.sin(t * 0.3 + this.pathSeed) * rx + Math.cos(t * 0.8) * rx * 0.3,
                 y: cy + Math.cos(t * 0.4 + this.pathSeed) * ry + Math.sin(t * 0.9) * ry * 0.3 };
      default:
        return { x: cx + Math.cos(t * 0.5) * rx, y: cy + Math.sin(t * 0.5) * ry };
    }
  }

  onUpdate(dt) {
    if (this.finished) return;
    if (!this.isPaused) {
      this.t += dt * (this.cfg.speed / 100);
      const pos = this._getPathPos(this.t);
      this.x = Utils.clamp(pos.x, this.cfg.targetSize, this.W - this.cfg.targetSize);
      this.y = Utils.clamp(pos.y, this.cfg.targetSize, this.H - this.cfg.targetSize);

      this.nextPauseTime -= dt;
      if (this.nextPauseTime <= 0) {
        this.isPaused = true;
        this.pauseStartTime = performance.now();
        this.pauseElapsed = 0;
      }
    } else {
      this.pauseElapsed = performance.now() - this.pauseStartTime;
      this.flashPhase += dt * 6;
      // 超时
      if (this.pauseElapsed > this.cfg.pauseDur) {
        this.missCount++;
        this.totalTrials++;
        this.callbacks.onProgress(this.getProgress());
        Audio.mistake();
        if (this.totalTrials >= this.targetTrials) { this.finish(); return; }
        this.isPaused = false;
        this.nextPauseTime = Utils.rand(this.cfg.pauseInterval[0], this.cfg.pauseInterval[1]);
        this._genPath();
      }
    }
  }

  onInput(e) {
    if (this.finished || !this.isPaused) return;
    const d = Utils.dist(e.x, e.y, this.x, this.y);
    if (d <= this.cfg.tolerance) {
      const rt = performance.now() - this.pauseStartTime;
      this.recordResult(true, rt);
      this.successCount++;
      Audio.success();
      if (this.totalTrials >= this.targetTrials) { this.finish(); return; }
      this.isPaused = false;
      this.nextPauseTime = Utils.rand(this.cfg.pauseInterval[0], this.cfg.pauseInterval[1]);
      this._genPath();
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);

    const size = this.cfg.targetSize;
    const flashScale = this.isPaused ? 1 + Math.sin(this.flashPhase) * 0.3 : 1;

    // 光环
    if (this.isPaused) {
      ctx.fillStyle = `rgba(255,184,77,${0.2 + Math.sin(this.flashPhase)*0.1})`;
      ctx.beginPath();
      ctx.arc(this.x, this.y, size * 2, 0, Math.PI*2);
      ctx.fill();
    }

    // 星星目标
    this._drawStar(ctx, this.x, this.y, size * flashScale, this.isPaused ? '#FFB84D' : '#FFD700');
  }

  _drawStar(ctx, cx, cy, r, color) {
    ctx.save();
    ctx.translate(cx, cy);
    ctx.fillStyle = color;
    ctx.beginPath();
    for (let i = 0; i < 5; i++) {
      const angle = (i * 4 * Math.PI / 5) - Math.PI / 2;
      const x = Math.cos(angle) * r;
      const y = Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.fill();
    ctx.restore();
  }
}

// ============================================================
// 游戏5：找不同 DiffSpotGame
// ============================================================
class DiffSpotGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.diffspot.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.levels;
    this.currentLevel = 0;
    this.levelStartTime = 0;
    this.wrongClicks = 0;
    this.setupColorSwitchBg();
    this._genLevel();
  }

  _genLevel() {
    const cfg = this.cfg;
    this.elements = [];
    const cols = Math.ceil(Math.sqrt(cfg.elements));
    const rows = Math.ceil(cfg.elements / cols);
    const cellW = this.W / (cols * 2 + 1);
    const cellH = this.H / (rows + 1);
    const elemSize = Math.min(cfg.elemSize, cellW * 0.7, cellH * 0.7);

    for (let i = 0; i < cfg.elements; i++) {
      const col = i % cols;
      const row = Math.floor(i / cols);
      const x = (col + 0.5) * cellW + cellW * 0.5;
      const y = (row + 0.5) * cellH + cellH * 0.5;
      this.elements.push({
        id: i,
        x, y,
        size: elemSize,
        direction: ['up','down','left','right'][Utils.randInt(0,3)],
        color: ['#FF6B6B','#4A9EFF','#FFB84D','#4ADE80','#9B6BFF'][Utils.randInt(0,4)],
        missing: false
      });
    }

    // 右图是左图的副本 + 修改
    this.rightElements = this.elements.map(e => ({...e, x: e.x + this.W / 2}));

    // 随机选 N 个元素制造差异
    const diffIndices = Utils.shuffle([...Array(cfg.elements).keys()]).slice(0, cfg.diffs);
    this.diffs = [];
    diffIndices.forEach(idx => {
      const type = cfg.types[Math.floor(Math.random() * cfg.types.length)];
      const elem = this.rightElements[idx];
      const diff = { index: idx, type, found: false };
      switch(type) {
        case 'direction':
          diff.oldValue = elem.direction;
          const dirs = ['up','down','left','right'].filter(d => d !== elem.direction);
          elem.direction = dirs[Math.floor(Math.random()*3)];
          diff.newValue = elem.direction;
          break;
        case 'size':
          diff.oldValue = elem.size;
          elem.size = elem.size * 0.6;
          diff.newValue = elem.size;
          break;
        case 'color':
          diff.oldValue = elem.color;
          const colors = ['#FF6B6B','#4A9EFF','#FFB84D','#4ADE80','#9B6BFF'].filter(c => c !== elem.color);
          elem.color = colors[Math.floor(Math.random()*4)];
          diff.newValue = elem.color;
          break;
        case 'missing':
          diff.oldValue = 'present';
          elem.missing = true;
          diff.newValue = 'missing';
          break;
      }
      this.diffs.push(diff);
    });

    this.levelStartTime = performance.now();
  }

  onInput(e) {
    if (this.finished) return;
    // 检查是否点中了右图的差异
    let hit = false;
    for (const diff of this.diffs) {
      if (diff.found) continue;
      const elem = this.rightElements[diff.index];
      const hitDist = Utils.dist(e.x, e.y, elem.x, elem.y);
      const hitRadius = Math.max(elem.size * 1.3, elem.size + 15);
      if (elem.missing) {
        // 缺失类型：点击缺失元素应该在的位置
        if (hitDist <= hitRadius) {
          diff.found = true;
          hit = true;
          Audio.success();
          break;
        }
      } else {
        if (hitDist <= hitRadius) {
          diff.found = true;
          hit = true;
          Audio.success();
          break;
        }
      }
    }
    if (!hit) {
      // 检查是否点在右图区域
      if (e.x > this.W / 2) {
        this.wrongClicks++;
        this.recordResult(false, performance.now() - this.levelStartTime);
        Audio.mistake();
      }
    }

    // 检查是否全部找到
    if (this.diffs.every(d => d.found)) {
      const rt = performance.now() - this.levelStartTime;
      this.recordResult(true, rt / this.cfg.diffs);
      this.currentLevel++;
      if (this.currentLevel >= this.cfg.levels) {
        this.finish();
      } else {
        setTimeout(() => this._genLevel(), 500);
      }
    }
  }

  onUpdate(dt) {
    if (this.finished) return;
    // 超时
    if (this.cfg.timeout > 0 && performance.now() - this.levelStartTime > this.cfg.timeout * 1000) {
      this.currentLevel++;
      if (this.currentLevel >= this.cfg.levels) { this.finish(); return; }
      this._genLevel();
    }
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);

    // 分隔线
    ctx.strokeStyle = '#E0E0E0';
    ctx.lineWidth = 2;
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(this.W/2, 0);
    ctx.lineTo(this.W/2, this.H);
    ctx.stroke();
    ctx.setLineDash([]);

    // 标签
    ctx.fillStyle = '#999';
    ctx.font = 'bold 14px sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText('左图', this.W/4, 20);
    ctx.fillText('找不同 →', this.W/2, 20);
    ctx.fillText('右图', this.W*3/4, 20);

    // 绘制左图元素
    this.elements.forEach(e => this._drawElement(ctx, e));
    // 绘制右图元素
    this.rightElements.forEach((e, i) => {
      if (e.missing) {
        // 找到的差异显示标记
        const diff = this.diffs.find(d => d.index === i);
        if (diff && diff.found) {
          ctx.strokeStyle = '#4ADE80';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size * 0.8, 0, Math.PI*2);
          ctx.stroke();
        }
      } else {
        const diff = this.diffs.find(d => d.index === i);
        if (diff && diff.found) {
          ctx.strokeStyle = '#4ADE80';
          ctx.lineWidth = 3;
          ctx.beginPath();
          ctx.arc(e.x, e.y, e.size * 0.8, 0, Math.PI*2);
          ctx.stroke();
        }
        this._drawElement(ctx, e);
      }
    });
  }

  _drawElement(ctx, e) {
    ctx.save();
    ctx.translate(e.x, e.y);
    const rotations = { up: 0, right: Math.PI/2, down: Math.PI, left: -Math.PI/2 };
    ctx.rotate(rotations[e.direction] || 0);
    const s = e.size;
    ctx.fillStyle = e.color;
    const barH = s / 5;
    ctx.fillRect(-s/2, -s*0.4, barH, s*0.8);
    ctx.fillRect(-s/2, -s*0.4, s, barH);
    ctx.fillRect(-s/2, -barH/2, s*0.7, barH);
    ctx.fillRect(-s/2, s*0.4-barH, s, barH);
    ctx.restore();
  }
}

// ============================================================
// 游戏6：拼图 PuzzleGame
// ============================================================
class PuzzleGame extends BaseGame {
  onStart() {
    const cfg = GAME_CONFIGS.puzzle.difficulties[this.difficulty];
    this.cfg = cfg;
    this.targetTrials = cfg.levels;
    this.setupColorSwitchBg();
    this.currentLevel = 0;
    this.attempts = 0;
    this.correctPlacements = 0;
    this.levelStartTime = 0;
    this._genLevel();
  }

  _genLevel() {
    const cfg = this.cfg;
    const [cols, rows] = cfg.grid;
    this.cols = cols;
    this.rows = rows;
    this.totalPieces = cols * rows;

    // 拼图区域（上半部分）
    this.boardX = this.W * 0.1;
    this.boardY = this.H * 0.08;
    this.boardW = this.W * 0.8;
    this.boardH = this.H * 0.45;
    this.pieceW = this.boardW / cols;
    this.pieceH = this.boardH / rows;

    // 零件区域（下半部分）
    this.trayY = this.boardY + this.boardH + 20;

    // 生成拼图颜色图案
    this.colors = [];
    for (let i = 0; i < this.totalPieces; i++) {
      this.colors.push(`hsl(${(360/this.totalPieces)*i}, 70%, 60%)`);
    }

    // 生成拼块
    this.pieces = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        const idx = r * cols + c;
        // 零件区随机排列
        const trayCol = idx % cols;
        const trayRow = Math.floor(idx / cols);
        this.pieces.push({
          id: idx,
          correctX: this.boardX + c * this.pieceW,
          correctY: this.boardY + r * this.pieceH,
          x: this.boardX + trayCol * this.pieceW,
          y: this.trayY + trayRow * (this.pieceH * 0.7),
          placed: false,
          dragging: false,
          color: this.colors[idx]
        });
      }
    }
    // 打乱
    this.pieces = Utils.shuffle(this.pieces);
    // 重新分配零件区位置
    this.pieces.forEach((p, i) => {
      const trayCol = i % cols;
      const trayRow = Math.floor(i / cols);
      p.x = this.boardX + trayCol * this.pieceW;
      p.y = this.trayY + trayRow * (this.pieceH * 0.7);
    });

    this.draggingPiece = null;
    this.dragOffsetX = 0;
    this.dragOffsetY = 0;
    this.levelStartTime = performance.now();
    this.attempts = 0;
    this.correctPlacements = 0;
  }

  onInput(e) {
    if (this.finished) return;
    // pointerdown: 找到点击的拼块
    for (let i = this.pieces.length - 1; i >= 0; i--) {
      const p = this.pieces[i];
      if (p.placed) continue;
      if (e.x >= p.x && e.x <= p.x + this.pieceW && e.y >= p.y && e.y <= p.y + this.pieceH) {
        this.draggingPiece = p;
        this.dragOffsetX = e.x - p.x;
        this.dragOffsetY = e.y - p.y;
        // 移到顶层
        this.pieces.splice(i, 1);
        this.pieces.push(p);
        // 绑定移动
        this._bindDrag();
        Audio.click();
        return;
      }
    }
  }

  _bindDrag() {
    const canvas = document.getElementById('game-canvas');
    this._moveHandler = (e) => {
      if (!this.draggingPiece) return;
      const rect = canvas.getBoundingClientRect();
      this.draggingPiece.x = e.clientX - rect.left - this.dragOffsetX;
      this.draggingPiece.y = e.clientY - rect.top - this.dragOffsetY;
    };
    this._upHandler = () => {
      if (!this.draggingPiece) return;
      // 检查是否放对位置
      const p = this.draggingPiece;
      const d = Utils.dist(p.x, p.y, p.correctX, p.correctY);
      this.attempts++;
      if (d < this.pieceW * 0.3) {
        p.x = p.correctX;
        p.y = p.correctY;
        p.placed = true;
        this.correctPlacements++;
        Audio.success();
        if (this.correctPlacements >= this.totalPieces) {
          const rt = performance.now() - this.levelStartTime;
          this.recordResult(true, rt / this.totalPieces);
          this.currentLevel++;
          if (this.currentLevel >= this.cfg.levels) {
            this.finish();
          } else {
            setTimeout(() => this._genLevel(), 800);
          }
        }
      } else {
        Audio.mistake();
      }
      this.draggingPiece = null;
    };
    canvas.addEventListener('pointermove', this._moveHandler);
    canvas.addEventListener('pointerup', this._upHandler, { once: true });
    canvas.addEventListener('pointercancel', this._upHandler, { once: true });
  }

  onUpdate(dt) {
    if (this.finished) return;
  }

  onRender(ctx) {
    ctx.clearRect(0, 0, this.W, this.H);
    this.drawScrollingBg(ctx);

    // 拼图板背景
    ctx.fillStyle = '#F0F0F0';
    ctx.fillRect(this.boardX, this.boardY, this.boardW, this.boardH);

    // 轮廓提示
    if (this.cfg.hint !== 'none') {
      ctx.globalAlpha = this.cfg.hint === 'full' ? 0.3 : this.cfg.hint === 'half' ? 0.15 : 0.08;
      for (let r = 0; r < this.rows; r++) {
        for (let c = 0; c < this.cols; c++) {
          const idx = r * this.cols + c;
          ctx.fillStyle = this.colors[idx];
          ctx.fillRect(this.boardX + c * this.pieceW, this.boardY + r * this.pieceH, this.pieceW, this.pieceH);
        }
      }
      ctx.globalAlpha = 1;
    }

    // 网格线
    ctx.strokeStyle = '#DDD';
    ctx.lineWidth = 1;
    for (let c = 0; c <= this.cols; c++) {
      ctx.beginPath();
      ctx.moveTo(this.boardX + c * this.pieceW, this.boardY);
      ctx.lineTo(this.boardX + c * this.pieceW, this.boardY + this.boardH);
      ctx.stroke();
    }
    for (let r = 0; r <= this.rows; r++) {
      ctx.beginPath();
      ctx.moveTo(this.boardX, this.boardY + r * this.pieceH);
      ctx.lineTo(this.boardX + this.boardW, this.boardY + r * this.pieceH);
      ctx.stroke();
    }

    // 零件区分隔
    ctx.strokeStyle = '#E0E0E0';
    ctx.setLineDash([5,5]);
    ctx.beginPath();
    ctx.moveTo(0, this.trayY - 10);
    ctx.lineTo(this.W, this.trayY - 10);
    ctx.stroke();
    ctx.setLineDash([]);

    // 绘制拼块
    this.pieces.forEach(p => {
      ctx.fillStyle = p.color;
      const scale = p.placed ? 1 : 0.95;
      ctx.fillRect(p.x, p.y, this.pieceW * scale, this.pieceH * scale);
      // 边框
      ctx.strokeStyle = p === this.draggingPiece ? '#4A9EFF' : 'rgba(255,255,255,0.5)';
      ctx.lineWidth = p === this.draggingPiece ? 3 : 1;
      ctx.strokeRect(p.x, p.y, this.pieceW * scale, this.pieceH * scale);
    });
  }
}

function exportData() {
  const data = Store.exportJSON();
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `弱视训练备份-${Utils.todayStr()}.json`;
  a.click();
  URL.revokeObjectURL(url);
  Store.getState().meta.lastBackupDate = new Date().toISOString();
  Store.save();
  Modal.toast('数据已导出 📤');
}

function importData(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = (e) => {
    try {
      Store.importJSON(e.target.result);
      Modal.toast('数据导入成功 ✅');
      setTimeout(() => Router.navigate('/'), 800);
    } catch(err) {
      Modal.toast('导入失败：文件格式不正确 ❌', 3000);
    }
  };
  reader.readAsText(file);
}

    window.location.href = 'login.html';
    return;
  }
  Store.init();
  Audio.init();
  VoiceFeedback.init();
  Renderer.init(document.getElementById('app'));

  // 恢复遮眼计时器
  if (PatchingTimer._restore()) {
    PatchingTimer._startTick();
  }

  // 注册路由
  Router.register('/',         () => Renderer.render(Renderer.tplHome()));
  Router.register('/today',    () => Renderer.render(Renderer.tplTodayTraining()));
  Router.register('/train',    () => Renderer.render(Renderer.tplTrainingCenter()));
  Router.register('/patch',    () => Renderer.render(Renderer.tplPatchingTimer()));
  Router.register('/stats',    () => {
    Renderer.render(Renderer.tplStats());
    Renderer.renderStatsCharts();
  });
  Router.register('/rewards',  () => Renderer.render(Renderer.tplRewards()));
  Router.register('/settings', () => Renderer.render(Renderer.tplSettings()));

  // 初始化路由（注册 hashchange 监听器 + 首次渲染）
  Router.init();

  // 监听成长树升级
  EventBus.on('treeLevelUp', (data) => {
    const stageName = TREE_STAGES[data.to].name;
    setTimeout(() => {
      Modal.celebration({
        emoji: '🌳',
        title: '成长树升级啦！',
        body: `你的成长树已经成长为「${stageName}」阶段！继续加油！`
      });
      Audio.fanfare();
    }, 500);
  });

  // 监听遮眼计时
  EventBus.on('patchingTick', () => {
    const clock = document.getElementById('patch-clock');
    if (clock) clock.textContent = Utils.fmtMMSS(PatchingTimer.getElapsedSec());
  });

  // 页面可见性变化
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && GameEngine._currentGame) {
      // 游戏暂停（通过停止RAF）
      if (GameEngine._rafId) {
        cancelAnimationFrame(GameEngine._rafId);
        GameEngine._rafId = null;
      }
    } else if (!document.hidden && GameEngine._currentGame && !GameEngine._currentGame.isFinished()) {
      GameEngine._lastTime = performance.now();
      GameEngine._loop(GameEngine._lastTime);
    }
  });

  // 启动：Router.init() 已完成首次渲染，这里处理 hash 跳转和首次引导
  // 如果有 hash 路径（如书签），确保导航到该路径
  if (location.hash && location.hash !== '#/') {
    Router.navigate(location.hash.slice(1));
  }

  // 首次使用引导
  const settings = Store.getSettings();
  if (!settings.childName) {
    setTimeout(() => {
      Modal.show({
        title: '👋 欢迎使用',
        body: '弱视训练小助手帮孩子每天完成训练。先去设置中填写孩子信息吧！',
        actions: [
          { text: '去设置', style: 'bg-primary text-white', onClick: (close) => { close(); Router.navigate('/settings'); } }
        ]
      });
    }, 300);
  }
}
