        color: colors[Math.floor(Math.random() * colors.length)],
        speed: 0.5 + Math.random() * 1.5,
        wobble: Math.random() * Math.PI * 2,
      });
    }

    for (const b of this.bubbles) {
      b.y -= b.speed;
      b.wobble += 0.02;
      b.x += Math.sin(b.wobble) * 0.5;
    }
    this.bubbles = this.bubbles.filter(b => b.y > -40);

    for (const p of this.pops) { p.x += p.vx; p.y += p.vy; p.alpha -= 0.04; }
    this.pops = this.pops.filter(p => p.alpha > 0);
  }

  onDraw() {
    const ctx = this.ctx;
    for (const b of this.bubbles) {
      // 光泽高光
      const grad = ctx.createRadialGradient(b.x - b.radius * 0.3, b.y - b.radius * 0.3, b.radius * 0.1, b.x, b.y, b.radius);
      grad.addColorStop(0, 'rgba(255,255,255,0.6)');
      grad.addColorStop(0.4, b.color);
      grad.addColorStop(1, 'rgba(0,0,0,0.2)');
      ctx.fillStyle = grad;
      ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.beginPath(); ctx.arc(b.x - b.radius * 0.25, b.y - b.radius * 0.3, b.radius * 0.25, 0, Math.PI * 2); ctx.fill();
    }

    for (const p of this.pops) {
      ctx.fillStyle = p.color.replace(')', `,${p.alpha})`).replace('rgb', 'rgba');
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  onStop() {}
}

/**
 * 连连看游戏 - 翻开两张卡片找到匹配的一对
 * 训练记忆力和视觉辨别
 */
class MemoryGame extends BaseGame {
  constructor() {
    super({ id: 'memory', name: '连连看', icon: '🃏', description: '翻开卡片找到一样的', duration: 60 });
  }

  onStart() {
    this.cards = [];
    this.flipped = [];
    this.matched = new Set();
    this.checking = false;
    this.cols = 4;
    this.rows = 3;

    const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒'];
    const pairs = [...emojis, ...emojis].sort(() => Math.random() - 0.5);
    const cardW = 65, cardH = 80;
    const marginX = (this.width - this.cols * (cardW + 8)) / 2;
    const marginY = (this.height - this.rows * (cardH + 8)) / 2 + 20;

    for (let i = 0; i < this.rows * this.cols; i++) {
      const col = i % this.cols;
      const row = Math.floor(i / this.cols);
      this.cards.push({
        x: marginX + col * (cardW + 8),
        y: marginY + row * (cardH + 8),
        w: cardW, h: cardH,
        emoji: pairs[i],
        flipped: false,
        matched: false,
      });
    }

    this.bindTouch('touchstart', (e) => {
      if (this.checking) return;
      const pos = this.getTouchPos(e);
      for (let i = 0; i < this.cards.length; i++) {
        const c = this.cards[i];
        if (c.matched || c.flipped) continue;
        if (pos.x >= c.x && pos.x <= c.x + c.w && pos.y >= c.y && pos.y <= c.y + c.h) {
          c.flipped = true;
          this.flipped.push(i);
          if (this.flipped.length === 2) {
            this.checking = true;
            const [a, b] = this.flipped;
            if (this.cards[a].emoji === this.cards[b].emoji) {
              this.cards[a].matched = true;
              this.cards[b].matched = true;
              this.addScore(2);
              this.flipped = [];
              this.checking = false;
              if (this.matched.size + 2 >= this.cards.length) {
                this.addScore(5);
                setTimeout(() => this._resetBoard(), 600);
              }
            } else {
              setTimeout(() => {
                this.cards[a].flipped = false;
                this.cards[b].flipped = false;
                this.flipped = [];
                this.checking = false;
              }, 600);
            }
          }
          return;
        }
      }
    });
    this.bindInput('mousedown', (e) => {
      if (this.checking) return;
      const pos = this.getTouchPos(e);
      for (let i = 0; i < this.cards.length; i++) {
        const c = this.cards[i];
        if (c.matched || c.flipped) continue;
        if (pos.x >= c.x && pos.x <= c.x + c.w && pos.y >= c.y && pos.y <= c.y + c.h) {
          c.flipped = true;
          this.flipped.push(i);
          if (this.flipped.length === 2) {
            this.checking = true;
            const [a, b] = this.flipped;
            if (this.cards[a].emoji === this.cards[b].emoji) {
              this.cards[a].matched = true;
              this.cards[b].matched = true;
              this.addScore(2);
              this.flipped = [];
              this.checking = false;
              const matchedCount = this.cards.filter(c => c.matched).length;
              if (matchedCount >= this.cards.length) {
                this.addScore(5);
                setTimeout(() => this._resetBoard(), 600);
              }
            } else {
              setTimeout(() => {
                this.cards[a].flipped = false;
                this.cards[b].flipped = false;
                this.flipped = [];
                this.checking = false;
              }, 600);
            }
          }
          return;
        }
      }
    });
  }

  _resetBoard() {
    const emojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🍑', '🥝'];
    const numPairs = Math.min(6, 4 + Math.floor(this.score / 10));
    const selected = emojis.slice(0, numPairs);
    const pairs = [...selected, ...selected].sort(() => Math.random() - 0.5);
    this.cols = numPairs > 4 ? 4 : 3;
    this.rows = Math.ceil(pairs.length / this.cols);
    const cardW = this.cols > 3 ? 65 : 75;
    const cardH = 80;
    const marginX = (this.width - this.cols * (cardW + 8)) / 2;
    const marginY = (this.height - this.rows * (cardH + 8)) / 2 + 20;

    this.cards = [];
    for (let i = 0; i < pairs.length; i++) {
      const col = i % this.cols;
      const row = Math.floor(i / this.cols);
      this.cards.push({
        x: marginX + col * (cardW + 8), y: marginY + row * (cardH + 8),
        w: cardW, h: cardH, emoji: pairs[i], flipped: false, matched: false,
      });
    }
    this.flipped = [];
    this.checking = false;
  }

  onDraw() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('找到一样的图案配对', this.width / 2, 30);

    for (const c of this.cards) {
      if (c.matched) {
        ctx.fillStyle = 'rgba(78,205,196,0.3)';
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 10); ctx.fill();
        ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c.emoji, c.x + c.w / 2, c.y + c.h / 2);
      } else if (c.flipped) {
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 10); ctx.fill();
        ctx.font = '30px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText(c.emoji, c.x + c.w / 2, c.y + c.h / 2);
      } else {
        ctx.fillStyle = '#FF6B6B';
        ctx.beginPath(); ctx.roundRect(c.x, c.y, c.w, c.h, 10); ctx.fill();
        ctx.fillStyle = '#FF9999';
        ctx.font = '24px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        ctx.fillText('?', c.x + c.w / 2, c.y + c.h / 2);
      }
    }
  }

  onStop() {}
}

/**
 * 投篮游戏 - 瞄准篮筐投球
 * 训练空间判断和手眼协调
 */
class BasketGame extends BaseGame {
  constructor() {
    super({ id: 'basket', name: '投篮游戏', icon: '🏀', description: '瞄准篮筐投篮', duration: 60 });
  }

  onStart() {
    this.hoop = { x: this.width / 2, y: this.height * 0.3, w: 70 };
    this.hoopDir = 1;
    this.balls = [];
    this.power = 0;
    this.aiming = false;
    this.aimStart = { x: 0, y: 0 };
    this.shooterX = this.width / 2;
    this.shooterY = this.height - 40;

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this.aiming = true;
      this.aimStart = { x: pos.x, y: pos.y };
      this.power = 0;
    });
    this.bindTouch('touchmove', (e) => {
      if (!this.aiming) return;
      const pos = this.getTouchPos(e);
      this.power = Math.min(1, Math.hypot(pos.x - this.aimStart.x, pos.y - this.aimStart.y) / 150);
    });
    this.bindTouch('touchend', () => {
      if (this.aiming && this.power > 0.1) {
        this._shoot();
      }
      this.aiming = false;
      this.power = 0;
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      this.aiming = true;
      this.aimStart = { x: pos.x, y: pos.y };
      this.power = 0;
    });
    this.bindInput('mousemove', (e) => {
      if (!this.aiming) return;
      const pos = this.getTouchPos(e);
      this.power = Math.min(1, Math.hypot(pos.x - this.aimStart.x, pos.y - this.aimStart.y) / 150);
    });
    this.bindInput('mouseup', () => {
      if (this.aiming && this.power > 0.1) {
        this._shoot();
      }
      this.aiming = false;
      this.power = 0;
    });
  }

  _shoot() {
    const dx = this.hoop.x - this.shooterX;
    const dy = this.hoop.y - this.shooterY;
    const dist = Math.hypot(dx, dy);
    this.balls.push({
      x: this.shooterX, y: this.shooterY,
      vx: (dx / dist) * 10 * this.power,
      vy: (dy / dist) * 10 * this.power - 3,
      scored: false,
    });
  }

  onUpdate() {
    // 篮筐移动
    this.hoop.x += this.hoopDir * 1.2;
    if (this.hoop.x > this.width - 50 || this.hoop.x < 50) this.hoopDir *= -1;

    // 球的物理
    for (const b of this.balls) {
      b.vy += 0.3;
      b.x += b.vx;
      b.y += b.vy;

      if (!b.scored && b.y < this.hoop.y + 20 && b.y > this.hoop.y - 20 &&
          Math.abs(b.x - this.hoop.x) < this.hoop.w / 2) {
        b.scored = true;
        this.addScore(1);
      }
    }
    this.balls = this.balls.filter(b => b.y < this.height + 30);
  }

  onDraw() {
    const ctx = this.ctx;
    // 篮筐
    ctx.strokeStyle = '#FF6B6B'; ctx.lineWidth = 4;
    ctx.beginPath();
    const hx = this.hoop.x;
    ctx.moveTo(hx - this.hoop.w / 2, this.hoop.y);
    ctx.lineTo(hx + this.hoop.w / 2, this.hoop.y);
    ctx.moveTo(hx - this.hoop.w / 2, this.hoop.y);
    ctx.lineTo(hx - this.hoop.w / 2 - 10, this.hoop.y + 30);
    ctx.moveTo(hx + this.hoop.w / 2, this.hoop.y);
    ctx.lineTo(hx + this.hoop.w / 2 + 10, this.hoop.y + 30);
    ctx.stroke();
    // 网
    ctx.strokeStyle = 'rgba(255,255,255,0.3)'; ctx.lineWidth = 1;
    for (let i = 0; i < 5; i++) {
      const sx = hx - this.hoop.w / 2 + (i * this.hoop.w) / 4;
      ctx.beginPath();
      ctx.moveTo(sx, this.hoop.y);
      ctx.lineTo(sx - 5 + i * 2, this.hoop.y + 40);
      ctx.stroke();
    }

    // 球
    for (const b of this.balls) {
      ctx.fillStyle = '#FF9F43';
      ctx.beginPath(); ctx.arc(b.x, b.y, 10, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(b.x - 6, b.y - 6); ctx.lineTo(b.x + 6, b.y + 6); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(b.x + 6, b.y - 6); ctx.lineTo(b.x - 6, b.y + 6); ctx.stroke();
    }

    // 投篮手
    ctx.font = '40px serif'; ctx.textAlign = 'center';
    ctx.fillText('🏀', this.shooterX, this.shooterY);

    // 力量指示器
    if (this.aiming) {
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      ctx.fillRect(this.shooterX - 50, this.shooterY - 30, 100, 15);
      const powerColors = ['#4ECDC4', '#FFE66D', '#FF9F43', '#FF6B6B'];
      const idx = Math.min(3, Math.floor(this.power * 4));
      ctx.fillStyle = powerColors[idx];
      ctx.fillRect(this.shooterX - 50, this.shooterY - 30, 100 * this.power, 15);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '13px sans-serif';
    ctx.fillText('按住屏幕蓄力，松手投篮', this.width / 2, this.height - 15);
  }

  onStop() {}
}

/**
 * 切水果游戏 - 滑动手指切开飞起的水果
 * 训练追踪移动目标
 */
class SlashGame extends BaseGame {
  constructor() {
    super({ id: 'slash', name: '切水果', icon: '🔪', description: '滑动手指切开水果', duration: 60 });
  }

  onStart() {
    this.fruits = [];
    this.slashTrail = [];
    this.spawnTimer = 0;
    this.trailTimer = 0;

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this.slashTrail = [{ x: pos.x, y: pos.y }];
      this.trailTimer = 10;
    });
    this.bindTouch('touchmove', (e) => {
      const pos = this.getTouchPos(e);
      if (this.slashTrail.length > 0) {
        const last = this.slashTrail[this.slashTrail.length - 1];
        this.slashTrail.push({ x: pos.x, y: pos.y });
        // 检测切割
        for (let i = this.fruits.length - 1; i >= 0; i--) {
          const f = this.fruits[i];
          if (Math.hypot(pos.x - f.x, pos.y - f.y) < f.radius + 8 &&
              Math.hypot(last.x - f.x, last.y - f.y) < f.radius + 8) {
            this.addScore(1);
            this.fruits.splice(i, 1);
          }
        }
      }
      this.trailTimer = 10;
    });
    this.bindTouch('touchend', () => { this.trailTimer = 0; });
  }

  onUpdate() {
    this.spawnTimer++;
    if (this.spawnTimer >= 40) {
      this.spawnTimer = 0;
      const fruits = ['🍎', '🍊', '🍋', '🍉', '🍇', '🍓', '🍑', '🥝', '🍌'];
      this.fruits.push({
        x: 20 + Math.random() * (this.width - 40),
        y: this.height + 30,
        radius: 22,
        emoji: fruits[Math.floor(Math.random() * fruits.length)],
        vy: -(5 + Math.random() * 6),
        vx: (Math.random() - 0.5) * 3,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.1,
      });
    }

    for (const f of this.fruits) {
      f.vy += 0.25;
      f.y += f.vy;
      f.x += f.vx;
      f.rotation += f.rotSpeed;
    }
    this.fruits = this.fruits.filter(f => f.y < this.height + 40);

    if (this.trailTimer > 0) this.trailTimer--;
    if (this.trailTimer <= 0 && this.slashTrail.length > 0) {
      this.slashTrail.splice(0, 3);
      if (this.slashTrail.length === 0) this.slashTrail = [];
    }
  }

  onDraw() {
    const ctx = this.ctx;
    // 切割轨迹
    if (this.slashTrail.length > 1) {
      ctx.strokeStyle = 'rgba(255,255,255,0.6)'; ctx.lineWidth = 4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(this.slashTrail[0].x, this.slashTrail[0].y);
      for (let i = 1; i < this.slashTrail.length; i++) {
        ctx.lineTo(this.slashTrail[i].x, this.slashTrail[i].y);
      }
      ctx.stroke();
      // 发光效果
      ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 8;
      ctx.beginPath(); ctx.moveTo(this.slashTrail[0].x, this.slashTrail[0].y);
      for (let i = 1; i < this.slashTrail.length; i++) {
        ctx.lineTo(this.slashTrail[i].x, this.slashTrail[i].y);
      }
      ctx.stroke();
    }

    // 水果
    ctx.font = '34px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const f of this.fruits) {
      ctx.save();
      ctx.translate(f.x, f.y);
      ctx.rotate(f.rotation);
      ctx.fillText(f.emoji, 0, 0);
      ctx.restore();
    }

    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '13px sans-serif';
    ctx.fillText('滑动手指切水果', this.width / 2, this.height - 15);
  }

  onStop() {}
}

/**
 * 拼图游戏 - 拖动碎片到正确位置
 * 训练形状识别和空间推理（简化版适合3岁宝宝）
 */
class PuzzleGame extends BaseGame {
  constructor() {
    super({ id: 'puzzle', name: '拼图游戏', icon: '🧩', description: '把碎片拖到正确位置', duration: 60 });
  }

  onStart() {
    this.pieces = [];
    this.slots = [];
    this.dragging = null;
    this.dragOffset = { x: 0, y: 0 };
    const cols = 2, rows = 2;
    const pieceW = 100, pieceH = 100;
    const marginX = (this.width - cols * (pieceW + 20)) / 2;
    const marginY = (this.height - rows * (pieceH + 20)) / 2 + 30;

    const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A29BFE'];
    const shapes = ['circle', 'star', 'heart', 'square'];

    for (let i = 0; i < rows * cols; i++) {
      const col = i % cols, row = Math.floor(i / cols);
      const sx = marginX + col * (pieceW + 20);
      const sy = marginY + row * (pieceH + 20);
      this.slots.push({ x: sx, y: sy, w: pieceW, h: pieceH, color: colors[i], shape: shapes[i], filled: false });

      this.pieces.push({
        x: 20 + Math.random() * (this.width - pieceW - 40),
        y: this.height - 150 + Math.random() * 80,
        w: pieceW, h: pieceH,
        color: colors[i], shape: shapes[i],
        slotIndex: i, placed: false,
        homeX: 0, homeY: 0,
      });
    }

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      for (let i = this.pieces.length - 1; i >= 0; i--) {
        const p = this.pieces[i];
        if (p.placed) continue;
        if (pos.x >= p.x && pos.x <= p.x + p.w && pos.y >= p.y && pos.y <= p.y + p.h) {
          this.dragging = i;
          this.dragOffset = { x: pos.x - p.x, y: pos.y - p.y };
          return;
        }
      }
    });
    this.bindTouch('touchmove', (e) => {
      if (this.dragging === null) return;
      const pos = this.getTouchPos(e);
      this.pieces[this.dragging].x = pos.x - this.dragOffset.x;
      this.pieces[this.dragging].y = pos.y - this.dragOffset.y;
    });
    this.bindTouch('touchend', () => {
      if (this.dragging !== null) {
        const p = this.pieces[this.dragging];
        const s = this.slots[p.slotIndex];
        if (Math.hypot(p.x + p.w / 2 - (s.x + s.w / 2), p.y + p.h / 2 - (s.y + s.h / 2)) < 50) {
          p.x = s.x; p.y = s.y; p.placed = true; s.filled = true;
          this.addScore(1);
        }
        this.dragging = null;
      }
    });
  }

  onDraw() {
    const ctx = this.ctx;
    ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 18px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('把碎片拖到正确的位置', this.width / 2, 25);

    // 槽位
    for (const s of this.slots) {
      ctx.strokeStyle = s.filled ? s.color : 'rgba(255,255,255,0.3)';
      ctx.lineWidth = 3; ctx.setLineDash([8, 4]);
      ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, 12); ctx.stroke();
      ctx.setLineDash([]);

      if (!s.filled) {
        ctx.fillStyle = 'rgba(255,255,255,0.06)';
        ctx.beginPath(); ctx.roundRect(s.x, s.y, s.w, s.h, 12); ctx.fill();
      }
    }

    // 碎片
    for (const p of this.pieces) {
      if (p.placed) continue;
      ctx.fillStyle = p.color;
      ctx.beginPath(); ctx.roundRect(p.x, p.y, p.w, p.h, 12); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.2)';
      ctx.beginPath(); ctx.roundRect(p.x + 5, p.y + 5, 30, 30, 5); ctx.fill();

      // 形状标记
      ctx.fillStyle = '#fff'; ctx.font = '40px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      let shapeEmoji = '●';
      if (p.shape === 'star') shapeEmoji = '⭐';
      else if (p.shape === 'heart') shapeEmoji = '❤️';
      else if (p.shape === 'square') shapeEmoji = '■';
      ctx.fillText(shapeEmoji, p.x + p.w / 2, p.y + p.h / 2);
    }
  }

  onStop() {}
}

/**
 * 走迷宫游戏 - 用手指引导小动物走出迷宫
 * 训练精细动作和路径规划
 */
class MazeGame extends BaseGame {
  constructor() {
    super({ id: 'maze', name: '走迷宫', icon: '🌀', description: '引导小动物走出迷宫', duration: 60 });
  }

  onStart() {
    this.dot = { x: 40, y: 40, radius: 14 };
    this.goal = { x: this.width - 40, y: this.height - 80, radius: 30 };
    this.trail = [];
    this.walls = [];
    this.level = 1;
    this.touching = false;
    this._generateMaze();

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      if (Math.hypot(pos.x - this.dot.x, pos.y - this.dot.y) < 40) {
        this.touching = true;
      }
    });
    this.bindTouch('touchmove', (e) => {
      if (!this.touching) return;
      const pos = this.getTouchPos(e);
      // 检查碰墙
      let canMove = true;
      for (const w of this.walls) {
        if (pos.x > w.x - 5 && pos.x < w.x + w.w + 5 &&
            pos.y > w.y - 5 && pos.y < w.y + w.h + 5) {
          canMove = false;
          break;
        }
      }
      if (canMove && pos.x > 5 && pos.x < this.width - 5 && pos.y > 5 && pos.y < this.height - 5) {
        this.dot.x = pos.x;
        this.dot.y = pos.y;
        this.trail.push({ x: pos.x, y: pos.y });
        if (this.trail.length > 50) this.trail.shift();
      }

      // 到达目标
      if (Math.hypot(this.dot.x - this.goal.x, this.dot.y - this.goal.y) < this.goal.radius) {
        this.addScore(this.level * 5);
        this.level++;
        this._generateMaze();
      }
    });
    this.bindTouch('touchend', () => { this.touching = false; });
  }

  _generateMaze() {
    this.dot.x = 40; this.dot.y = 40;
    this.goal.x = this.width - 40;
    this.goal.y = this.height - 80;
    this.trail = [];
    this.walls = [];

    const numWalls = 10 + this.level * 2;
    const wallW = 20 + Math.random() * 20;
    for (let i = 0; i < numWalls; i++) {
      const horiz = Math.random() < 0.5;
      this.walls.push({
        x: 30 + Math.random() * (this.width - 150),
        y: 30 + Math.random() * (this.height - 150),
        w: horiz ? 80 + Math.random() * 100 : wallW,
        h: horiz ? wallW : 80 + Math.random() * 100,
      });
    }
    // 保证起点和终点不被遮挡
    this.walls = this.walls.filter(w =>
      !(w.x < 80 && w.y < 80) &&
      !(w.x + w.w > this.width - 80 && w.y + w.h > this.height - 120)
    );
  }

  onDraw() {
    const ctx = this.ctx;

    // 墙壁
    ctx.fillStyle = 'rgba(255,255,255,0.25)';
    for (const w of this.walls) {
      ctx.beginPath(); ctx.roundRect(w.x, w.y, w.w, w.h, 8); ctx.fill();
    }

    // 轨迹
    if (this.trail.length > 1) {
      ctx.strokeStyle = 'rgba(78,205,196,0.4)'; ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(this.trail[0].x, this.trail[0].y);
      for (let i = 1; i < this.trail.length; i++) {
        ctx.lineTo(this.trail[i].x, this.trail[i].y);
      }
      ctx.stroke();
    }

    // 终点
    const pulse = Math.sin(this.frameCount * 0.05) * 5;
    ctx.fillStyle = 'rgba(78,205,196,0.3)';
    ctx.beginPath(); ctx.arc(this.goal.x, this.goal.y, this.goal.radius + pulse, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#4ECDC4';
    ctx.beginPath(); ctx.arc(this.goal.x, this.goal.y, this.goal.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.font = '28px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText('🏠', this.goal.x, this.goal.y);

    // 小动物
    ctx.fillStyle = '#FF6B6B';
    ctx.beginPath(); ctx.arc(this.dot.x, this.dot.y, this.dot.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(this.dot.x - 3, this.dot.y - 3, 3, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(this.dot.x + 3, this.dot.y - 3, 3, 0, Math.PI * 2); ctx.fill();

    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '14px sans-serif';
    ctx.fillText(`第${this.level}关 | 拖动小动物回家`, this.width / 2, 20);
  }

  onStop() {}
}

/**
 * 涂色游戏 - 点击区域填充颜色
 * 训练颜色识别和精细动作
 */
class ColoringGame extends BaseGame {
  constructor() {
    super({ id: 'coloring', name: '涂色游戏', icon: '🎨', description: '点击区域来涂色', duration: 60 });
  }

  onStart() {
    this.colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#A29BFE', '#FD79A8', '#FF9F43', '#55E6C1', '#F8B739'];
    this.selectedColor = 0;
    this.drawings = [];
    this._generateDrawing();

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      // 检查颜色选择器
      if (pos.y > this.height - 55) {
        const idx = Math.floor(pos.x / (this.width / this.colors.length));
        if (idx >= 0 && idx < this.colors.length) {
          this.selectedColor = idx;
          return;
        }
      }
      // 涂色
      for (const d of this.drawings) {
        if (pos.x >= d.x && pos.x <= d.x + d.w && pos.y >= d.y && pos.y <= d.y + d.h) {
          if (d.color !== this.colors[this.selectedColor]) {
            d.color = this.colors[this.selectedColor];
            this.addScore(1);
          }
          return;
        }
      }
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      if (pos.y > this.height - 55) {
        const idx = Math.floor(pos.x / (this.width / this.colors.length));
        if (idx >= 0 && idx < this.colors.length) {
          this.selectedColor = idx;
          return;
        }
      }
      for (const d of this.drawings) {
        if (pos.x >= d.x && pos.x <= d.x + d.w && pos.y >= d.y && pos.y <= d.y + d.h) {
          if (d.color !== this.colors[this.selectedColor]) {
            d.color = this.colors[this.selectedColor];
            this.addScore(1);
          }
          return;
        }
      }
    });
  }

  _generateDrawing() {
    this.drawings = [];
    // 生成一个简单图案的区块（房子、树、太阳等）
    const cx = this.width / 2;
    const cy = this.height / 2 - 20;

    // 太阳
    this.drawings.push({ x: this.width - 80, y: 40, w: 60, h: 60, color: null });
    // 房子主体
    this.drawings.push({ x: cx - 60, y: cy - 20, w: 120, h: 100, color: null });
    // 屋顶
    this.drawings.push({ x: cx - 10, y: cy - 70, w: 90, h: 55, color: null });
    // 门
    this.drawings.push({ x: cx - 15, y: cy + 30, w: 30, h: 50, color: null });
    // 窗户
    this.drawings.push({ x: cx - 45, y: cy + 5, w: 25, h: 25, color: null });
    this.drawings.push({ x: cx + 20, y: cy + 5, w: 25, h: 25, color: null });
    // 树
    this.drawings.push({ x: 30, y: cy - 20, w: 50, h: 70, color: null });
    this.drawings.push({ x: 55, y: cy - 60, w: 60, h: 55, color: null });
    // 地面
    this.drawings.push({ x: 0, y: cy + 80, w: this.width, h: this.height - cy - 80, color: null });
    // 云
    this.drawings.push({ x: 60, y: 20, w: 70, h: 40, color: null });
  }

  onDraw() {
    const ctx = this.ctx;

    // 图画区域
    for (const d of this.drawings) {
      ctx.fillStyle = d.color || 'rgba(255,255,255,0.08)';
      ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 6); ctx.fill();
      if (!d.color) {
        ctx.strokeStyle = 'rgba(255,255,255,0.2)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.roundRect(d.x, d.y, d.w, d.h, 6); ctx.stroke();
      }
    }

    // 图标提示
    ctx.fillStyle = '#fff'; ctx.font = 'bold 16px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('给图画涂上好看的颜色吧！', this.width / 2, this.height - 85);

    // 颜色选择器
    const pickerH = 50;
    const pickerY = this.height - pickerH;
    const cellW = this.width / this.colors.length;
    for (let i = 0; i < this.colors.length; i++) {
      ctx.fillStyle = this.colors[i];
      ctx.fillRect(i * cellW + 2, pickerY + 2, cellW - 4, pickerH - 4);
      if (i === this.selectedColor) {
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 4;
        ctx.beginPath(); ctx.roundRect(i * cellW + 1, pickerY + 1, cellW - 2, pickerH - 2, 8); ctx.stroke();
      }
    }
  }

  onStop() {}
}

/**
 * 主应用控制器
 * 管理页面切换、游戏生命周期、统计数据
 */
const App = {
  // 游戏注册表
  games: [],

  // 当前游戏实例
  currentGame: null,

  // DOM元素
  homePage: null,
  gamePage: null,
  statsPage: null,
  gameGrid: null,
  gameCanvas: null,
  gameTitle: null,
  gameScore: null,
  gameOverOverlay: null,
  gameOverScore: null,
  gameOverBest: null,

  init() {
    // 注册所有游戏
    this.games = [
      new BounceGame(),
      new SnakeGame(),
      new RacingGame(),
      new TankGame(),
      new RopeGame(),
      new FruitGame(),
      new SpotDiffGame(),
      new FindItGame(),
      new EChartGame(),
      new VirusGame(),
      new WhackGame(),
      new BubbleGame(),
      new MemoryGame(),
      new BasketGame(),
      new SlashGame(),
      new PuzzleGame(),
      new MazeGame(),
      new ColoringGame(),
    ];

    // 缓存DOM
    this.homePage = document.getElementById('home-page');
    this.gamePage = document.getElementById('game-page');
    this.statsPage = document.getElementById('stats-page');
    this.gameGrid = document.getElementById('game-grid');
    this.gameCanvas = document.getElementById('game-canvas');
    this.gameTitle = document.getElementById('game-title');
    this.gameScore = document.getElementById('game-score');
    this.gameOverOverlay = document.getElementById('game-over-overlay');
    this.gameOverScore = document.getElementById('game-over-score');
    this.gameOverBest = document.getElementById('game-over-best');

    // 渲染游戏卡片
    this.renderGameGrid();

    // 绑定事件
    document.getElementById('btn-stats').addEventListener('click', () => this.showStats());
    document.getElementById('btn-back-stats').addEventListener('click', () => this.showHome());
    document.getElementById('btn-back-game').addEventListener('click', () => this.exitGame());
    document.getElementById('btn-replay').addEventListener('click', () => this.replayGame());
    document.getElementById('btn-home').addEventListener('click', () => this.exitGame());
  },

  /** 渲染游戏选择网格 */
  renderGameGrid() {
    this.gameGrid.innerHTML = '';
    this.games.forEach((game, index) => {
      const card = document.createElement('div');
      card.className = 'game-card';
      card.innerHTML = `
        <div class="game-card-icon">${game.icon}</div>
        <div class="game-card-name">${game.name}</div>
        <div class="game-card-desc">${game.description}</div>
      `;
      card.addEventListener('click', () => this.startGame(index));
      this.gameGrid.appendChild(card);
    });
  },

  /** 开始游戏 */
  startGame(index) {
    const game = this.games[index];
    this.currentGame = game;

    // 切换页面
    this.homePage.classList.remove('active');
    this.gamePage.classList.add('active');

    // 更新UI
    this.gameTitle.textContent = game.name;
    this.gameScore.textContent = '得分: 0';

    // 设置游戏回调
    game.onScoreChange = (score) => {
      this.gameScore.textContent = `得分: ${score}`;
    };
    game.onTimeChange = (time) => {
      // 时间通过得分区域附近的颜色变化提醒
      if (time <= 10) {
        this.gameScore.style.color = '#FF6B6B';
      }
    };
    game.onGameOver = (result) => {
      this.showGameOver(result);
    };

    // 启动游戏
    game.start();
  },

  /** 显示游戏结束界面 */
  showGameOver(result) {
    // 记录训练数据
    StatsManager.record(result.gameId, result.gameName, result.score, result.duration);

    // 获取最高分
    const allRecords = StatsManager.getAll()
      .filter(r => r.gameId === result.gameId);
    const bestScore = allRecords.length > 0
      ? Math.max(...allRecords.map(r => r.score))
      : result.score;

    this.gameOverScore.textContent = `得分: ${result.score}`;
    this.gameOverBest.textContent = `最高分: ${bestScore}`;
    this.gameOverOverlay.classList.add('active');
  },

  /** 重玩游戏 */
  replayGame() {
    this.gameOverOverlay.classList.remove('active');
    this.gameScore.style.color = '#FFE66D';
    if (this.currentGame) {
      this.currentGame.stop();
      this.currentGame.start();
    }
  },

  /** 退出游戏 */
  exitGame() {
    this.gameOverOverlay.classList.remove('active');
    this.gameScore.style.color = '#FFE66D';
    if (this.currentGame) {
      this.currentGame.stop();
      this.currentGame = null;
    }
    this.gamePage.classList.remove('active');
    this.homePage.classList.add('active');
  },

  /** 显示统计页面 */
  showStats() {
    this.homePage.classList.remove('active');
    this.statsPage.classList.add('active');
    this.renderStats();
  },

  /** 显示主页 */
  showHome() {
    this.statsPage.classList.remove('active');
    this.homePage.classList.add('active');
  },

  /** 渲染统计数据 */
  renderStats() {
    const summary = StatsManager.getSummary();
    const dailyData = StatsManager.getDailyDuration(7);
    const allRecords = StatsManager.getAll().reverse().slice(0, 20);

    // 汇总卡片
    document.getElementById('stats-summary').innerHTML = `
      <div class="stat-card">
        <div class="stat-card-value">${Math.round(summary.todayDuration / 60)}</div>
        <div class="stat-card-label">今日训练(分钟)</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${summary.todayGames}</div>
        <div class="stat-card-label">今日游戏次数</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${summary.streak}</div>
        <div class="stat-card-label">连续训练(天)</div>
      </div>
      <div class="stat-card">
        <div class="stat-card-value">${Math.round(summary.totalDuration / 60)}</div>
        <div class="stat-card-label">累计训练(分钟)</div>
      </div>
    `;

    // 简易图表（柱状图）
    this._renderChart(dailyData);

    // 最近记录
    const listEl = document.getElementById('stats-list');
    if (allRecords.length === 0) {
      listEl.innerHTML = '<p style="text-align:center;color:rgba(255,255,255,0.4);padding:20px;">还没有训练记录，快去玩游戏吧！</p>';
    } else {
      listEl.innerHTML = allRecords.map(r => {
        const date = new Date(r.date);
        const dateStr = `${date.getMonth() + 1}/${date.getDate()} ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        return `
          <div class="stats-item">
            <div>
              <div class="stats-item-game">${r.gameName}</div>
              <div class="stats-item-info">${dateStr} · ${Math.round(r.duration / 60 * 10) / 10}分钟</div>
            </div>
            <div class="stats-item-score">${r.score}分</div>
          </div>
        `;
      }).join('');
    }
  },

  /** 绘制简易统计图 */
  _renderChart(dailyData) {
    const canvas = document.getElementById('stats-chart');
    if (!canvas) return;
    const container = canvas.parentElement;
    canvas.width = container.clientWidth * window.devicePixelRatio;
    canvas.height = 160 * window.devicePixelRatio;
    canvas.style.width = container.clientWidth + 'px';
    canvas.style.height = '160px';

    const ctx = canvas.getContext('2d');
    ctx.setTransform(1, 0, 0, 1, 0, 0);
    ctx.scale(window.devicePixelRatio, window.devicePixelRatio);

    const w = container.clientWidth;
    const h = 160;
    const padding = { top: 20, right: 16, bottom: 30, left: 40 };
    const chartW = w - padding.left - padding.right;
    const chartH = h - padding.top - padding.bottom;

    ctx.clearRect(0, 0, w, h);

    // 背景网格
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= 4; i++) {
      const y = padding.top + (chartH / 4) * i;
      ctx.beginPath();
      ctx.moveTo(padding.left, y);
      ctx.lineTo(w - padding.right, y);
      ctx.stroke();
    }

    const maxVal = Math.max(...dailyData.map(d => d.minutes), 1);

    // Y轴标签
    ctx.fillStyle = 'rgba(255,255,255,0.4)';
    ctx.font = '10px sans-serif';
    ctx.textAlign = 'right';
    for (let i = 0; i <= 4; i++) {
      const val = Math.round(maxVal * (4 - i) / 4);
      const y = padding.top + (chartH / 4) * i;
      ctx.fillText(`${val}min`, padding.left - 6, y + 4);
    }

    // X轴标签
    ctx.textAlign = 'center';
    const barWidth = chartW / dailyData.length - 6;

    dailyData.forEach((d, i) => {
      const x = padding.left + (chartW / dailyData.length) * i + (chartW / dailyData.length) / 2;
      const barH = maxVal > 0 ? (d.minutes / maxVal) * chartH : 0;

      // 柱状图
      const gradient = ctx.createLinearGradient(0, padding.top + chartH - barH, 0, padding.top + chartH);
      gradient.addColorStop(0, '#4ECDC4');
      gradient.addColorStop(1, 'rgba(78, 205, 196, 0.3)');
      ctx.fillStyle = gradient;
      ctx.beginPath();
      ctx.roundRect(x - barWidth / 2, padding.top + chartH - barH, barWidth, barH, [4, 4, 0, 0]);
      ctx.fill();

      // 日期标签
      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.font = '9px sans-serif';
      ctx.fillText(d.date, x, h - 8);

      // 数值
      if (d.minutes > 0) {
        ctx.fillStyle = 'rgba(255,255,255,0.7)';
        ctx.font = '9px sans-serif';
        ctx.fillText(d.minutes, x, padding.top + chartH - barH - 6);
      }
    });

    // 坐标轴
    ctx.strokeStyle = 'rgba(255,255,255,0.15)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(padding.left, padding.top);
    ctx.lineTo(padding.left, padding.top + chartH);
    ctx.lineTo(w - padding.right, padding.top + chartH);
    ctx.stroke();
  },
};

// 启动应用
document.addEventListener('DOMContentLoaded', () => App.init());

</script>
