<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>弱视训练游戏 - 宝宝爱眼</title>
<style>
/* ===== 全局样式 ===== */
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-user-select: none;
  user-select: none;
}

:root {
  --primary: #FF6B6B;
  --primary-dark: #EE5A5A;
  --secondary: #4ECDC4;
  --accent: #FFE66D;
  --bg: #1a1a2e;
  --card-bg: rgba(255, 255, 255, 0.12);
  --text: #ffffff;
  --text-secondary: rgba(255, 255, 255, 0.8);
  --radius: 16px;
  --shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
  background: #1a1a2e;
  color: var(--text);
  touch-action: manipulation;
}

/* ===== 条纹背景 ===== */
#stripe-bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

/* ===== 页面切换 ===== */
.page {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  z-index: 1;
  display: none;
  flex-direction: column;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}
.page.active {
  display: flex;
}

/* ===== 主页 ===== */
#home-page {
  padding: env(safe-area-inset-top, 20px) 20px env(safe-area-inset-bottom, 20px);
  align-items: center;
}

.home-header {
  text-align: center;
  padding: 30px 0 20px;
  z-index: 1;
}

.title {
  font-size: clamp(24px, 5vw, 36px);
  font-weight: 800;
  color: #fff;
  text-shadow: 0 2px 10px rgba(255, 107, 107, 0.5);
  margin-bottom: 8px;
}

.subtitle {
  font-size: clamp(14px, 3vw, 18px);
  color: var(--text-secondary);
}

.game-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
  width: 100%;
  max-width: 700px;
  padding: 10px 10px 90px;
  z-index: 1;
}

@media (min-width: 600px) {
  .game-grid {
    grid-template-columns: repeat(3, 1fr);
    gap: 14px;
  }
}

@media (min-width: 900px) {
  .game-grid {
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
  }
}

.game-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 16px 12px;
  text-align: center;
  cursor: pointer;
  transition: transform 0.15s, background 0.15s;
  border: 2px solid rgba(255, 255, 255, 0.15);
  aspect-ratio: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: 8px;
}

.game-card:active {
  transform: scale(0.95);
  background: rgba(255, 255, 255, 0.2);
}

.game-card-icon {
  font-size: clamp(32px, 7vw, 44px);
  line-height: 1;
}

.game-card-name {
  font-size: clamp(12px, 2.5vw, 14px);
  font-weight: 700;
  color: #fff;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 100%;
}

.game-card-desc {
  font-size: clamp(9px, 1.8vw, 11px);
  color: var(--text-secondary);
}

.home-footer {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  padding: 12px 20px env(safe-area-inset-bottom, 12px);
  text-align: center;
  z-index: 2;
  background: linear-gradient(transparent, rgba(26, 26, 46, 0.95) 30%);
}

.btn-stats {
  background: rgba(255, 255, 255, 0.15);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border: 1px solid rgba(255, 255, 255, 0.2);
  color: #fff;
  padding: 12px 32px;
  border-radius: 30px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-stats:active {
  background: rgba(255, 255, 255, 0.25);
}

/* ===== 游戏页面通用 ===== */
.game-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  padding-top: env(safe-area-inset-top, 10px);
  background: rgba(0, 0, 0, 0.5);
  z-index: 2;
  min-height: 50px;
}

.btn-back {
  background: rgba(255, 255, 255, 0.2);
  border: none;
  color: #fff;
  padding: 8px 16px;
  border-radius: 20px;
  font-size: 14px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-back:active {
  background: rgba(255, 255, 255, 0.35);
}

.game-title {
  font-size: 18px;
  font-weight: 700;
}

.game-score {
  font-size: 16px;
  font-weight: 700;
  color: var(--accent);
  min-width: 80px;
  text-align: right;
}

.game-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

#game-canvas {
  display: block;
  max-width: 100%;
  max-height: 100%;
  touch-action: none;
}

/* ===== 游戏结束弹窗 ===== */
.game-over-overlay {
  display: none;
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.7);
  z-index: 10;
  justify-content: center;
  align-items: center;
}

.game-over-overlay.active {
  display: flex;
}

.game-over-card {
  background: linear-gradient(135deg, #2d2d5e, #1a1a2e);
  border-radius: 24px;
  padding: 40px 32px;
  text-align: center;
  max-width: 340px;
  width: 90%;
  border: 2px solid rgba(255, 255, 255, 0.2);
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
}

.game-over-title {
  font-size: 32px;
  margin-bottom: 12px;
}

.game-over-score {
  font-size: 24px;
  font-weight: 700;
  color: var(--accent);
  margin-bottom: 4px;
}

.game-over-best {
  font-size: 14px;
  color: var(--text-secondary);
  margin-bottom: 24px;
}

.game-over-buttons {
  display: flex;
  gap: 12px;
  justify-content: center;
}

.btn-primary, .btn-secondary {
  padding: 12px 24px;
  border-radius: 25px;
  font-size: 16px;
  font-weight: 700;
  cursor: pointer;
  border: none;
  transition: transform 0.1s, opacity 0.1s;
}

.btn-primary {
  background: var(--primary);
  color: #fff;
}

.btn-secondary {
  background: rgba(255, 255, 255, 0.15);
  color: #fff;
}

.btn-primary:active, .btn-secondary:active {
  transform: scale(0.95);
  opacity: 0.8;
}

/* ===== 统计页面 ===== */
.page-header {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 10px 16px;
  padding-top: env(safe-area-inset-top, 10px);
  background: rgba(0, 0, 0, 0.5);
  min-height: 50px;
}

.page-header h2 {
  font-size: 20px;
  font-weight: 700;
}

.stats-content {
  flex: 1;
  padding: 20px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.stats-summary {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  margin-bottom: 20px;
}

.stat-card {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 16px;
  text-align: center;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.stat-card-value {
  font-size: 28px;
  font-weight: 800;
  color: var(--accent);
}

.stat-card-label {
  font-size: 12px;
  color: var(--text-secondary);
  margin-top: 4px;
}

.stats-chart-container {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 20px;
  border: 1px solid rgba(255, 255, 255, 0.15);
}

.stats-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.stats-item {
  background: var(--card-bg);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  padding: 12px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.stats-item-game {
  font-weight: 600;
}

.stats-item-info {
  font-size: 12px;
  color: var(--text-secondary);
}

.stats-item-score {
  font-weight: 700;
  color: var(--accent);
}

/* ===== 游戏内指令提示 ===== */
.game-hint {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background: rgba(0, 0, 0, 0.7);
  color: #fff;
  padding: 16px 24px;
  border-radius: 20px;
  font-size: 18px;
  font-weight: 600;
  pointer-events: none;
  z-index: 5;
  animation: hintPulse 1.5s ease-in-out infinite;
}

@keyframes hintPulse {
  0%, 100% { opacity: 0.7; }
  50% { opacity: 1; }
}

/* ===== 倒计时 ===== */
.countdown {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 80px;
  font-weight: 900;
  color: #fff;
  text-shadow: 0 0 40px rgba(255, 107, 107, 0.8);
  z-index: 6;
  pointer-events: none;
  animation: countPop 0.5s ease-out;
}

@keyframes countPop {
  0% { transform: translate(-50%, -50%) scale(2); opacity: 0; }
  50% { opacity: 1; }
  100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
}

</style>

<script>
/**
 * 弱视训练背景系统
 * - 双层背景：全局条纹层 + 游戏内动态背景
 * - 游戏内背景周期性切换：条纹、纯色、棋盘格等
 * - 高对比度刺激视觉皮层
 */
class StripeBackground {
  constructor() {
    this.canvas = document.getElementById('stripe-bg');
    this.ctx = this.canvas.getContext('2d');
    this.offset = 0;
    this.speed = 0.8;
    this.stripeWidth = 30;
    this.contrast = 0.35;
    this.direction = 'vertical';
    this.color1 = '#000000';
    this.color2 = '#ffffff';
    this.running = true;
    this.timer = null;
    this.cycleColors = false;
    this.colorPhase = 0;
    this.frameCount = 0;

    this.resize();
    window.addEventListener('resize', () => this.resize());
  }

  resize() {
    this.canvas.width = window.innerWidth * window.devicePixelRatio;
    this.canvas.height = window.innerHeight * window.devicePixelRatio;
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
    this.width = window.innerWidth;
    this.height = window.innerHeight;
  }

  start() {
    this.running = true;
    this.loop();
  }

  stop() {
    this.running = false;
    if (this.timer) {
      cancelAnimationFrame(this.timer);
      this.timer = null;
    }
  }

  setIntensity(level) {
    this.speed = 0.3 + level * 0.3;
    this.contrast = 0.15 + level * 0.08;
    this.stripeWidth = 40 - level * 4;
  }

  loop() {
    if (!this.running) return;
    this.frameCount++;

    const ctx = this.ctx;
    const w = this.width;
    const h = this.height;
    const sw = this.stripeWidth;

    // 周期性切换条纹颜色
    if (this.cycleColors && this.frameCount % 300 === 0) {
      this.colorPhase = (this.colorPhase + 1) % 3;
      switch (this.colorPhase) {
        case 0: this.color1 = '#000000'; this.color2 = '#ffffff'; break;
        case 1: this.color1 = '#FF0000'; this.color2 = '#000000'; break;
        case 2: this.color1 = '#0000FF'; this.color2 = '#FFFF00'; break;
      }
    }

    // 每3秒切换条纹方向
    if (this.frameCount % 180 === 0) {
      this.direction = this.direction === 'vertical' ? 'horizontal' : 'vertical';
    }

    ctx.clearRect(0, 0, w, h);

    if (this.direction === 'vertical') {
      this.offset = (this.offset + this.speed) % (sw * 2);
      let x = -this.offset;
      while (x < w) {
        ctx.fillStyle = this.color1;
        ctx.fillRect(x, 0, sw, h);
        x += sw;
        ctx.fillStyle = this.color2;
        ctx.fillRect(x, 0, sw, h);
        x += sw;
      }
    } else {
      this.offset = (this.offset + this.speed) % (sw * 2);
      let y = -this.offset;
      while (y < h) {
        ctx.fillStyle = this.color1;
        ctx.fillRect(0, y, w, sw);
        y += sw;
        ctx.fillStyle = this.color2;
        ctx.fillRect(0, y, w, sw);
        y += sw;
      }
    }

    ctx.fillStyle = `rgba(26, 26, 46, ${1 - this.contrast})`;
    ctx.fillRect(0, 0, w, h);

    this.timer = requestAnimationFrame(() => this.loop());
  }
}

/**
 * 游戏内动态背景
 * 在每个游戏的画布中渲染，周期性切换背景类型
 */
const GameBackground = {
  // 背景类型列表
  types: [
    'stripes_v',      // 黑白竖条纹
    'stripes_h',      // 黑白横条纹
    'solid_red',      // 红色背景
    'solid_green',    // 绿色背景
    'solid_blue',     // 蓝色背景
    'checkerboard',   // 棋盘格
    'stripes_v_red',  // 红黑竖条纹
    'stripes_h_blue', // 蓝白横条纹
    'gradient_warm',  // 暖色渐变
    'dots',           // 点阵
  ],

  // 当前类型索引
  _currentIndex: -1,
  // 切换计时器
  _switchTimer: 0,
  // 切换间隔（帧数，60fps = 约3-5秒）
  _switchInterval: 200,
  // 条纹偏移（用于滚动动画）
  _stripeOffset: 0,
  // 当前背景色
  _currentColor: null,

  /**
   * 获取下一个背景类型
   * 不随机，按顺序循环确保多样性
   */
  next() {
    this._currentIndex = (this._currentIndex + 1) % this.types.length;
    this._stripeOffset = 0;
    return this.types[this._currentIndex];
  },

  /** 重置状态 */
  reset() {
    this._currentIndex = -1;
    this._switchTimer = 0;
    this._stripeOffset = 0;
    this._currentColor = null;
  },

  /**
   * 在游戏画布上绘制动态背景
   * @param {CanvasRenderingContext2D} ctx
   * @param {number} width - 画布宽度
   * @param {number} height - 画布高度
   * @param {number} frameCount - 当前帧计数
   */
  draw(ctx, width, height, frameCount) {
    // 检查是否需要切换背景类型
    if (this._switchTimer === 0 || frameCount - this._switchTimer > this._switchInterval) {
      this.next();
      this._switchTimer = frameCount;
      // 随机切换间隔（180-300帧 = 3-5秒）
      this._switchInterval = 180 + Math.floor(Math.random() * 120);
    }

    this._stripeOffset += 1.5;
    const type = this.types[this._currentIndex];
    const offset = this._stripeOffset;

    switch (type) {
      case 'stripes_v':
        this._drawStripes(ctx, width, height, offset, 'v', '#000000', '#ffffff');
        break;
      case 'stripes_h':
        this._drawStripes(ctx, width, height, offset, 'h', '#000000', '#ffffff');
        break;
      case 'solid_red':
        ctx.fillStyle = '#CC0000';
        ctx.fillRect(0, 0, width, height);
        break;
      case 'solid_green':
        ctx.fillStyle = '#009933';
        ctx.fillRect(0, 0, width, height);
        break;
      case 'solid_blue':
        ctx.fillStyle = '#0033CC';
        ctx.fillRect(0, 0, width, height);
        break;
      case 'checkerboard':
        this._drawCheckerboard(ctx, width, height, offset);
        break;
      case 'stripes_v_red':
        this._drawStripes(ctx, width, height, offset, 'v', '#CC0000', '#000000');
        break;
      case 'stripes_h_blue':
        this._drawStripes(ctx, width, height, offset, 'h', '#0033CC', '#ffffff');
        break;
      case 'gradient_warm':
        this._drawGradient(ctx, width, height, frameCount);
        break;
      case 'dots':
        this._drawDots(ctx, width, height, offset);
        break;
    }
  },

  _drawStripes(ctx, w, h, offset, dir, c1, c2) {
    const sw = 28;
    if (dir === 'v') {
      const off = offset % (sw * 2);
      let x = -off;
      while (x < w) {
        ctx.fillStyle = c1;
        ctx.fillRect(x, 0, sw, h);
        x += sw;
        ctx.fillStyle = c2;
        ctx.fillRect(x, 0, sw, h);
        x += sw;
      }
    } else {
      const off = offset % (sw * 2);
      let y = -off;
      while (y < h) {
        ctx.fillStyle = c1;
        ctx.fillRect(0, y, w, sw);
        y += sw;
        ctx.fillStyle = c2;
        ctx.fillRect(0, y, w, sw);
        y += sw;
      }
    }
  },

  _drawCheckerboard(ctx, w, h, offset) {
    const size = 30;
    const off = offset % (size * 2);
    for (let y = -off; y < h + size; y += size) {
      for (let x = -off; x < w + size; x += size) {
        const cx = Math.floor((x + off) / size);
        const cy = Math.floor((y + off) / size);
        ctx.fillStyle = (cx + cy) % 2 === 0 ? '#000000' : '#ffffff';
        ctx.fillRect(x, y, size, size);
      }
    }
  },

  _drawGradient(ctx, w, h, frameCount) {
    const hue = (frameCount * 0.5) % 360;
    const grad = ctx.createLinearGradient(0, 0, w, h);
    grad.addColorStop(0, `hsl(${hue}, 80%, 30%)`);
    grad.addColorStop(0.5, `hsl(${(hue + 60) % 360}, 80%, 20%)`);
    grad.addColorStop(1, `hsl(${(hue + 120) % 360}, 80%, 30%)`);
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, w, h);
  },

  _drawDots(ctx, w, h, offset) {
    const spacing = 25;
    const off = offset % spacing;
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, w, h);
    ctx.fillStyle = '#ffffff';
    for (let y = -off; y < h + spacing; y += spacing) {
      for (let x = -off; x < w + spacing; x += spacing) {
        ctx.beginPath();
        ctx.arc(x, y, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }
  },
};

// 全局实例
const stripeBg = new StripeBackground();
stripeBg.start();

/**
 * 训练数据统计模块
 * - 使用 localStorage 存储训练记录
 * - 支持按游戏、日期查询
 * - 提供汇总统计和图表数据
 */
const StatsManager = {
  STORAGE_KEY: 'amblyopia_training_stats',

  _load() {
    try {
      const raw = localStorage.getItem(this.STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch {
      return [];
    }
  },

  _save(records) {
    try {
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(records));
    } catch {
      // storage full, remove oldest
      const all = this._load();
      all.shift();
      localStorage.setItem(this.STORAGE_KEY, JSON.stringify(all));
    }
  },

  /**
   * 记录一次训练
   * @param {string} gameId - 游戏ID
   * @param {string} gameName - 游戏名称
   * @param {number} score - 得分
   * @param {number} duration - 时长（秒）
   */
  record(gameId, gameName, score, duration) {
    const record = {
      id: Date.now(),
      gameId,
      gameName,
      score,
      duration,
      date: new Date().toISOString(),
    };
    const all = this._load();
    all.push(record);
    // 只保留最近1000条
    if (all.length > 1000) {
      all.splice(0, all.length - 1000);
    }
    this._save(all);
    return record;
  },

  /** 获取所有记录 */
  getAll() {
    return this._load();
  },

  /** 获取今天记录 */
  getToday() {
    const today = new Date().toISOString().slice(0, 10);
    return this._load().filter(r => r.date.slice(0, 10) === today);
  },

  /** 获取最近N天记录 */
  getRecentDays(days = 7) {
    const cutoff = new Date();
    cutoff.setDate(cutoff.getDate() - days);
    return this._load().filter(r => new Date(r.date) >= cutoff);
  },

  /** 获取汇总统计 */
  getSummary() {
    const all = this._load();
    const today = this.getToday();

    const totalDuration = all.reduce((s, r) => s + (r.duration || 0), 0);
    const todayDuration = today.reduce((s, r) => s + (r.duration || 0), 0);
    const totalGames = all.length;

    // 每个游戏的最高分
    const bestScores = {};
    all.forEach(r => {
      if (!bestScores[r.gameId] || r.score > bestScores[r.gameId]) {
        bestScores[r.gameId] = r.score;
      }
    });

    return {
      totalDuration,
      todayDuration,
      totalGames,
      todayGames: today.length,
      bestScores,
      streak: this._calcStreak(all),
    };
  },

  /** 计算连续训练天数 */
  _calcStreak(records) {
    if (records.length === 0) return 0;
    const dates = new Set(records.map(r => r.date.slice(0, 10)));
    let streak = 0;
    const d = new Date();
    while (dates.has(d.toISOString().slice(0, 10))) {
      streak++;
      d.setDate(d.getDate() - 1);
    }
    // 检查今天是否有记录
    const today = new Date().toISOString().slice(0, 10);
    if (!dates.has(today) && streak === 0) {
      // 检查昨天
      const yesterday = new Date(Date.now() - 86400000).toISOString().slice(0, 10);
      if (dates.has(yesterday)) {
        let s = 0;
        const d2 = new Date(Date.now() - 86400000);
        while (dates.has(d2.toISOString().slice(0, 10))) {
          s++;
          d2.setDate(d2.getDate() - 1);
        }
        return s;
      }
    }
    return streak;
  },

  /** 每日训练时长（最近N天） */
  getDailyDuration(days = 7) {
    const result = [];
    for (let i = days - 1; i >= 0; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const dateStr = d.toISOString().slice(0, 10);
      const dayRecords = this._load().filter(r => r.date.slice(0, 10) === dateStr);
      const total = dayRecords.reduce((s, r) => s + (r.duration || 0), 0);
      result.push({
        date: dateStr.slice(5), // MM-DD
        minutes: Math.round(total / 60 * 10) / 10,
      });
    }
    return result;
  },

  /** 清除所有记录 */
  clear() {
    localStorage.removeItem(this.STORAGE_KEY);
  },
};

/**
 * 游戏基类 - 所有游戏继承此类
 * 提供通用功能：画布管理、得分、计时、动态背景、触屏支持
 */
class BaseGame {
  constructor(config) {
    this.id = config.id;
    this.name = config.name;
    this.description = config.description || '';
    this.icon = config.icon || '🎮';
    this.duration = config.duration || 60;
    this.canvasId = config.canvasId || 'game-canvas';

    this.canvas = null;
    this.ctx = null;
    this.width = 0;
    this.height = 0;
    this.score = 0;
    this.timeLeft = this.duration;
    this.isRunning = false;
    this.isPaused = false;
    this.isEnded = false;
    this.startTime = 0;
    this.timer = null;
    this.animFrame = null;
    this.frameCount = 0;

    // 动态背景
    this.useDynamicBg = config.useDynamicBg !== false;

    // 存储事件处理器用于清理
    this._handlers = [];

    // 回调
    this.onScoreChange = null;
    this.onTimeChange = null;
    this.onGameOver = null;
  }

  /** 初始化画布 */
  initCanvas() {
    this.canvas = document.getElementById(this.canvasId);
    if (!this.canvas) return;

    this.ctx = this.canvas.getContext('2d');
    const container = this.canvas.parentElement;
    const maxW = container.clientWidth;
    const maxH = container.clientHeight;

    const ratio = Math.min(maxW / 400, maxH / 700, 1.2);
    this.width = Math.floor(400 * ratio);
    this.height = Math.floor(700 * ratio);

    this.canvas.width = this.width * window.devicePixelRatio;
    this.canvas.height = this.height * window.devicePixelRatio;
    this.canvas.style.width = this.width + 'px';
    this.canvas.style.height = this.height + 'px';
    this.ctx.setTransform(1, 0, 0, 1, 0, 0);
    this.ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
  }

  /**
   * 安全绑定触摸事件（自动清理）
   * @param {string} event - 事件名
   * @param {function} handler - 处理函数
   * @param {object} options - 选项
   */
  bindTouch(event, handler, options = {}) {
    const wrapped = (e) => {
      if (!this.isRunning) return;
      e.preventDefault();
      handler(e);
    };
    this.canvas.addEventListener(event, wrapped, { passive: false, ...options });
    this._handlers.push({ event, handler: wrapped });
    return wrapped;
  }

  /** 安全绑定鼠标事件（同时支持触摸） */
  bindInput(event, handler) {
    return this.bindTouch(event, handler);
  }

  /** 清理所有事件 */
  _cleanupEvents() {
    if (!this.canvas) return;
    for (const { event, handler } of this._handlers) {
      this.canvas.removeEventListener(event, handler);
    }
    this._handlers = [];
  }

  /** 开始游戏 */
  start() {
    this.initCanvas();
    this.score = 0;
    this.timeLeft = this.duration;
    this.isRunning = true;
    this.isEnded = false;
    this.startTime = Date.now();
    this.frameCount = 0;
    this._handlers = [];

    GameBackground.reset();
    this._notifyScore();
    this._notifyTime();

    this.onStart();
    this._startTimer();
    this._gameLoop();
  }

  /** 停止游戏 */
  stop() {
    this.isRunning = false;
    if (this.timer) clearInterval(this.timer);
    if (this.animFrame) cancelAnimationFrame(this.animFrame);
    this._cleanupEvents();
    this.onStop();
  }

  /** 结束游戏 */
  endGame() {
    if (this.isEnded) return;
    this.isEnded = true;
    this.isRunning = false;
    if (this.timer) clearInterval(this.timer);
    if (this.animFrame) cancelAnimationFrame(this.animFrame);
    this._cleanupEvents();

    const elapsed = Math.round((Date.now() - this.startTime) / 1000);
    this.onEnd();

    if (this.onGameOver) {
      this.onGameOver({
        gameId: this.id,
        gameName: this.name,
        score: this.score,
        duration: elapsed,
      });
    }
  }

  /** 增加分数 */
  addScore(points = 1) {
    this.score += points;
    this._notifyScore();
  }

  /**
   * 获取触摸坐标（相对于画布）
   * @param {TouchEvent|MouseEvent} e
   * @returns {{x: number, y: number}}
   */
  getTouchPos(e) {
    const rect = this.canvas.getBoundingClientRect();
    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
    return {
      x: (clientX - rect.left) * (this.width / rect.width),
      y: (clientY - rect.top) * (this.height / rect.height),
    };
  }

  // ===== 内部方法 =====

  _startTimer() {
    this.timer = setInterval(() => {
      if (!this.isRunning) return;
      this.timeLeft--;
      this._notifyTime();
      if (this.timeLeft <= 0) {
        this.endGame();
      }
    }, 1000);
  }

  _gameLoop() {
    if (!this.isRunning) return;
    this.frameCount++;
    this.onUpdate();
    this._drawBackground();
    this.onDraw();
    this.animFrame = requestAnimationFrame(() => this._gameLoop());
  }

  /** 绘制动态背景 */
  _drawBackground() {
    if (this.useDynamicBg) {
      GameBackground.draw(this.ctx, this.width, this.height, this.frameCount);
    } else {
      this.ctx.clearRect(0, 0, this.width, this.height);
    }
  }

  _notifyScore() {
    if (this.onScoreChange) this.onScoreChange(this.score);
  }

  _notifyTime() {
    if (this.onTimeChange) this.onTimeChange(this.timeLeft);
  }

  // ===== 子类重写 =====
  onStart() {}
  onStop() {}
  onEnd() {}
  onUpdate() {}
  onDraw() {}
}

/**
 * 弹跳游戏 - 点击屏幕让小球跳到上方平台
 */
class BounceGame extends BaseGame {
  constructor() {
    super({ id: 'bounce', name: '弹跳游戏', icon: '🏀', description: '点击让球跳起来', duration: 60 });
  }

  onStart() {
    this.ball = { x: this.width / 2, y: this.height * 0.7, radius: 20, vy: 0, color: '#FF6B6B' };
    this.platforms = [];
    this.gravity = 0.4;
    this.jumpForce = -9;
    this.cameraY = 0;

    for (let i = 0; i < 8; i++) {
      this._addPlatform(i * 90);
    }

    this.bindTouch('touchstart', () => {
      if (this.isRunning) this.ball.vy = this.jumpForce;
    });
    this.bindInput('mousedown', () => {
      if (this.isRunning) this.ball.vy = this.jumpForce;
    });
  }

  _addPlatform(baseY) {
    const pw = 70 + Math.random() * 40;
    this.platforms.push({
      x: 30 + Math.random() * (this.width - pw - 60),
      y: this.height - baseY - Math.random() * 20,
      w: pw, h: 14,
      color: `hsl(${Math.random() * 60 + 180}, 70%, 55%)`,
      scored: false,
    });
  }

  onUpdate() {
    if (this.ball.vy < 8) this.ball.vy += this.gravity;
    this.ball.y += this.ball.vy;

    if (this.ball.y < this.height * 0.35) {
      const diff = this.height * 0.35 - this.ball.y;
      this.ball.y += diff;
      this.cameraY += diff;
      this.platforms.forEach(p => { p.y += diff; });
      this.platforms = this.platforms.filter(p => p.y < this.height + 50);
      while (this.platforms.length < 8) {
        const lastP = this.platforms[this.platforms.length - 1];
        this._addPlatform(-lastP.y + this.height - 80 - Math.random() * 40);
      }
    }

    this.ball.x = Math.max(this.ball.radius, Math.min(this.width - this.ball.radius, this.ball.x));
    if (this.ball.y > this.height + 60) this.endGame();

    for (const p of this.platforms) {
      if (this.ball.vy > 0 &&
          this.ball.y + this.ball.radius > p.y &&
          this.ball.y + this.ball.radius < p.y + p.h + 15 &&
          this.ball.x > p.x - 5 && this.ball.x < p.x + p.w + 5) {
        this.ball.vy = this.jumpForce;
        if (!p.scored) { p.scored = true; this.addScore(1); }
      }
    }
  }

  onDraw() {
    const ctx = this.ctx;
    // 平台
    for (const p of this.platforms) {
      ctx.fillStyle = p.color;
      ctx.beginPath();
      const r = 7, x = p.x, y = p.y, w = p.w, h = p.h;
      ctx.moveTo(x + r, y); ctx.lineTo(x + w - r, y);
      ctx.arcTo(x + w, y, x + w, y + r, r); ctx.lineTo(x + w, y + h - r);
      ctx.arcTo(x + w, y + h, x + w - r, y + h, r); ctx.lineTo(x + r, y + h);
      ctx.arcTo(x, y + h, x, y + h - r, r); ctx.lineTo(x, y + r);
      ctx.arcTo(x, y, x + r, y, r); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.3)';
      ctx.fillRect(x + 4, y + 2, w - 8, 4);
    }

    // 球
    const b = this.ball;
    ctx.fillStyle = b.color;
    ctx.beginPath(); ctx.arc(b.x, b.y, b.radius, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.35)';
    ctx.beginPath(); ctx.arc(b.x - 5, b.y - 5, b.radius * 0.35, 0, Math.PI * 2); ctx.fill();
    // 表情
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(b.x - 6, b.y - 3, 4, 0, Math.PI * 2); ctx.arc(b.x + 6, b.y - 3, 4, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#333';
    ctx.beginPath(); ctx.arc(b.x - 5, b.y - 3, 2, 0, Math.PI * 2); ctx.arc(b.x + 7, b.y - 3, 2, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#333'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(b.x, b.y + 1, 8, 0.15 * Math.PI, 0.85 * Math.PI); ctx.stroke();
  }

  onStop() {}
}

/**
 * 贪吃蛇游戏 - 滑动控制蛇的方向吃食物
 */
class SnakeGame extends BaseGame {
  constructor() {
    super({ id: 'snake', name: '贪吃蛇', icon: '🐍', description: '滑动让蛇吃到好吃的水果', duration: 60 });
  }

  onStart() {
    this.gridSize = 22;
    this.cols = Math.floor(this.width / this.gridSize);
    this.rows = Math.floor(this.height / this.gridSize);

    this.snake = [{ x: Math.floor(this.cols / 2), y: Math.floor(this.rows / 2) }];
    this.dir = { x: 1, y: 0 };
    this.nextDir = { x: 1, y: 0 };
    this.food = this._spawnFood();
    this.moveTimer = 0;
    this.moveInterval = 10;

    this.touchStart = null;
    this.bindTouch('touchstart', (e) => {
      const t = e.touches[0];
      this.touchStart = { x: t.clientX, y: t.clientY };
    });
    this.bindTouch('touchmove', (e) => {
      if (!this.touchStart) return;
      const t = e.touches[0];
      const dx = t.clientX - this.touchStart.x;
      const dy = t.clientY - this.touchStart.y;
      if (Math.abs(dx) < 20 && Math.abs(dy) < 20) return;
      if (Math.abs(dx) > Math.abs(dy)) {
        this.nextDir = { x: dx > 0 ? 1 : -1, y: 0 };
      } else {
        this.nextDir = { x: 0, y: dy > 0 ? 1 : -1 };
      }
      this.touchStart = { x: t.clientX, y: t.clientY };
    });

    this._onKey = (e) => {
      const map = { ArrowUp: { x: 0, y: -1 }, ArrowDown: { x: 0, y: 1 }, ArrowLeft: { x: -1, y: 0 }, ArrowRight: { x: 1, y: 0 } };
      if (map[e.key]) this.nextDir = map[e.key];
    };
    document.addEventListener('keydown', this._onKey);
  }

  _spawnFood() {
    let pos;
    do { pos = { x: Math.floor(Math.random() * this.cols), y: Math.floor(Math.random() * this.rows) }; }
    while (this.snake.some(s => s.x === pos.x && s.y === pos.y));
    return pos;
  }

  onUpdate() {
    if (this.frameCount - this.moveTimer < this.moveInterval) return;
    this.moveTimer = this.frameCount;

    if (this.nextDir.x !== -this.dir.x || this.nextDir.y !== -this.dir.y) {
      this.dir = this.nextDir;
    }

    const head = this.snake[0];
    let nx = head.x + this.dir.x;
    let ny = head.y + this.dir.y;

    if (nx < 0) { nx = 0; this.dir.x = 1; this.nextDir.x = 1; }
    if (nx >= this.cols) { nx = this.cols - 1; this.dir.x = -1; this.nextDir.x = -1; }
    if (ny < 0) { ny = 0; this.dir.y = 1; this.nextDir.y = 1; }
    if (ny >= this.rows) { ny = this.rows - 1; this.dir.y = -1; this.nextDir.y = -1; }

    const newHead = { x: nx, y: ny };

    if (nx === this.food.x && ny === this.food.y) {
      this.snake.unshift(newHead);
      this.food = this._spawnFood();
      this.addScore(1);
      if (this.moveInterval > 4) this.moveInterval -= 0.3;
    } else {
      this.snake.unshift(newHead);
      this.snake.pop();
    }
  }

  onDraw() {
    const ctx = this.ctx;
    const gs = this.gridSize;

    // 网格
    ctx.strokeStyle = 'rgba(255,255,255,0.05)';
    ctx.lineWidth = 0.5;
    for (let x = 0; x < this.cols; x++)
      for (let y = 0; y < this.rows; y++)
        ctx.strokeRect(x * gs, y * gs, gs, gs);

    // 食物
    const foods = ['🍎', '🍊', '🍇', '🍓', '🍒', '🍑', '🥝', '🫐'];
    const emoji = foods[Math.floor(Date.now() / 800) % foods.length];
    ctx.font = `${gs * 1.3}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.fillText(emoji, this.food.x * gs + gs / 2, this.food.y * gs + gs / 2);

    // 蛇
    for (let i = this.snake.length - 1; i >= 0; i--) {
      const s = this.snake[i];
      const ratio = 1 - i / (this.snake.length + 10) * 0.5;
      const size = gs * ratio;
      const cx = s.x * gs + gs / 2;
      const cy = s.y * gs + gs / 2;

      if (i === 0) {
        ctx.fillStyle = '#4ECDC4';
        ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff';
        ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 3.5, 0, Math.PI * 2); ctx.arc(cx + 3, cy - 3, 3.5, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#333';
        ctx.beginPath(); ctx.arc(cx - 3, cy - 3, 1.8, 0, Math.PI * 2); ctx.arc(cx + 3, cy - 3, 1.8, 0, Math.PI * 2); ctx.fill();
      } else {
        ctx.fillStyle = `hsla(175, 60%, 55%, ${0.6 + ratio * 0.4})`;
        ctx.beginPath(); ctx.arc(cx, cy, size / 2, 0, Math.PI * 2); ctx.fill();
      }
    }
  }

  onStop() {
    document.removeEventListener('keydown', this._onKey);
  }
}

/**
 * 赛车游戏 - 左右移动躲避障碍物
 */
class RacingGame extends BaseGame {
  constructor() {
    super({ id: 'racing', name: '赛车游戏', icon: '🏎️', description: '滑动让赛车躲避障碍', duration: 60 });
  }

  onStart() {
    this.car = { x: this.width / 2, y: this.height * 0.75, w: 44, h: 64 };
    this.obstacles = [];
    this.roadOffset = 0;
    this.spawnTimer = 0;
    this.spawnInterval = 50;

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this.car.x = Math.max(this.car.w / 2 + 20, Math.min(this.width - this.car.w / 2 - 20, pos.x));
    });
    this.bindTouch('touchmove', (e) => {
      const pos = this.getTouchPos(e);
      this.car.x = Math.max(this.car.w / 2 + 20, Math.min(this.width - this.car.w / 2 - 20, pos.x));
    });
    this._onKey = (e) => {
      if (e.key === 'ArrowLeft') this.car.x -= 20;
      if (e.key === 'ArrowRight') this.car.x += 20;
      this.car.x = Math.max(this.car.w / 2 + 20, Math.min(this.width - this.car.w / 2 - 20, this.car.x));
    };
    document.addEventListener('keydown', this._onKey);
  }

  onUpdate() {
    this.roadOffset = (this.roadOffset + 3) % 40;
    this.spawnTimer++;
    if (this.spawnTimer >= this.spawnInterval) {
      this.spawnTimer = 0;
      this._spawnObstacle();
      if (this.spawnInterval > 20) this.spawnInterval -= 0.5;
    }

    for (const o of this.obstacles) o.y += o.speed;

    for (const o of this.obstacles) {
      if (Math.abs(this.car.x - o.x) < (this.car.w + o.w) / 2 - 10 &&
          Math.abs(this.car.y - o.y) < (this.car.h + o.h) / 2 - 10) {
        this.endGame(); return;
      }
    }

    const passed = this.obstacles.filter(o => o.y > this.height + 50 && !o.scored);
    for (const p of passed) { p.scored = true; this.addScore(1); }
    this.obstacles = this.obstacles.filter(o => o.y < this.height + 80);
  }

  _spawnObstacle() {
    const types = [
      { w: 38, h: 38, color: '#FF6B6B', shape: 'cone' },
      { w: 40, h: 32, color: '#FFE66D', shape: 'barrier' },
      { w: 34, h: 34, color: '#FF9F43', shape: 'rock' },
    ];
    const t = types[Math.floor(Math.random() * types.length)];
    this.obstacles.push({
      x: 55 + Math.random() * (this.width - 110), y: -40,
      w: t.w, h: t.h, color: t.color, shape: t.shape,
      speed: 2 + Math.random() * 2, scored: false,
    });
  }

  onDraw() {
    const ctx = this.ctx;
    // 道路
    ctx.fillStyle = 'rgba(80,80,80,0.8)';
    ctx.fillRect(20, 0, this.width - 40, this.height);
    // 标线
    ctx.fillStyle = '#FFE66D';
    for (let y = -this.roadOffset; y < this.height; y += 40) {
      ctx.fillRect(this.width / 2 - 2, y, 4, 20);
    }
    // 路边
    ctx.fillStyle = '#8B4513';
    ctx.fillRect(0, 0, 20, this.height);
    ctx.fillRect(this.width - 20, 0, 20, this.height);
    for (let y = -this.roadOffset; y < this.height; y += 30) {
      ctx.fillStyle = y % 60 < 30 ? '#FF6B6B' : '#fff';
      ctx.fillRect(2, y, 16, 14);
      ctx.fillRect(this.width - 18, y, 16, 14);
    }

    // 障碍物
    for (const o of this.obstacles) {
      ctx.fillStyle = o.color;
      if (o.shape === 'cone') {
        ctx.beginPath();
        ctx.moveTo(o.x, o.y - o.h / 2);
        ctx.lineTo(o.x - o.w / 2, o.y + o.h / 2);
        ctx.lineTo(o.x + o.w / 2, o.y + o.h / 2);
        ctx.fill();
      } else if (o.shape === 'barrier') {
        ctx.fillRect(o.x - o.w / 2, o.y - o.h / 2, o.w, o.h);
        ctx.fillStyle = '#fff';
        ctx.fillRect(o.x - o.w / 2 + 4, o.y - o.h / 2 + 4, o.w / 3, o.h / 3);
        ctx.fillRect(o.x + o.w / 6, o.y - o.h / 2 + 4, o.w / 3, o.h / 3);
      } else {
        ctx.beginPath(); ctx.arc(o.x, o.y, o.w / 2, 0, Math.PI * 2); ctx.fill();
      }
    }

    // 赛车
    const c = this.car;
    ctx.fillStyle = '#4ECDC4';
    ctx.beginPath(); ctx.roundRect(c.x - c.w / 2, c.y - c.h / 2, c.w, c.h, 8); ctx.fill();
    ctx.fillStyle = '#A8E6CF';
    ctx.fillRect(c.x - c.w * 0.25, c.y - c.h * 0.4, c.w * 0.5, c.h * 0.35);
    ctx.fillStyle = '#333';
    ctx.fillRect(c.x - c.w / 2 - 3, c.y - c.h / 3, 6, 12);
    ctx.fillRect(c.x + c.w / 2 - 3, c.y - c.h / 3, 6, 12);
    ctx.fillRect(c.x - c.w / 2 - 3, c.y + c.h / 3 - 6, 6, 12);
    ctx.fillRect(c.x + c.w / 2 - 3, c.y + c.h / 3 - 6, 6, 12);
  }

  onStop() {
    document.removeEventListener('keydown', this._onKey);
  }
}

/**
 * 坦克游戏 - 点击屏幕射击下落的目标
 */
class TankGame extends BaseGame {
  constructor() {
    super({ id: 'tank', name: '坦克射击', icon: '🎯', description: '点击目标来射击', duration: 60 });
  }

  onStart() {
    this.tank = { x: this.width / 2, y: this.height - 50, w: 50, h: 40 };
    this.bullets = [];
    this.targets = [];
    this.spawnTimer = 0;
    this.explosions = [];

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      // 先检查是否点击了目标
      for (let i = this.targets.length - 1; i >= 0; i--) {
        const t = this.targets[i];
        if (Math.hypot(pos.x - t.x, pos.y - t.y) < t.radius + 15) {
          this.explosions.push({ x: t.x, y: t.y, radius: t.radius, alpha: 1 });
          this.targets.splice(i, 1);
          this.addScore(1);
          return;
        }
      }
      // 否则发射子弹
      const angle = Math.atan2(pos.y - this.tank.y, pos.x - this.tank.x);
      this.bullets.push({ x: this.tank.x, y: this.tank.y - 15, vx: Math.cos(angle) * 6, vy: Math.sin(angle) * 6, life: 60 });
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      for (let i = this.targets.length - 1; i >= 0; i--) {
        const t = this.targets[i];
        if (Math.hypot(pos.x - t.x, pos.y - t.y) < t.radius + 15) {
          this.explosions.push({ x: t.x, y: t.y, radius: t.radius, alpha: 1 });
          this.targets.splice(i, 1);
          this.addScore(1);
          return;
        }
      }
    });
  }

  onUpdate() {
    this.spawnTimer++;
    const spawnRate = Math.max(20, 60 - this.score * 2);
    if (this.spawnTimer >= spawnRate) {
      this.spawnTimer = 0;
      this.targets.push({
        x: 40 + Math.random() * (this.width - 80), y: -30,
        radius: 18 + Math.random() * 15,
        speed: 0.8 + Math.random() * 1.5,
        color: ['#FF6B6B', '#FFE66D', '#FF9F43', '#EE5A24', '#FC427B'][Math.floor(Math.random() * 5)],
      });
    }

    for (const t of this.targets) t.y += t.speed;
    this.targets = this.targets.filter(t => t.y < this.height + 30);

    for (const b of this.bullets) { b.x += b.vx; b.y += b.vy; b.life--; }
    this.bullets = this.bullets.filter(b => b.life > 0 && b.x > 0 && b.x < this.width && b.y > 0 && b.y < this.height);

    for (let bi = this.bullets.length - 1; bi >= 0; bi--) {
      for (let ti = this.targets.length - 1; ti >= 0; ti--) {
        if (Math.hypot(this.bullets[bi].x - this.targets[ti].x, this.bullets[bi].y - this.targets[ti].y) < this.targets[ti].radius + 4) {
          this.explosions.push({ x: this.targets[ti].x, y: this.targets[ti].y, radius: this.targets[ti].radius, alpha: 1 });
          this.targets.splice(ti, 1);
          this.bullets.splice(bi, 1);
          this.addScore(1);
          break;
        }
      }
    }

    for (const e of this.explosions) { e.alpha -= 0.04; e.radius += 2; }
    this.explosions = this.explosions.filter(e => e.alpha > 0);
  }

  onDraw() {
    const ctx = this.ctx;
    // 地面
    ctx.fillStyle = 'rgba(139,105,20,0.6)';
    ctx.fillRect(0, this.height - 60, this.width, 60);
    ctx.fillStyle = 'rgba(107,79,18,0.6)';
    ctx.fillRect(0, this.height - 60, this.width, 4);

    // 目标
    for (const t of this.targets) {
      ctx.strokeStyle = t.color; ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.radius, 0, Math.PI * 2); ctx.stroke();
      ctx.fillStyle = t.color;
      ctx.beginPath(); ctx.arc(t.x, t.y, t.radius * 0.5, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(t.x, t.y - t.radius * 0.3); ctx.lineTo(t.x, t.y + t.radius * 0.3);
      ctx.moveTo(t.x - t.radius * 0.3, t.y); ctx.lineTo(t.x + t.radius * 0.3, t.y);
      ctx.stroke();
    }

    // 子弹
    ctx.fillStyle = '#FFE66D';
    for (const b of this.bullets) { ctx.beginPath(); ctx.arc(b.x, b.y, 4, 0, Math.PI * 2); ctx.fill(); }

    // 爆炸
    for (const e of this.explosions) {
      ctx.fillStyle = `rgba(255,200,50,${e.alpha})`;
      ctx.beginPath(); ctx.arc(e.x, e.y, e.radius, 0, Math.PI * 2); ctx.fill();
    }

    // 坦克
    const t = this.tank;
    ctx.fillStyle = '#444';
    ctx.fillRect(t.x - t.w / 2, t.y + 5, t.w, t.h - 10);
    ctx.fillStyle = '#5D8233';
    ctx.beginPath(); ctx.arc(t.x, t.y - 5, t.w * 0.45, Math.PI, 0); ctx.fill();
    ctx.fillRect(t.x - t.w * 0.45, t.y - 20, t.w * 0.9, t.h * 0.65);
    ctx.fillStyle = '#444'; ctx.fillRect(t.x - 3, t.y - 35, 6, 22);
    ctx.fillStyle = '#6B9B3A';
    ctx.beginPath(); ctx.arc(t.x, t.y - 12, 14, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#FFE66D'; ctx.font = '14px serif'; ctx.textAlign = 'center';
    ctx.fillText('⭐', t.x, t.y - 8);
  }

  onStop() {}
}

/**
 * 套牛游戏 - 在合适的时机点击套住移动的动物
 * 训练时机把握和手眼协调
 */
class RopeGame extends BaseGame {
  constructor() {
    super({ id: 'rope', name: '套牛游戏', icon: '🤠', description: '看准时机点击套住小动物', duration: 60 });
  }

  onStart() {
    this.animals = [];
    this.caughtAnimals = [];
    this.ropeAnimations = [];
    this.spawnTimer = 0;

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this._tryCatch(pos.x, pos.y);
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      this._tryCatch(pos.x, pos.y);
    });
  }

  _tryCatch(tx, ty) {
    // 检查是否套中动物
    for (let i = this.animals.length - 1; i >= 0; i--) {
      const a = this.animals[i];
      const dist = Math.hypot(tx - a.x, ty - a.y);
      if (dist < a.radius + 20) {
        this.caughtAnimals.push({
          x: a.x, y: a.y, emoji: a.emoji, alpha: 1, vy: -3,
        });
        this.animals.splice(i, 1);
        this.addScore(1);
        return;
      }
    }
    // 未命中动画
    this.ropeAnimations.push({ x: tx, y: ty, radius: 5, alpha: 1 });
  }

  onUpdate() {
    this.spawnTimer++;
    if (this.spawnTimer >= 45) {
      this.spawnTimer = 0;
      const animals = ['🐮', '🐷', '🐑', '🐔', '🐴', '🐰', '🐸', '🦆'];
      this.animals.push({
        x: -40, y: 80 + Math.random() * (this.height - 180),
        radius: 28,
        speed: 1 + Math.random() * 2,
        emoji: animals[Math.floor(Math.random() * animals.length)],
        wobble: Math.random() * Math.PI * 2,
      });
    }

    for (const a of this.animals) {
      a.x += a.speed;
      a.wobble += 0.03;
    }
    this.animals = this.animals.filter(a => a.x < this.width + 60);

    for (const c of this.caughtAnimals) { c.y += c.vy; c.alpha -= 0.02; }
    this.caughtAnimals = this.caughtAnimals.filter(c => c.alpha > 0);

    for (const r of this.ropeAnimations) { r.radius += 3; r.alpha -= 0.06; }
    this.ropeAnimations = this.ropeAnimations.filter(r => r.alpha > 0);
  }

  onDraw() {
    const ctx = this.ctx;

    // 草地
    ctx.fillStyle = 'rgba(34,139,34,0.3)';
    ctx.fillRect(0, this.height * 0.7, this.width, this.height * 0.3);

    // 围栏
    ctx.strokeStyle = '#8B6914';
    ctx.lineWidth = 3;
    for (let x = this.width - 20; x > 0; x -= 50) {
      ctx.beginPath();
      ctx.moveTo(x, this.height * 0.62);
      ctx.lineTo(x, this.height * 0.72);
      ctx.stroke();
    }
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(0, this.height * 0.65);
    ctx.lineTo(this.width, this.height * 0.65);
    ctx.moveTo(0, this.height * 0.7);
    ctx.lineTo(this.width, this.height * 0.7);
    ctx.stroke();

    // 动物
    ctx.font = '40px serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    for (const a of this.animals) {
      const dy = Math.sin(a.wobble) * 10;
      ctx.fillText(a.emoji, a.x, a.y + dy);
      // 触控区域指示
      ctx.strokeStyle = 'rgba(255,255,255,0.2)';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(a.x, a.y + dy, a.radius + 15, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 套索动画
    for (const r of this.ropeAnimations) {
      ctx.strokeStyle = `rgba(139,90,43,${r.alpha})`;
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.arc(r.x, r.y, r.radius, 0, Math.PI * 2); ctx.stroke();
    }

    // 被捕获
    ctx.font = '34px serif';
    for (const c of this.caughtAnimals) {
      ctx.globalAlpha = c.alpha;
      ctx.fillText(c.emoji, c.x, c.y);
      ctx.globalAlpha = 1;
    }

    // 人物
    ctx.font = '50px serif';
    ctx.fillText('🤠', this.width / 2, this.height - 20);
  }

  onStop() {}
}

/**
 * 消除水果游戏 - 点击相同水果消除
 */
class FruitGame extends BaseGame {
  constructor() {
    super({ id: 'fruit', name: '消除水果', icon: '🍉', description: '点击相同的水果消除它们', duration: 60 });
  }

  onStart() {
    this.cols = 6;
    this.rows = 8;
    this.cellSize = Math.min(
      Math.floor((this.width - 20) / this.cols),
      Math.floor((this.height - 20) / this.rows)
    );
    this.offsetX = (this.width - this.cols * this.cellSize) / 2;
    this.offsetY = (this.height - this.rows * this.cellSize) / 2;
    this.fruits = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒'];
    this.grid = [];
    this.eliminating = [];
    this._initGrid();

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this._handleTap(pos.x, pos.y);
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      this._handleTap(pos.x, pos.y);
    });
  }

  _initGrid() {
    this.grid = [];
    for (let r = 0; r < this.rows; r++) {
      this.grid[r] = [];
      for (let c = 0; c < this.cols; c++) {
        this.grid[r][c] = this.fruits[Math.floor(Math.random() * this.fruits.length)];
      }
    }
  }

  _handleTap(tx, ty) {
    const col = Math.floor((tx - this.offsetX) / this.cellSize);
    const row = Math.floor((ty - this.offsetY) / this.cellSize);
    if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return;

    const target = this.grid[row][col];
    if (!target) return;
    const group = this._findGroup(col, row, target);
    if (group.length >= 2) {
      for (const { col: c, row: r } of group) {
        this.eliminating.push({
          x: this.offsetX + c * this.cellSize + this.cellSize / 2,
          y: this.offsetY + r * this.cellSize + this.cellSize / 2,
          fruit: this.grid[r][c], alpha: 1, scale: 1,
        });
        this.grid[r][c] = null;
      }
      this.addScore(group.length);
      setTimeout(() => this._applyGravity(), 300);
    }
  }

  _findGroup(col, row, fruit) {
    const visited = new Set();
    const group = [];
    const stack = [{ col, row }];
    while (stack.length > 0) {
      const { col: c, row: r } = stack.pop();
      const key = `${c},${r}`;
      if (visited.has(key)) continue;
      if (c < 0 || c >= this.cols || r < 0 || r >= this.rows) continue;
      if (this.grid[r][c] !== fruit) continue;
      visited.add(key);
      group.push({ col: c, row: r });
      stack.push({ col: c + 1, row: r }, { col: c - 1, row: r }, { col: c, row: r + 1 }, { col: c, row: r - 1 });
    }
    return group;
  }

  _applyGravity() {
    for (let c = 0; c < this.cols; c++) {
      let writeRow = this.rows - 1;
      for (let r = this.rows - 1; r >= 0; r--) {
        if (this.grid[r][c] !== null) {
          this.grid[writeRow][c] = this.grid[r][c];
          if (writeRow !== r) this.grid[r][c] = null;
          writeRow--;
        }
      }
      for (let r = writeRow; r >= 0; r--) {
        this.grid[r][c] = this.fruits[Math.floor(Math.random() * this.fruits.length)];
      }
    }
  }

  onUpdate() {
    for (const e of this.eliminating) { e.alpha -= 0.04; e.scale += 0.03; }
    this.eliminating = this.eliminating.filter(e => e.alpha > 0);
  }

  onDraw() {
    const ctx = this.ctx;
    const cs = this.cellSize;

    ctx.fillStyle = 'rgba(255,255,255,0.05)';
    ctx.fillRect(this.offsetX, this.offsetY, this.cols * cs, this.rows * cs);

    ctx.font = `${cs * 0.7}px serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const fruit = this.grid[r][c];
        if (!fruit) continue;
        const cx = this.offsetX + c * cs + cs / 2;
        const cy = this.offsetY + r * cs + cs / 2;
        ctx.fillStyle = 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.roundRect(cx - cs / 2 + 2, cy - cs / 2 + 2, cs - 4, cs - 4, 8); ctx.fill();
        ctx.fillText(fruit, cx, cy);
      }
    }

    for (const e of this.eliminating) {
      ctx.globalAlpha = e.alpha;
      ctx.font = `${cs * 0.7 * e.scale}px serif`;
      ctx.fillText(e.fruit, e.x, e.y);
      ctx.globalAlpha = 1;
    }
  }

  onStop() {}
}

/**
 * 找不同游戏 - 两幅图中找出不同的那一个
 */
class SpotDiffGame extends BaseGame {
  constructor() {
    super({ id: 'spotdiff', name: '找不同', icon: '🔍', description: '找出哪个图案不一样', duration: 60 });
  }

  onStart() {
    this.cols = 3;
    this.rows = 2;
    this.level = 1;
    this.diffCol = 0;
    this.diffRow = 0;
    this.found = false;
    this._generateLevel();
  }

  _generateLevel() {
    this.cols = Math.min(3 + Math.floor(this.level / 3), 5);
    this.rows = 2 + Math.floor(this.level / 5);
    this.diffCol = Math.floor(Math.random() * this.cols);
    this.diffRow = Math.floor(Math.random() * this.rows);
    this.found = false;

    const shapes = ['circle', 'square', 'triangle', 'star', 'heart'];
    const colors = ['#FF6B6B', '#4ECDC4', '#FFE66D', '#FF9F43', '#A29BFE', '#FD79A8'];
    this.baseShape = shapes[Math.floor(Math.random() * shapes.length)];
    this.baseColor = colors[Math.floor(Math.random() * colors.length)];

    const diffColors = colors.filter(c => c !== this.baseColor);
    const diffShapes = shapes.filter(s => s !== this.baseShape);
    this.diffColor = diffColors[Math.floor(Math.random() * diffColors.length)];
    this.diffShape = Math.random() < 0.5 ? this.baseShape : diffShapes[Math.floor(Math.random() * diffShapes.length)];

    if (this.level < 3) {
      this.diffColor = this.baseColor === '#FF6B6B' ? '#4ECDC4' : '#FF6B6B';
    }

    this.bindTouch('touchstart', (e) => {
      if (this.found) return;
      const pos = this.getTouchPos(e);
      const marginX = (this.width - this.cols * 100) / 2;
      const marginY = 100;
      const col = Math.floor((pos.x - marginX) / 100);
      const row = Math.floor((pos.y - marginY) / 110);
      if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return;
      if (col === this.diffCol && row === this.diffRow) {
        this.found = true;
        this.addScore(this.level * 5);
        this.level++;
        setTimeout(() => this._generateLevel(), 800);
      }
    });
    this.bindInput('mousedown', (e) => {
      if (this.found) return;
      const pos = this.getTouchPos(e);
      const marginX = (this.width - this.cols * 100) / 2;
      const marginY = 100;
      const col = Math.floor((pos.x - marginX) / 100);
      const row = Math.floor((pos.y - marginY) / 110);
      if (col < 0 || col >= this.cols || row < 0 || row >= this.rows) return;
      if (col === this.diffCol && row === this.diffRow) {
        this.found = true;
        this.addScore(this.level * 5);
        this.level++;
        setTimeout(() => this._generateLevel(), 800);
      }
    });
  }

  _drawShape(ctx, x, y, shape, color, size = 35) {
    ctx.fillStyle = color;
    ctx.beginPath();
    switch (shape) {
      case 'circle': ctx.arc(x, y, size * 0.6, 0, Math.PI * 2); break;
      case 'square': ctx.roundRect(x - size * 0.5, y - size * 0.5, size, size, 6); break;
      case 'triangle':
        ctx.moveTo(x, y - size * 0.6);
        ctx.lineTo(x - size * 0.6, y + size * 0.5);
        ctx.lineTo(x + size * 0.6, y + size * 0.5);
        ctx.closePath(); break;
      case 'star':
        for (let i = 0; i < 5; i++) {
          const a = (i * 4 * Math.PI) / 5 - Math.PI / 2;
          const px = x + Math.cos(a) * size * 0.6;
          const py = y + Math.sin(a) * size * 0.6;
          i === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py);
          const ia = a + (2 * Math.PI) / 5;
          ctx.lineTo(x + Math.cos(ia) * size * 0.25, y + Math.sin(ia) * size * 0.25);
        }
        ctx.closePath(); break;
      case 'heart':
        ctx.moveTo(x, y + size * 0.3);
        ctx.bezierCurveTo(x - size * 0.5, y - size * 0.3, x - size * 0.25, y - size * 0.6, x, y - size * 0.2);
        ctx.bezierCurveTo(x + size * 0.25, y - size * 0.6, x + size * 0.5, y - size * 0.3, x, y + size * 0.3);
        break;
    }
    ctx.fill();
  }

  onDraw() {
    const ctx = this.ctx;
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 22px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('找出不一样的那个！', this.width / 2, 35);
    ctx.font = '14px sans-serif'; ctx.fillStyle = 'rgba(255,255,255,0.7)';
    ctx.fillText(`第 ${this.level} 关`, this.width / 2, 60);

    const marginX = (this.width - this.cols * 100) / 2;
    const marginY = 100;

    for (let r = 0; r < this.rows; r++) {
      for (let c = 0; c < this.cols; c++) {
        const cx = marginX + c * 100 + 50;
        const cy = marginY + r * 110 + 55;
        ctx.fillStyle = (this.found && c === this.diffCol && r === this.diffRow)
          ? 'rgba(78,205,196,0.3)' : 'rgba(255,255,255,0.08)';
        ctx.beginPath(); ctx.roundRect(cx - 42, cy - 48, 84, 96, 12); ctx.fill();

        const isDiff = c === this.diffCol && r === this.diffRow;
        this._drawShape(ctx, cx, cy, isDiff ? this.diffShape : this.baseShape, isDiff ? this.diffColor : this.baseColor);

        if (this.found && isDiff) {
          ctx.strokeStyle = '#4ECDC4'; ctx.lineWidth = 3;
          ctx.beginPath(); ctx.roundRect(cx - 42, cy - 48, 84, 96, 12); ctx.stroke();
          ctx.fillText('✅', cx, cy + 55);
        }
      }
    }
  }

  onStop() {}
}

/**
 * 找到规定的东西 - 在一堆物品中找到要求的目标
 */
class FindItGame extends BaseGame {
  constructor() {
    super({ id: 'findit', name: '找到物品', icon: '🔎', description: '找到要求的那个物品', duration: 60 });
  }

  onStart() {
    this.targetEmoji = '';
    this.items = [];
    this.foundCount = 0;
    this.level = 1;
    this._generatePuzzle();

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this._handleTap(pos.x, pos.y);
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      this._handleTap(pos.x, pos.y);
    });
  }

  _handleTap(tx, ty) {
    for (let i = this.items.length - 1; i >= 0; i--) {
      const item = this.items[i];
      if (item.emoji !== this.targetEmoji) continue;
      if (Math.hypot(tx - item.x, ty - item.y) < 32) {
        this.items.splice(i, 1);
        this.addScore(1);
        this.foundCount++;
        if (this.foundCount >= this.level + 2) {
          this.level++;
          setTimeout(() => this._generatePuzzle(), 500);
        }
        return;
      }
    }
  }

  _generatePuzzle() {
    const allEmojis = ['🍎', '🍊', '🍋', '🍇', '🍓', '🍒', '🍑', '🥝',
      '🐱', '🐶', '🐰', '🐸', '🐻', '🐼', '🐨', '🦊',
      '⭐', '❤️', '🌸', '🌈', '☀️', '🌙', '⚽', '🎈'];
    const itemCount = 12 + this.level * 2;

    this.targetEmoji = allEmojis[Math.floor(Math.random() * allEmojis.length)];
    const targetCount = this.level + 2;
    this.foundCount = 0;
    this.items = [];

    const usedPositions = [];
    const margin = 40;

    const addItem = (emoji) => {
      let x, y, attempts = 0;
      do {
        x = margin + Math.random() * (this.width - 2 * margin);
        y = 110 + Math.random() * (this.height - 150);
        attempts++;
      } while (attempts < 50 && usedPositions.some(p => Math.hypot(p.x - x, p.y - y) < 50));
      usedPositions.push({ x, y });
      this.items.push({ emoji, x, y, size: 26 + Math.random() * 8 });
    };

    for (let i = 0; i < targetCount; i++) addItem(this.targetEmoji);
    const distractors = allEmojis.filter(e => e !== this.targetEmoji);
    for (let i = 0; i < itemCount - targetCount; i++) {
      addItem(distractors[Math.floor(Math.random() * distractors.length)]);
    }
    this.items.sort(() => Math.random() - 0.5);
  }

  onDraw() {
    const ctx = this.ctx;
    // 目标提示
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.beginPath(); ctx.roundRect(this.width / 2 - 130, 10, 260, 70, 20); ctx.fill();
    ctx.fillStyle = '#FFE66D'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('请找到所有的', this.width / 2, 40);
    ctx.font = '38px serif'; ctx.fillText(this.targetEmoji, this.width / 2, 72);
    ctx.fillStyle = 'rgba(255,255,255,0.7)'; ctx.font = '14px sans-serif';
    ctx.fillText(`剩余: ${this.level + 2 - this.foundCount} | 第${this.level}关`, this.width / 2, 95);

    ctx.textBaseline = 'middle';
    for (const item of this.items) {
      ctx.font = `${item.size}px serif`;
      ctx.fillText(item.emoji, item.x, item.y);
    }
  }

  onStop() {}
}

/**
 * E字游戏 - 视力E字表训练
 * 显示不同方向和大小的E，宝宝指出E的开口方向
 */
class EChartGame extends BaseGame {
  constructor() {
    super({ id: 'echart', name: 'E字游戏', icon: '👁️', description: '指出E的开口方向', duration: 60 });
  }

  onStart() {
    this.currentE = null;
    this.level = 1;
    this.correctCount = 0;
    this.showFeedback = false;
    this.feedbackCorrect = false;
    this._generateE();

    this.bindTouch('touchstart', (e) => {
      if (this.showFeedback) return;
      const pos = this.getTouchPos(e);
      this._checkAnswer(pos.x, pos.y);
    });
    this.bindInput('mousedown', (e) => {
      if (this.showFeedback) return;
      const pos = this.getTouchPos(e);
      this._checkAnswer(pos.x, pos.y);
    });
  }

  _generateE() {
    const minSize = Math.max(30, 100 - this.level * 8);
    const maxSize = Math.max(50, 150 - this.level * 10);
    const size = minSize + Math.random() * (maxSize - minSize);
    const rotations = [0, Math.PI / 2, Math.PI, -Math.PI / 2];
    const rotation = rotations[Math.floor(Math.random() * 4)];
    const margin = size;
    this.currentE = {
      size, rotation,
      x: margin + Math.random() * (this.width - 2 * margin),
      y: 120 + Math.random() * (this.height - 140 - margin),
    };
  }

  _rotationToDir(rotation) {
    if (Math.abs(rotation) < 0.1) return 'right';
    if (Math.abs(rotation - Math.PI / 2) < 0.1) return 'down';
    if (Math.abs(Math.abs(rotation) - Math.PI) < 0.1) return 'left';
    return 'up';
  }

  _angleToDir(angle) {
    if (angle > -Math.PI / 4 && angle <= Math.PI / 4) return 'right';
    if (angle > Math.PI / 4 && angle <= 3 * Math.PI / 4) return 'down';
    if (angle > -3 * Math.PI / 4 && angle <= -Math.PI / 4) return 'up';
    return 'left';
  }

  _checkAnswer(tx, ty) {
    const cx = this.currentE.x;
    const cy = this.currentE.y;
    const angle = Math.atan2(ty - cy, tx - cx);
    const dir = this._angleToDir(angle);
    const correctDir = this._rotationToDir(this.currentE.rotation);

    if (dir === correctDir) {
      this.correctCount++;
      this.showFeedback = true;
      this.feedbackCorrect = true;
      this.addScore(this.level * 2);
      this.level = Math.min(8, Math.floor(this.correctCount / 3) + 1);
    } else {
      this.showFeedback = true;
      this.feedbackCorrect = false;
      if (this.level > 1 && this.correctCount % 3 === 0) this.level = Math.max(1, this.level - 1);
    }
    setTimeout(() => { this.showFeedback = false; this._generateE(); }, 600);
  }

  _drawE(ctx, x, y, size, rotation) {
    ctx.save();
    ctx.translate(x, y);
    ctx.rotate(rotation);
    const sw = size / 5;
    ctx.strokeStyle = '#fff'; ctx.lineWidth = sw; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
    ctx.beginPath(); ctx.moveTo(-size / 2, -size / 2); ctx.lineTo(-size / 2, size / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-size / 2, -size / 2); ctx.lineTo(size / 2, -size / 2); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-size / 2, 0); ctx.lineTo(size / 2 * 0.6, 0); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(-size / 2, size / 2); ctx.lineTo(size / 2, size / 2); ctx.stroke();
    ctx.restore();
  }

  onDraw() {
    const ctx = this.ctx;
    ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
    ctx.fillText('E的开口朝哪个方向？', this.width / 2, 30);
    ctx.fillText('点击E字的开口方向', this.width / 2, 52);
    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '14px sans-serif';
    ctx.fillText(`难度: ${this.level}/8 | 正确: ${this.correctCount}`, this.width / 2, 72);

    if (!this.showFeedback && this.currentE) {
      const cx = this.currentE.x, cy = this.currentE.y;
      ctx.fillStyle = 'rgba(255,255,255,0.15)';
      const indicators = [
        { x: cx + 100, y: cy, t: '右→' },
        { x: cx, y: cy + 100, t: '↓下' },
        { x: cx - 100, y: cy, t: '←左' },
        { x: cx, y: cy - 100, t: '↑上' },
      ];
      for (const ind of indicators) {
        ctx.fillStyle = 'rgba(255,255,255,0.1)';
        ctx.beginPath(); ctx.arc(ind.x, ind.y, 28, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.6)'; ctx.font = 'bold 14px sans-serif';
        ctx.fillText(ind.t, ind.x, ind.y + 4);
      }
    }

    if (this.currentE) {
      if (this.showFeedback) {
        ctx.fillStyle = this.feedbackCorrect ? 'rgba(78,205,196,0.2)' : 'rgba(255,107,107,0.2)';
        ctx.beginPath(); ctx.arc(this.currentE.x, this.currentE.y, this.currentE.size * 0.8, 0, Math.PI * 2); ctx.fill();
      }
      this._drawE(ctx, this.currentE.x, this.currentE.y, this.currentE.size, this.currentE.rotation);
    }

    if (this.showFeedback) {
      ctx.fillStyle = this.feedbackCorrect ? '#4ECDC4' : '#FF6B6B';
      ctx.font = 'bold 32px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(this.feedbackCorrect ? '✓ 对了!' : '✗ 再试试', this.width / 2, this.height - 20);
    }
  }

  onStop() {}
}

/**
 * 病毒游戏 - 点击消灭屏幕上的病毒
 */
class VirusGame extends BaseGame {
  constructor() {
    super({ id: 'virus', name: '消灭病毒', icon: '🦠', description: '点击消灭出现的病毒', duration: 60 });
  }

  onStart() {
    this.viruses = [];
    this.effects = [];
    this.spawnTimer = 0;
    this.maxViruses = 5;

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      this._tryHit(pos.x, pos.y);
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      this._tryHit(pos.x, pos.y);
    });
  }

  _tryHit(tx, ty) {
    for (let i = this.viruses.length - 1; i >= 0; i--) {
      const v = this.viruses[i];
      if (Math.hypot(tx - v.x, ty - v.y) < v.radius + 15) {
        for (let j = 0; j < 6; j++) {
          const angle = (j / 6) * Math.PI * 2;
          this.effects.push({ x: v.x, y: v.y, vx: Math.cos(angle) * 3, vy: Math.sin(angle) * 3, color: v.color, alpha: 1, size: 4 + Math.random() * 4 });
        }
        this.viruses.splice(i, 1);
        this.addScore(1);
        return;
      }
    }
  }

  onUpdate() {
    this.spawnTimer++;
    const spawnRate = Math.max(25, 55 - this.score * 0.5);
    if (this.spawnTimer >= spawnRate && this.viruses.length < this.maxViruses + Math.floor(this.score / 10)) {
      this.spawnTimer = 0;
      const colors = ['#FF6B6B', '#FF9F43', '#EE5A24', '#FC427B', '#FF4757', '#FF6348'];
      const side = Math.floor(Math.random() * 4);
      let x, y;
      switch (side) {
        case 0: x = -30; y = Math.random() * this.height; break;
        case 1: x = this.width + 30; y = Math.random() * this.height; break;
        case 2: x = Math.random() * this.width; y = -30; break;
        case 3: x = Math.random() * this.width; y = this.height + 30; break;
      }
      this.viruses.push({
        x, y,
        targetX: 50 + Math.random() * (this.width - 100),
        targetY: 100 + Math.random() * (this.height - 150),
        radius: 15 + Math.random() * 10,
        color: colors[Math.floor(Math.random() * colors.length)],
        speed: 1 + Math.random() * 1.5,
        wobble: Math.random() * Math.PI * 2,
        wobbleSpeed: 0.02 + Math.random() * 0.03,
        phase: Math.random() * Math.PI * 2,
      });
    }

    for (const v of this.viruses) {
      v.wobble += v.wobbleSpeed;
      const dx = v.targetX - v.x, dy = v.targetY - v.y;
      const dist = Math.hypot(dx, dy);
      if (dist > 5) { v.x += (dx / dist) * v.speed; v.y += (dy / dist) * v.speed; }
      else { v.targetX = 50 + Math.random() * (this.width - 100); v.targetY = 100 + Math.random() * (this.height - 150); }
    }

    for (const e of this.effects) { e.x += e.vx; e.y += e.vy; e.alpha -= 0.04; e.size *= 0.98; }
    this.effects = this.effects.filter(e => e.alpha > 0);
  }

  onDraw() {
    const ctx = this.ctx;
    // 网格
    ctx.strokeStyle = 'rgba(78,205,196,0.06)'; ctx.lineWidth = 1;
    for (let x = 0; x < this.width; x += 30) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, this.height); ctx.stroke(); }
    for (let y = 0; y < this.height; y += 30) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(this.width, y); ctx.stroke(); }

    for (const v of this.viruses) {
      const x = v.x + Math.sin(v.wobble) * 8;
      const y = v.y + Math.cos(v.wobble * 1.3) * 5;
      const glow = ctx.createRadialGradient(x, y, v.radius * 0.3, x, y, v.radius * 1.5);
      glow.addColorStop(0, v.color); glow.addColorStop(1, 'transparent');
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(x, y, v.radius * 1.5, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = v.color;
      ctx.beginPath(); ctx.arc(x, y, v.radius, 0, Math.PI * 2); ctx.fill();

      ctx.strokeStyle = v.color; ctx.lineWidth = 2.5;
      for (let i = 0; i < 8; i++) {
        const a = (i / 8) * Math.PI * 2 + v.phase;
        ctx.beginPath();
        ctx.moveTo(x + Math.cos(a) * v.radius * 0.7, y + Math.sin(a) * v.radius * 0.7);
        ctx.lineTo(x + Math.cos(a) * v.radius * 1.35, y + Math.sin(a) * v.radius * 1.35);
        ctx.stroke();
      }

      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x - v.radius * 0.3, y - v.radius * 0.2, v.radius * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + v.radius * 0.3, y - v.radius * 0.2, v.radius * 0.28, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#333';
      ctx.beginPath(); ctx.arc(x - v.radius * 0.25, y - v.radius * 0.2, v.radius * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.arc(x + v.radius * 0.35, y - v.radius * 0.2, v.radius * 0.14, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#333'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y + v.radius * 0.25, v.radius * 0.2, 0, Math.PI); ctx.stroke();
    }

    for (const e of this.effects) {
      ctx.fillStyle = e.color.replace(')', `,${e.alpha})`).replace('rgb', 'rgba');
      if (e.color.startsWith('#')) {
        ctx.fillStyle = `rgba(255,${e.alpha})`;
      }
      ctx.beginPath(); ctx.arc(e.x, e.y, e.size, 0, Math.PI * 2); ctx.fill();
    }
  }

  onStop() {}
}

/**
 * 打地鼠游戏 - 点击从洞里冒出来的小动物
 * 训练反应速度和手眼协调
 */
class WhackGame extends BaseGame {
  constructor() {
    super({ id: 'whack', name: '打地鼠', icon: '🔨', description: '点击冒出来的小动物', duration: 60 });
  }

  onStart() {
    this.holes = [];
    this.moles = []; // { holeIndex, timer, emoji, state: 'up'|'down' }
    this.hitEffects = [];
    const cols = 3, rows = 3;
    const marginX = (this.width - cols * 90) / 2;
    const marginY = this.height * 0.25;

    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        this.holes.push({
          x: marginX + c * 90 + 45,
          y: marginY + r * 100 + 45,
        });
      }
    }

    // 定时生成地鼠
    this._spawnInterval = setInterval(() => {
      if (!this.isRunning) return;
      if (this.moles.length < 3 + Math.floor(this.score / 5)) {
        const holeIdx = Math.floor(Math.random() * this.holes.length);
        if (!this.moles.some(m => m.holeIndex === holeIdx)) {
          const emojis = ['🐹', '🐰', '🐸', '🐻', '🦊', '🐼', '🐨', '🐷'];
          this.moles.push({
            holeIndex: holeIdx,
            emoji: emojis[Math.floor(Math.random() * emojis.length)],
            timer: 40 + Math.random() * 40,
          });
        }
      }
    }, 800);

    this.bindTouch('touchstart', (e) => {
      const pos = this.getTouchPos(e);
      for (let i = this.moles.length - 1; i >= 0; i--) {
        const m = this.moles[i];
        const h = this.holes[m.holeIndex];
        if (Math.hypot(pos.x - h.x, pos.y - h.y) < 40) {
          this.hitEffects.push({ x: h.x, y: h.y, alpha: 1 });
          this.moles.splice(i, 1);
          this.addScore(1);
          return;
        }
      }
    });
    this.bindInput('mousedown', (e) => {
      const pos = this.getTouchPos(e);
      for (let i = this.moles.length - 1; i >= 0; i--) {
        const m = this.moles[i];
        const h = this.holes[m.holeIndex];
        if (Math.hypot(pos.x - h.x, pos.y - h.y) < 40) {
          this.hitEffects.push({ x: h.x, y: h.y, alpha: 1 });
          this.moles.splice(i, 1);
          this.addScore(1);
          return;
        }
      }
    });
  }

  onUpdate() {
    for (let i = this.moles.length - 1; i >= 0; i--) {
      this.moles[i].timer--;
      if (this.moles[i].timer <= 0) {
        this.moles.splice(i, 1);
      }
    }
    for (const e of this.hitEffects) { e.alpha -= 0.05; }
    this.hitEffects = this.hitEffects.filter(e => e.alpha > 0);
  }

  onDraw() {
    const ctx = this.ctx;
    // 地面
    ctx.fillStyle = 'rgba(139,90,43,0.4)';
    ctx.fillRect(0, this.height * 0.2, this.width, this.height * 0.8);

    // 洞
    for (const h of this.holes) {
      ctx.fillStyle = 'rgba(0,0,0,0.5)';
      ctx.beginPath(); ctx.ellipse(h.x, h.y + 10, 40, 15, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = 'rgba(60,30,10,0.6)';
      ctx.beginPath(); ctx.arc(h.x, h.y - 5, 38, 0, Math.PI); ctx.fill();
    }

    // 地鼠
    ctx.font = '36px serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const m of this.moles) {
      const h = this.holes[m.holeIndex];
      const popUp = Math.min(1, (40 - Math.max(0, m.timer - 30)) / 10); // 弹起动画
      const y = h.y - 10 - popUp * 35;
      ctx.fillText(m.emoji, h.x, y);
      // 身体
      ctx.fillStyle = 'rgba(139,90,43,0.5)';
      ctx.beginPath(); ctx.arc(h.x, h.y + 5, 30 * popUp, 0, Math.PI * 2); ctx.fill();
    }

    // 击打特效
    for (const e of this.hitEffects) {
      ctx.fillStyle = `rgba(255,230,100,${e.alpha})`;
      ctx.font = `${30 + (1 - e.alpha) * 20}px serif`;
      ctx.fillText('💥', e.x, e.y - (1 - e.alpha) * 20);
    }

    ctx.fillStyle = 'rgba(255,255,255,0.5)'; ctx.font = '14px sans-serif';
    ctx.fillText(`已打到: ${this.score}个`, this.width / 2, this.height * 0.15);
  }

  onStop() {
    if (this._spawnInterval) clearInterval(this._spawnInterval);
  }
}
